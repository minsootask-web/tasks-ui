// ============ Event handlers (CRUD) ============
// active.md 변경 하나를 저장하고 다시 그린다. op는 (content) => content.
// 반환값: 성공 true / 실패 false. quiet이면 오류를 토스트로 알리지 않고 호출자(시트)가 보여준다.
// 409(다른 기기 변경)는 스토어가 최신본 위에 다시 적용해 재시도한다.
async function safeMutate(op, msg, label, { quiet = false, flash = null, failMsg } = {}) {
  if (!quiet) {
    // 즉시 반영(B9): 화면을 먼저 바꾸고, 실패하면 원위치 + 행 깜빡임 + 다시 시도
    const pr = activeStore.apply(op, { msg });
    renderApp();
    try {
      await pr;
      return true;
    } catch (e) {
      lastMutateError = e;
      renderApp();
      if (flash) flashTaskRows([flash]);
      if (e && e.gone) notifyError(e);
      else notifyError(e, { fallback: failMsg, retry: () => safeMutate(op, msg, label, { flash, failMsg }) });
      return false;
    }
  }
  // 시트(quiet): 저장이 끝날 때까지 기다린 뒤 닫는다(A2)
  try {
    await activeStore.commit(op, { msg });
    renderApp();
    return true;
  } catch (e) {
    lastMutateError = e;
    renderApp(); // 실패한 연산은 버려졌으니 원래 모습으로
    if (!quiet) notifyError(e); else console.error(e);
    return false;
  }
}
let lastMutateError = null;

// 체크 — 화면은 즉시, 저장은 400ms 모아서 한 번에(연속 체크 = PUT 1번).
// 저장 실패해도 체크를 말없이 되돌리지 않는다: 연산을 남겨 두고 "저장 안 됨 · 다시 시도"(A3).
// 체크 여러 개를 한 번에(원문 줄로 각각 다시 찾음)
const opSetChecks = (list) => (c) => list.reduce((acc, { item, checked }) => toggleAt(lineOf(item, acc), checked, acc), c);

// 부모 아래 미완료 하위(모든 깊이)
function incompleteDescendants(item) {
  const sec = state.sections.find((s) => s.items.some((i) => i.lineIndex === item.lineIndex && i.raw === item.raw));
  if (!sec) return [];
  const pos = sec.items.findIndex((i) => i.lineIndex === item.lineIndex);
  const out = [];
  for (let k = pos + 1; k < sec.items.length && sec.items[k].indent > item.indent; k++) {
    const it = sec.items[k];
    if (it.type === 'task' && !it.checked) out.push(it);
  }
  return out;
}

// 하위 체크박스를 위에서부터 40ms 간격으로 차례로 튀며 체크(최대 5개까지 차례, 나머지는 함께)
function popChildChecks(parentEl, kids) {
  const card = parentEl.closest('.card');
  if (!card) return;
  kids.forEach((k, i) => {
    const row = card.querySelector(`.task[data-line="${k.lineIndex}"]`);
    if (!row) return;
    const cb = row.querySelector('input[type="checkbox"]');
    const go = () => {
      cb.checked = true;
      row.classList.add('done');
      if (!prefersReducedMotion()) { cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop'); }
    };
    const delay = prefersReducedMotion() ? 0 : Math.min(i, 5) * 40;
    if (delay) setTimeout(go, delay); else go();
  });
}

function onToggle(item, checked, el, cb) {
  try {
    resolveLineIndex(item);
  } catch (e) {
    // 그 사이 항목이 사라졌다 — 체크 상태를 되돌리고 최신 목록으로 다시 그린다
    if (cb) cb.checked = !checked;
    toast(e.message);
    renderApp();
    return;
  }
  el.classList.toggle('done', checked);
  // 상위 항목을 체크하면 800ms 머문 뒤 "완료 n개"로 들어감. 머무는 동안 다시 누르면 취소
  if (item.indent === 0) {
    if (checked) startLinger(item);
    else cancelLinger(item);
  }
  postponeFold(); // 연속 체크 중에는 접지 않고 마지막 체크 뒤 한꺼번에(R9)
  // 부모 완료 = 미완료 하위도 완료(B11). 체크 해제는 부모만
  const kids = checked ? incompleteDescendants(item) : [];
  const op = kids.length
    ? opSetChecks([{ item, checked: true }, ...kids.map((k) => ({ item: k, checked: true }))])
    : opToggle(item, checked);
  if (kids.length) {
    popChildChecks(el, kids);
    notify.undo(`하위 할 일 ${kids.length}개도 완료했어요`, () => {
      // 부모·하위 모두 원래 상태(미완료)로 정확히 되돌림
      cancelLinger(item);
      activeStore.apply(opSetChecks([{ item, checked: false }, ...kids.map((k) => ({ item: k, checked: false }))]),
        { msg: 'undo complete with subtasks', debounce: 400, onFail: 'keep', idem: true })
        .then(() => { if (currentTab === 'active' && !isEditingUI() && !dragCtx.active) renderApp(); })
        .catch((e) => notifyError(e)); // 다시 시도는 헤더 알약(D10①)
      renderApp();
    });
  }
  setLastUndo(() => {
    if (kids.length) {
      cancelLinger(item);
      activeStore.apply(opSetChecks([{ item, checked: false }, ...kids.map((k) => ({ item: k, checked: false }))]), { msg: 'undo check', debounce: 400, onFail: 'keep', idem: true }).catch(() => {});
    } else {
      if (checked && item.indent === 0) cancelLinger(item);
      activeStore.apply(opToggle(item, !checked), { msg: 'undo check', debounce: 400, onFail: 'keep', idem: true }).catch(() => {});
    }
    renderApp();
  }, item.text);
  activeStore.apply(op, { msg: 'toggle tasks', debounce: 400, onFail: 'keep', idem: true })
    .then(() => {
      // 다른 저장이 남아 있지 않을 때만 다시 그림(줄 번호 정리). 남아 있으면 다음 저장이 처리
      if (!activeStore.hasPending() && currentTab === 'active' && !isEditingUI() && !dragCtx.active) renderApp();
    })
    .catch((e) => {
      if (e && e.gone) { toast(e.message); renderApp(); return; }
      notifyError(e); // 다시 시도는 헤더 알약 하나로(D10①)
    });
}


function onEdit(item, text, opts, rec = null) {
  return safeMutate(opEdit(item, text, rec), `edit: ${text}`, '수정됨', opts);
}

async function onDelete(item, rowEl = null) {
  // 상위·하위 모두 보관함으로(하위만 영구 삭제되던 문제 A6)
  const run = async () => {
    let r;
    const row = rowEl && rowEl.isConnected ? rowEl : taskRowFor(item); // 누른 그 행만(S15)
    const rows = row ? [row] : [];
    try { r = archiveActiveTask(item); } catch (e) { renderApp(); notifyError(e); return; }
    const { work, entry, pos } = r;
    vanishRows(rows, renderApp);
    offerUndo('보관함으로 옮겼어요', work, () => undoArchiveTask(entry, pos));
    try {
      await work;
    } catch (e) {
      renderApp();
      flashTaskRows([item]);
      notifyTransferError(e, run);
    }
  };
  return run();
}

// ============ Drag & Drop ============
const dragCtx = { active: false };

function onDragStart(e, item, key, taskEl) {
  if (e.type === 'pointerdown' && e.button != null && e.button !== 0) return;
  // 화면의 줄 번호가 최신 내용과 어긋났으면(그 사이 다른 저장이 끝남) 드래그하지 않고 다시 그린다
  try {
    if (resolveLineIndex(item) !== item.lineIndex) throw new Error('목록이 바뀌었어요. 다시 해 주세요');
  } catch (err) {
    renderApp();
    toast(err.message);
    return;
  }
  e.preventDefault();
  e.stopPropagation();
  // 스크롤 막기는 드래그가 실제로 시작된 뒤에만(R3 — 위에서 일찍 돌아가면 문서 전체 스크롤이 계속 막혔다)
  if (e.pointerType && e.pointerType !== 'mouse') beginTouchBlock();

  const rect = taskEl.getBoundingClientRect();
  const ghost = taskEl.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.classList.remove('dragging');
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  document.body.appendChild(ghost);

  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator';

  const blockRange = extractBlock(state.content.split('\n'), item.lineIndex);

  dragCtx.active = true;
  dragCtx.srcItem = item;
  dragCtx.srcLine = item.lineIndex;
  dragCtx.srcStart = blockRange.start;
  dragCtx.srcEnd = blockRange.end;
  dragCtx.srcKey = key;
  dragCtx.srcEl = taskEl;
  dragCtx.ghost = ghost;
  dragCtx.indicator = indicator;
  dragCtx.offsetX = e.clientX - rect.left;
  dragCtx.lift = e.pointerType && e.pointerType !== 'mouse' ? 28 : 0; // 터치는 손가락에 가리지 않게 28px 위로(다듬기)
  dragCtx.startX = e.clientX;
  dragCtx.offsetY = e.clientY - rect.top;
  dragCtx.target = null;
  dragCtx.lastSection = null;

  taskEl.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e) {
  if (!dragCtx.active) return;
  autoScroll.update(e.clientY);
  const { ghost, indicator, offsetX, offsetY } = dragCtx;
  // 화면 밖으로 삐져나가지 않게 좌우를 화면 안으로, 하위로 넣는 중이면 24px 들여 보이기(다듬기)
  const w = ghost.offsetWidth || 0;
  const indent = dragCtx.intoEl ? 24 : 0;
  const left = Math.max(4, Math.min(window.innerWidth - w - 4, e.clientX - offsetX + indent));
  ghost.style.left = left + 'px';
  ghost.style.top = (e.clientY - offsetY - (dragCtx.lift || 0)) + 'px';

  ghost.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  ghost.style.display = '';
  if (!el) return;

  const section = el.closest('.section');
  if (dragCtx.lastSection && dragCtx.lastSection !== section) {
    dragCtx.lastSection.classList.remove('drop-active');
  }
  if (!section) {
    indicator.remove();
    dragCtx.target = null;
    dragCtx.lastSection = null;
    return;
  }
  section.classList.add('drop-active');
  dragCtx.lastSection = section;

  const sectionKey = section.classList.contains('pri-high') ? 'high'
                   : section.classList.contains('pri-med') ? 'medium' : 'low';

  const card = section.querySelector('.card');
  const taskUnder = el.closest('.task');

  const isOwnBlock = (el2) => {
    if (!el2) return false;
    const ln = +el2.dataset.line;
    return ln >= dragCtx.srcStart && ln <= dragCtx.srcEnd;
  };
  const clearInto = () => {
    if (dragCtx.intoEl) { dragCtx.intoEl.classList.remove('drop-into'); dragCtx.intoEl = null; }
  };

  if (taskUnder && card.contains(taskUnder) && isOwnBlock(taskUnder)) {
    // 자기 블록 위 = 제자리(B-3): 놓으면 아무 일도 없음
    clearInto();
    indicator.remove();
    dragCtx.target = null;
  } else if (taskUnder && card.contains(taskUnder) && !isOwnBlock(taskUnder)) {
    const r = taskUnder.getBoundingClientRect();
    const y = e.clientY - r.top;
    // 하위로 넣기는 오른쪽으로 24px 이상 끌었을 때만(B7). 그 외에는 행의 위·아래 절반으로 순서만 바꾼다
    const zoneTop = r.height * 0.5;
    const intoByX = (e.clientX - dragCtx.startX) >= 24;

    if (intoByX) {
      indicator.remove();
      if (dragCtx.intoEl && dragCtx.intoEl !== taskUnder) dragCtx.intoEl.classList.remove('drop-into');
      taskUnder.classList.add('drop-into');
      dragCtx.intoEl = taskUnder;
      dragCtx.target = { sectionKey, intoLine: +taskUnder.dataset.line };
    } else if (y < zoneTop) {
      clearInto();
      indicator.style.marginLeft = '';
      card.insertBefore(indicator, taskUnder);
      dragCtx.target = { sectionKey, beforeLine: +taskUnder.dataset.line };
    } else {
      clearInto();
      card.insertBefore(indicator, taskUnder.nextSibling);
      let next = taskUnder.nextElementSibling;
      // "완료 n개" 접기 행에서 멈춘다(R10 — 펼친 완료 행을 기준으로 잡으면 파일상 미완료 행들 사이에 들어갔다)
      while (next && !next.classList.contains('done-fold') && (!next.classList.contains('task') || isOwnBlock(next))) next = next.nextElementSibling;
      if (next && next.classList.contains('done-fold')) next = null;
      const underIndent = +taskUnder.dataset.indent || 0;
      const nextIndent = next ? (+next.dataset.indent || 0) : 0;
      if (nextIndent < underIndent) {
        // taskUnder is the last item of its sub-list, so the gap below it is depth-ambiguous:
        // it could attach to any ancestor between the next line's level and taskUnder's own.
        // Let the horizontal cursor position pick the depth — drag left to pop out toward
        // nextIndent, keep it under the row to stay as the last child (default).
        const cardLeft = card.getBoundingClientRect().left;
        const lvl = Math.round((e.clientX - cardLeft - 12) / 24);
        const chosenIndent = Math.max(nextIndent, Math.min(underIndent, lvl));
        indicator.style.marginLeft = (8 + chosenIndent * 24) + 'px';
        dragCtx.target = { sectionKey, beforeLine: next ? +next.dataset.line : sectionEndLine(section, taskUnder), indent: chosenIndent };
      } else {
        indicator.style.marginLeft = '';
        dragCtx.target = { sectionKey, beforeLine: next ? +next.dataset.line : sectionEndLine(section, taskUnder) };
      }
    }
  } else {
    clearInto();
    indicator.style.marginLeft = '';
    const fold = card.querySelector('.done-fold');
    if (fold) card.insertBefore(indicator, fold); else card.appendChild(indicator);
    dragCtx.target = { sectionKey, beforeLine: sectionEndLine(section, null) };
  }
}

// "섹션 끝"에 놓을 때의 기준 줄: 완료 항목이 있으면 미완료 마지막 뒤, 펼친 완료 영역 안이면 진짜 끝(B3)
function sectionEndLine(section, taskUnder) {
  const first = section.dataset.firstDone;
  if (first == null || first === '') return null;
  const fold = section.querySelector('.done-fold');
  if (taskUnder && fold && (fold.compareDocumentPosition(taskUnder) & Node.DOCUMENT_POSITION_FOLLOWING)) return null;
  return +first;
}

function onDragEnd(e) {
  if (!dragCtx.active) return;
  const cancelled = !!(e && e.type === 'pointercancel'); // 전화·알림·제스처가 터치를 가로챔 → 정리만, 저장 안 함(R7)
  endTouchDrag();
  suppressRowClick(dragCtx.srcEl, 400);
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);

  const { srcLine, srcItem, srcEl, ghost, indicator, target, lastSection, intoEl } = dragCtx;
  ghost?.remove();
  indicator?.remove();
  srcEl?.classList.remove('dragging');
  lastSection?.classList.remove('drop-active');
  intoEl?.classList.remove('drop-into');
  dragCtx.intoEl = null;
  dragCtx.active = false;

  if (cancelled || !target) return;
  if (target.beforeLine === srcLine) return;
  if (target.intoLine === srcLine) return;

  // 드래그 중 화면이 그려진 뒤 줄이 밀렸다면(다른 기기 변경 재적용 등) 목표 위치도 어긋난다 → 다시 그림
  let stillValid = true;
  try { if (srcItem && resolveLineIndex(srcItem) !== srcLine) stillValid = false; } catch (e) { stillValid = false; }
  if (!stillValid) { renderApp(); toast('목록이 바뀌었어요. 다시 해 주세요'); return; }
  // 드롭 시점의 원문 줄로 출발·목표를 기억해 두고, 저장 직전에 다시 찾는다(그 사이 줄이 밀려도 안전)
  const lines = state.content.split('\n');
  const ref = (n) => (n == null || lines[n] == null ? null : lineFp(lines, n)); // 지문으로(locate)
  const t = { sectionKey: target.sectionKey, indent: target.indent, beforeItem: ref(target.beforeLine), intoItem: ref(target.intoLine) };
  // 옮겨도 내용이 그대로면(제자리·바로 위아래 틈) 저장하지 않음(B-3 — 섹션 끝으로 가던 문제)
  try {
    if (opMove(srcItem || ref(srcLine), t)(state.content) === state.content) { renderApp(); return; }
  } catch (e) { /* 아래 safeMutate가 알림 */ }
  // 되돌리기(D2·S1): 옮긴 블록의 새 자리와 원래 기준 줄을 연산이 rec에 기록. 기록은 저장 성공 뒤(S12)
  const rec = {};
  const record = reserveUndo();
  const pr = safeMutate(
    opMove(srcItem || ref(srcLine), t, rec),
    `move: ${SECTION_KEYS[target.sectionKey]}`,
    null,
    { flash: srcItem ? srcItem.text : null, failMsg: '옮기지 못했어요' }
  );
  pr.then((ok) => {
    if (ok && srcItem) record(() => { safeMutate(opUndoMove(rec), 'undo move', null, { failMsg: '되돌리지 못했어요' }); }, srcItem.text);
  });
  return pr;
}

// ============ Sheet (add/edit) ============

// 우선순위 라디오 선택 상태(class·aria-checked·roving tabindex)를 일괄 갱신
function selectPriority(pri) {
  $('#pri-picker').querySelectorAll('.pri-pill').forEach((p) => {
    const on = p.dataset.pri === pri;
    p.classList.toggle('selected', on);
    p.setAttribute('aria-checked', on ? 'true' : 'false');
    p.tabIndex = on ? 0 : -1;
  });
}

// ---- 편집 시트의 하위 할 일(B7) ----
function childrenOf(item) {
  const sec = state.sections.find((s) => s.items.some((i) => i.raw === item.raw || i.lineIndex === item.lineIndex));
  if (!sec) return [];
  let idx;
  try { idx = resolveLineIndex(item); } catch (e) { return []; }
  const pos = sec.items.findIndex((i) => i.lineIndex === idx);
  const out = [];
  for (let k = pos + 1; k < sec.items.length && sec.items[k].indent > sec.items[pos].indent; k++) {
    if (sec.items[k].indent === sec.items[pos].indent + 1) out.push(sec.items[k]);
  }
  return out;
}
function renderSubList(item) {
  const list = $('#sub-list');
  const kids = childrenOf(item);
  const shown = kids.slice(0, 5);
  list.innerHTML = shown.map((k) => `<li class="${k.checked ? 'done' : ''}">${esc(k.text)}</li>`).join('')
    + (kids.length > 5 ? `<li>외 ${kids.length - 5}개</li>` : '');
}
function openSubInput() {
  const inp = $('#sub-input');
  inp.hidden = false;
  inp.value = '';
  $('#sub-add').hidden = true;
  inp.focus();
}
function closeSubInput() {
  const inp = $('#sub-input');
  inp.hidden = true;
  inp.value = '';
  $('#sub-add').hidden = false;
}
// 부모의 마지막 하위로 한 줄 추가 — 즉시 반영, 실패하면 글을 입력란으로 되돌림
const opAddChild = (parent, text) => (c) => {
  const lines = c.split('\n');
  const idx = resolveLineIndex(parent, lines);
  const at = childInsertIndex(lines, idx);
  lines.splice(at, 0, `${'  '.repeat(getLineIndent(lines[idx]) + 1)}- [ ] ${text}`);
  return lines.join('\n');
};
function addSubFromSheet() {
  const inp = $('#sub-input');
  const text = inp.value.trim();
  if (!text) { closeSubInput(); return; }
  const parent = editingItem;
  if (!parent) return;
  // 시트를 닫으면 부모가 펼쳐진 채 새 하위가 보이도록
  collapsedSet.delete(collapseKeyOf(parent));
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedSet])); } catch (e) {}
  inp.value = '';
  $('#sheet-cancel').textContent = '닫기';
  clearLastUndo();
  const pr = activeStore.apply(opAddChild(parent, text), { msg: `add sub: ${text}` });
  renderApp();
  renderSubList(parent);
  pr.catch((e) => {
    renderApp();
    if ($('#sheet').classList.contains('show') && editingItem === parent) {
      renderSubList(parent);
      if (inp.hidden) openSubInput();
      if (!inp.value) inp.value = text;
    }
    notifyError(e, { retry: () => { inp.value = text; addSubFromSheet(); } });
  });
}


function openEditSheet(item) {
  sheetMode = 'edit';
  editingLine = item.lineIndex;
  editingItem = item;
  editingIsSub = item.indent > 0;
  $('#sheet-title').textContent = editingIsSub ? '하위 할 일 편집' : '편집';
  $('#sheet-text').value = item.text;
  // 상위 항목만 "+ 하위 할 일 추가"(하위는 1단계까지)
  $('#sub-field').hidden = editingIsSub;
  $('#sheet-archive').hidden = false;
  // 이 시트에서 하위를 추가하면(바로 저장됨) "취소" → "닫기"(B-7: 취소가 하위 추가를 무르는 것으로 읽혔다)
  $('#sheet-cancel').textContent = '취소';
  closeSubInput();
  if (!editingIsSub) renderSubList(item);
  // 하위 할 일은 우선순위(섹션) 개념이 없으므로 우선순위 선택을 숨긴다
  const priField = $('#pri-picker').closest('.field');
  if (editingIsSub) {
    priField.hidden = true;
  } else {
    priField.hidden = false;
    // current section
    const sec = state.sections.find((s) => s.items.some((i) => i.lineIndex === item.lineIndex));
    const cur = Object.keys(SECTION_KEYS).find((k) => SECTION_KEYS[k] === sec?.title) || 'medium';
    selectPriority(cur);
  }
  showSheet();
}

let sheetLastFocus = null;

let sheetReturnTo = null; // 시트를 연 할 일 행(key·체크/글) — 저장으로 행이 다시 그려져도 같은 줄로 포커스 복원(R12)
function showSheet() {
  sheetLastFocus = document.activeElement;
  const row = sheetLastFocus && sheetLastFocus.closest && sheetLastFocus.closest('#sections .task');
  sheetReturnTo = row ? { key: row.dataset.key, kind: sheetLastFocus.matches('input[type="checkbox"]') ? 'cb' : 'text', section: row.closest('.section')?.classList[1] } : null;
  const sheet = $('#sheet');
  sheet.removeAttribute('inert');
  $('#scrim').classList.add('show');
  sheet.classList.add('show');
  // 터치 기기에서는 키보드를 자동으로 올리지 않는다(D10③ — 우선순위만 바꿀 때 키보드가 시트를 가렸다).
  // 포커스는 시트 제목에(스크린리더·포커스 가두기용). PC는 바로 글 고치기
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  setTimeout(() => (touch ? $('#sheet-title') : $('#sheet-text')).focus({ preventScroll: true }), 100);
}
function hideSheet() {
  if (sheetSaving) return; // 저장 중에는 닫지 않는다(글 보호)
  setSheetError('');
  const sheet = $('#sheet');
  $('#scrim').classList.remove('show');
  sheet.classList.remove('show');
  $('#pri-picker').closest('.field').hidden = false;
  // 닫힌 시트를 탭 순서·접근성 트리에서 제외하고, 포커스를 열었던 요소로 되돌린다
  sheet.setAttribute('inert', '');
  if (sheetLastFocus && sheetLastFocus.isConnected && typeof sheetLastFocus.focus === 'function') {
    sheetLastFocus.focus();
  } else if (sheetReturnTo) {
    // 연 요소가 다시 그려져 사라졌으면 같은 행(접혔으면 그 섹션의 접기 행)으로(R12·B-4)
    const back = sheetReturnTo;
    setTimeout(() => restoreTaskFocus({ key: back.key, kind: back.kind }, back.section), 0);
  }
  sheetLastFocus = null;
  sheetReturnTo = null;
  setTimeout(runDeferredRender, 0);
}

// 시트가 열려 있는 동안 Tab 포커스를 시트 내부에 가둔다
function trapSheetFocus(e) {
  const sheet = $('#sheet');
  if (!sheet.classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); hideSheet(); return; }
  if (e.key !== 'Tab') return;
  const focusable = sheet.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
  );
  const items = [...focusable].filter((el) => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}

// 시트 저장(A2): 저장이 끝난 뒤에 닫는다. 실패하면 시트를 연 채로 두고 시트 안에 한 줄로 알린다.
let sheetSaving = false;
function setSheetError(msg) {
  const el = $('#sheet-err');
  el.textContent = msg || '';
  el.hidden = !msg;
}
async function sheetSave() {
  if (sheetSaving) return;
  const text = $('#sheet-text').value.trim();
  if (!text) return;
  const pri = $('#pri-picker .pri-pill.selected')?.dataset.pri || 'medium';
  const btn = $('#sheet-save');
  setSheetError('');
  sheetSaving = true;
  btn.disabled = true;
  btn.textContent = '저장 중…';
  let ok = false;
  try {
    ok = await runSheetSave(text, pri);
  } finally {
    sheetSaving = false;
    btn.disabled = false;
    btn.textContent = '저장';
  }
  if (ok) {
    if (sheetReturnTo && sheetMode === 'edit') sheetReturnTo.key = text.trim(); // 글을 고쳤으면 새 글로 찾는다
    hideSheet();
    return;
  }
  const e = lastMutateError;
  if (e && e.code === 409) setSheetError('다른 기기에서 바뀐 내용을 불러왔어요. 한 번 더 눌러 주세요.');
  else if (e && e.userMessage) setSheetError(e.userMessage);
  else if (e && friendlyError(e) !== '저장하지 못했어요') setSheetError(friendlyError(e));
  else setSheetError('저장하지 못했어요. 한 번 더 눌러 주세요.');
}

async function runSheetSave(text, pri) {
  lastMutateError = null;
  const quiet = { quiet: true };
  // 편집: 시트를 열어둔 사이 다른 저장이 끝났을 수 있으니 줄 위치를 다시 찾는다
  let line;
  try {
    line = resolveLineIndex(editingItem);
  } catch (e) {
    lastMutateError = e;
    renderApp();
    return false;
  }
  if (editingIsSub) {
    // 하위 할 일: 우선순위(섹션) 개념이 없으므로 텍스트만 수정
    return onEdit(editingItem, text, quiet);
  }
  // Edit: if priority changed, also move
  const sec = state.sections.find((s) => s.items.some((i) => i.lineIndex === line));
  const curKey = Object.keys(SECTION_KEYS).find((k) => SECTION_KEYS[k] === sec?.title) || 'medium';
  // 되돌리기(D2·S1·S13): 연산이 고친·옮긴 줄의 지문과 원래 자리를 rec에 기록
  const oldText = editingItem.text;
  const rec = {};
  const record = reserveUndo();
  if (curKey !== pri) {
    // 글 수정 + 섹션 이동을 한 번에 저장. 실패해도 로컬 상태를 바꿔 두지 않는다.
    const ok = await safeMutate(opEditMove(editingItem, text, pri, rec), `edit+move: ${text}`, '수정됨', quiet);
    if (ok) {
      const back = text !== oldText ? oldText : null;
      record(() => { safeMutate(opUndoMove(rec, { backText: back }), 'undo edit+move', null, { failMsg: '되돌리지 못했어요' }); }, oldText);
    }
    return ok;
  }
  const ok = await onEdit(editingItem, text, quiet, rec);
  if (ok && text !== oldText) {
    record(() => { safeMutate(opEditBack(rec, oldText), 'undo edit', null, { failMsg: '되돌리지 못했어요' }); }, oldText);
  }
  return ok;
}


// ============ 플로팅 컴포저 (Task 탭 빠른 추가) ============
// 순환 순서(D1): 기본 🍋에서 한 번 누르면 🍅 High, 두 번이면 🥝 Low — 가장 자주 고르는 High가 1탭
const COMPOSER_PRI_ORDER = ['medium', 'high', 'low'];
const nextComposerPriority = (p) => COMPOSER_PRI_ORDER[(COMPOSER_PRI_ORDER.indexOf(p) + 1) % COMPOSER_PRI_ORDER.length];

function updateComposerPriBtn() {
  const btn = $('#composer-pri');
  if (!btn) return;
  const p = PRI[composerPriority];
  const n = PRI[nextComposerPriority(composerPriority)];
  btn.textContent = p.icon;
  btn.title = `우선순위: ${p.icon} ${p.label} · 누르면 ${n.icon} ${n.label}`;
  btn.setAttribute('aria-label', btn.title);
}

function cycleComposerPriority() {
  composerPriority = nextComposerPriority(composerPriority);
  updateComposerPriBtn();
}

// 저장 순서·409 충돌은 activeStore가 맡는다.

// IME 조합 상태 — 한글 조합 중 Enter로 추가하면 확정된 마지막 글자가
// 비운 입력창으로 되돌아와 '기'처럼 한 글자짜리 항목이 하나 더 생긴다.
const composerIme = { composing: false, sentWhileComposing: false };

// ---- 하단 입력창 모드(B5): 'active' | 'inbox' | 'memo' | null(없음) ----
let composerMode = null;
const composerDrafts = { active: '', inbox: '', memo: '' }; // 탭을 옮겨도 쓰던 글 유지
const COMPOSER_PLACEHOLDER = { active: '할 일 입력…', inbox: 'Inbox에 적어 두기', memo: '메모 남기기' };
// PC(마우스·키보드)에서만 안내 글에 단축키를 덧붙인다(D3)
const IS_PC = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
const composerPlaceholder = (mode) => COMPOSER_PLACEHOLDER[mode] + (IS_PC ? ' (/ 키)' : '');
function setComposerMode(mode) {
  const input = $('#composer-input');
  if (composerMode && composerMode !== mode) composerDrafts[composerMode] = input.value;
  const changed = composerMode !== mode;
  composerMode = mode;
  const box = $('#composer');
  box.classList.remove('mode-active', 'mode-inbox', 'mode-memo');
  document.body.classList.toggle('no-composer', !mode);
  if (!mode) { box.hidden = true; return; }
  box.classList.add(`mode-${mode}`);
  if (changed) {
    input.value = composerDrafts[mode] || '';
    input.placeholder = composerPlaceholder(mode);
    // 키보드 키 표시: Memo는 Enter가 줄바꿈이라 "줄바꿈"(R19·D10⑤), Task·Inbox는 "보내기"
    input.setAttribute('enterkeyhint', mode === 'memo' ? 'enter' : 'send');
    input.setAttribute('aria-label', COMPOSER_PLACEHOLDER[mode].replace('…', ''));
    autoGrowComposer();
    fillComposerFromQueue(); // 이 탭에서 저장 못 한 글이 있으면 입력창에(R1)
  }
  $('#composer-send').disabled = input.value.trim() === '';
  if (mode === 'active') updateComposerPriBtn();
  syncComposerVisibility();
}
// 선택 모드에서는 입력창 대신 선택 바만 보인다
function syncComposerVisibility() {
  const selecting = (currentTab === 'inbox' && selectedInbox.size > 0) || (currentTab === 'archive' && selectedArchive.size > 0);
  $('#composer').hidden = !composerMode || selecting;
}
function autoGrowComposer() {
  const input = $('#composer-input');
  input.style.height = 'auto';
  const h = Math.max(38, input.scrollHeight);
  input.style.height = Math.min(h, 98) + 'px';
  input.style.overflowY = h > 98 ? 'auto' : 'hidden'; // 4줄 넘을 때만 스크롤
}

function quickAdd() {
  const input = $('#composer-input');
  const text = composerMode === 'memo' ? input.value.replace(/\s+$/, '').replace(/^\s*\n/, '') : input.value.trim();
  if (!text.trim() || !composerMode) return;
  input.value = '';
  autoGrowComposer();
  composerIme.sentWhileComposing = true; // 전송 뒤 되돌아오는 조합 잔여 문자 제거용
  $('#composer-send').disabled = true;
  if (composerMode !== 'memo' && /\n/.test(text)) {
    // 붙여넣은 여러 줄(R4): 한 줄 = 한 항목. 앞의 목록 표시(-, •, *, 1., [ ])는 떼고 빈 줄은 무시, 최대 20개
    splitPastedLines(text).forEach((t) => submitComposerJob({ mode: composerMode, text: t, pri: composerPriority }));
  } else {
    submitComposerJob({ mode: composerMode, text, pri: composerPriority });
  }
  // 저장 못 한 글이 남아 있으면 비워진 입력창에 다음 글을 돌려놓는다(R1). 한글 조합 잔여 처리 뒤에
  setTimeout(fillComposerFromQueue, 150);
}

// 새 항목이 어디 들어갔는지 보여 주기(B14): 화면 밖이면 300ms 부드럽게 스크롤 + 600ms 깜빡임,
// 화면 안이면 깜빡임만. 토스트는 띄우지 않는다.
function revealNewRow(row) {
  if (!row) return;
  const r = row.getBoundingClientRect();
  const tabs = document.querySelector('.tabs')?.getBoundingClientRect();
  const topLimit = (tabs ? tabs.bottom : 0) + 8;
  const composer = $('#composer');
  const bottomLimit = window.innerHeight - (composer && !composer.hidden ? composer.offsetHeight + 8 : 16);
  let dy = 0;
  if (r.bottom > bottomLimit) dy = r.bottom - bottomLimit;
  else if (r.top < topLimit) dy = r.top - topLimit;
  if (dy) smoothScrollBy(dy, 300);
  flashEl(row);
}
function smoothScrollBy(dy, ms) {
  if (prefersReducedMotion()) { window.scrollBy(0, dy); return; }
  const start = window.scrollY, t0 = performance.now();
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  // rAF는 백그라운드에서 멈출 수 있어 16ms 타이머로 진행(300ms 동안 약 19프레임)
  const step = () => {
    const t = Math.min(1, (performance.now() - t0) / ms);
    window.scrollTo(0, start + dy * ease(t));
    if (t < 1) setTimeout(step, 16);
  };
  step();
}

function splitPastedLines(text) {
  return text.split(/\r?\n/)
    .map((l) => l.replace(/^\s*(?:[-*•]\s+|\d+[.)]\s+)?(?:\[[ xX]\]\s+)?/, '').trim())
    .filter(Boolean)
    .slice(0, 20);
}

function submitComposerJob(job) {
  if (job.mode === 'inbox') addInboxFromComposer(job);
  else if (job.mode === 'memo') addMemoFromComposer(job);
  else addFromComposer(job);
}

// 실패한 입력을 같은 묶음끼리 모아 한 번에 알린다
function reportComposerFailure(job, e) {
  composerFailed.jobs.push(job);
  composerFailed.err = e;
  clearTimeout(composerFailed.timer);
  composerFailed.timer = setTimeout(() => {
    const jobs = composerFailed.jobs.splice(0);
    renderCurrent();
    onComposerFailed(jobs, composerFailed.err);
  }, 0);
}

// 되돌리기(Cmd/Ctrl+Z) 공용: 다른 파일 연산 하나를 저장하고 다시 그림
function runUndoOp(store, op, msg) {
  store.apply(op, { msg }).then(() => renderCurrent(), (e) => { renderCurrent(); notifyError(e, { fallback: '되돌리지 못했어요' }); });
  renderCurrent();
}
function addInboxFromComposer(job) {
  const rec = {};
  const record = reserveUndo(); // Inbox 추가도 "마지막 동작"(S12)
  const pr = inboxStore.apply(opInboxAppend([job.text], rec), { msg: `inbox: add ${job.text}` });
  pr.then(() => record(() => runUndoOp(inboxStore, opInboxRemoveRec(rec), 'undo inbox add')), () => {});
  if (currentTab === 'inbox') {
    renderInbox();
    revealNewRow([...document.querySelectorAll('#inbox-list .inbox-item')]
      .filter((r) => r.querySelector('.inbox-text')?.textContent === job.text).pop());
  } else renderCurrent();
  pr.catch((e) => reportComposerFailure(job, e));
}

// 새 메모는 보드 맨 앞(1열 맨 위)에 200ms 페이드인
// 맨 위에 새 메모 넣기 — 봇 cmd_memo_add와 같은 규칙(Q13): 새 메모 order 0, 같은 열 나머지 +1.
// (앱이 음수 order를 쓰면 봇 메모와 동률·뒤섞임이 생겼다.) 저장 직전 최신 목록 위에서 계산
const opMemoAddTop = (memo) => (list) => {
  if (list.some((x) => x.id === memo.id)) return list;
  const col = memo.col;
  const shifted = list.map((m) => {
    const c = Math.min(MEMO_MAX_COLS - 1, Math.max(0, memoCol(m)));
    if (c !== col) return m;
    const u = { ...m, col: c, order: memoOrder(m) + 1 };
    delete u.x; delete u.y;
    return u;
  });
  return [{ ...memo, order: 0 }, ...shifted];
};

function addMemoFromComposer(job) {
  const memo = {
    id: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6),
    text: job.text,
    col: 0,
    order: 0,
  };
  const record = reserveUndo(); // 메모 추가도 "마지막 동작"(S12)
  const pr = memosStore.apply(opMemoAddTop(memo), { msg: 'memo: add' });
  pr.then(() => record(() => runUndoOp(memosStore, opMemoDelete(memo.id), 'undo memo add')), () => {});
  if (currentTab === 'memo') {
    drawMemos();
    document.querySelector(`.memo[data-id="${memo.id}"]`)?.classList.add('fade-in');
  }
  pr.catch((e) => reportComposerFailure(job, e));
}

// 즉시 반영(B9): 행을 바로 그리고 저장은 뒤에서. 실패하면 행을 거두고 글을 입력창으로(A1)
const composerFailed = { jobs: [], err: null, timer: null };
function addFromComposer(job) {
  const rec = {};
  const record = reserveUndo();
  const pr = activeStore.apply(opAppend(job.pri, job.text, rec), { msg: `add: ${job.text}` });
  // 되돌리기는 저장이 성공한 뒤에만, 넣은 그 줄(지문)만 지운다(S12 — 실패한 추가로 기존 같은 글 항목이 지워지던 문제)
  pr.then(() => record(() => { safeMutate(opActiveRemoveRec(rec), 'undo add', null, { failMsg: '되돌리지 못했어요' }); }, null), () => {});
  renderApp(); // 컴포저는 #app 밖 정적 요소라 포커스 유지됨
  const wantRaw = `- [ ] ${job.text}`;
  revealNewRow([...document.querySelectorAll(`#sections .pri-${job.pri === 'medium' ? 'med' : job.pri} .task`)]
    .filter((r) => r.dataset.raw === wantRaw).pop());
  const inp = $('#composer-input');
  if (inp && currentTab === 'active' && document.activeElement !== inp) inp.focus();
  pr.catch((e) => reportComposerFailure(job, e));
}

// 입력창 추가 실패(A1): 쓴 글을 입력창에 되돌리고 "다시 시도"를 준다. 글은 절대 버리지 않는다.
// 입력창 추가 실패(A1·R1): 저장하지 못한 글은 모드별 대기열(localStorage)에 모아 두고, 입력창이 비면 차례로 돌려놓는다.
// 토스트가 바뀌거나 탭을 옮겨도, 앱을 닫았다 열어도 글이 사라지지 않는다(원칙 1).
// "다시 시도"는 입력창의 + 버튼 하나(D10①: 토스트에 별도 다시 시도 버튼을 두지 않음)
const COMPOSER_FAILED_KEY = lsKey('tako_composer_failed');
function readFailedQ() {
  try { return JSON.parse(localStorage.getItem(COMPOSER_FAILED_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeFailedQ(q) {
  try {
    if (Object.values(q).some((l) => l && l.length)) localStorage.setItem(COMPOSER_FAILED_KEY, JSON.stringify(q));
    else localStorage.removeItem(COMPOSER_FAILED_KEY);
  } catch (e) {}
}
// 결과 모름(uncertain)으로 실패한 글이 실제로는 저장돼 있으면 다시 넣지 않는다(중복 방지)
function alreadySaved(job) {
  if (!job.uncertain) return false;
  if (job.mode === 'inbox') return state.inboxItems.some((i) => i.text === job.text);
  if (job.mode === 'memo') return state.memos.some((m) => m.text === job.text);
  return countActiveLine(job.pri, `- [ ] ${job.text}`) > 0;
}
function fillComposerFromQueue() {
  const input = $('#composer-input');
  if (!composerMode || input.value.trim() !== '' || composerIme.composing) return;
  const q = readFailedQ();
  const list = q[composerMode] || [];
  while (list.length && alreadySaved(list[0])) list.shift();
  const job = list.shift();
  q[composerMode] = list;
  writeFailedQ(q);
  if (!job) return;
  input.value = job.text;
  if (job.mode === 'active' && job.pri) { composerPriority = job.pri; updateComposerPriBtn(); }
  $('#composer-send').disabled = false;
  autoGrowComposer();
  try { input.setSelectionRange(job.text.length, job.text.length); } catch (e) {}
}
function onComposerFailed(failed, err) {
  if (err) console.error(err);
  const q = readFailedQ();
  failed.forEach((job) => {
    const list = q[job.mode] || (q[job.mode] = []);
    if (!list.some((x) => x.text === job.text && x.pri === job.pri)) list.push({ ...job, uncertain: !!(err && err.uncertain) });
  });
  writeFailedQ(q);
  fillComposerFromQueue();
  const total = Object.values(readFailedQ()).reduce((n, l) => n + (l ? l.length : 0), 0) + ($('#composer-input').value ? 1 : 0);
  const head = failed.length > 1 ? `${failed.length}개를 저장하지 못했어요` : friendlyError(err, '저장하지 못했어요');
  notify.error(total > 1 ? `${head}. 글은 입력창에 차례로 돌려놓을게요` : `${head}. 글은 입력창에 돌려놓았어요`);
}

// ============ Init ============
// [lab 전용] fail closed(C2): 가짜 API(mock-github.js)가 실제로 로드돼 fetch를 가로채고 있을 때만 시작한다.
// mock이 없으면 실제 GitHub(tasks-data)에 쓰게 되므로 아무것도 하지 않고 안내만 보인다. 본 서비스에서는 이 함수와 호출을 지운다.
// 글을 입력하는 요소인지(단축키 양보 기준, S2)
function isTextEntry(el) {
  if (!el || el === document.body) return false;
  if (el.isContentEditable) return true;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
  if (el.tagName !== 'INPUT') return false;
  return !['checkbox', 'radio', 'button', 'submit', 'reset', 'range', 'color', 'file', 'image'].includes((el.type || 'text').toLowerCase());
}

function labMockGuard() {
  if (window.__TAKO_LAB_MOCK === true) return true;
  document.getElementById('app').innerHTML =
    '<div class="setup"><h1>실험실을 열 수 없어요</h1><p>가짜 저장소(mock-github.js)를 불러오지 못했어요. 실제 데이터에 쓰지 않도록 실행을 멈췄어요. 새로고침해 주세요.</p></div>';
  ['composer', 'inbox-bar', 'archive-bar'].forEach((id) => { const el = document.getElementById(id); if (el) el.hidden = true; });
  return false;
}

function init() {
  if (!labMockGuard()) return;
  updateThemeColorMeta();

  bindBarEvents();
  $('#archive-bar-select-all')?.addEventListener('click', () => {
    const all = state.archiveItems.length;
    if (selectedArchive.size === all) selectedArchive.clear();
    else state.archiveItems.forEach((e) => selectedArchive.add(e.id));
    renderArchive();
  });
  $('#archive-bar-restore')?.addEventListener('click', onBulkRestore);
  // 선택 끝내기(✕)
  $('#bar-cancel')?.addEventListener('click', () => { selectedInbox.clear(); renderInbox(); });
  $('#archive-bar-cancel')?.addEventListener('click', () => { selectedArchive.clear(); renderArchive(); });
  $('#archive-bar-purge')?.addEventListener('click', onBulkPurge);
  // 플로팅 컴포저
  updateComposerPriBtn();
  $('#composer-pri').addEventListener('click', cycleComposerPriority);
  $('#composer-send').addEventListener('click', quickAdd);
  const composerInput = $('#composer-input');
  composerInput.addEventListener('input', (e) => {
    $('#composer-send').disabled = e.target.value.trim() === '';
  });
  composerInput.addEventListener('compositionstart', () => {
    composerIme.composing = true;
    composerIme.sentWhileComposing = false;
  });
  composerInput.addEventListener('compositionend', () => {
    composerIme.composing = false;
    // 전송 직후 IME가 확정 문자를 빈 입력창에 되돌려 넣은 경우 → 비운다
    if (composerIme.sentWhileComposing) {
      composerIme.sentWhileComposing = false;
      composerInput.value = '';
      setTimeout(fillComposerFromQueue, 0);
    }
    $('#composer-send').disabled = composerInput.value.trim() === '';
  });
  composerInput.addEventListener('keydown', (e) => {
    // Esc = 입력창에서 빠져나가기(그다음 Cmd/Ctrl+Z·단축키 사용). 쓰던 글은 그대로 둔다
    if (e.key === 'Escape' && !composerIme.composing && !e.isComposing) { e.preventDefault(); composerInput.blur(); return; }
    if (e.key !== 'Enter') return;
    // 조합 중 Enter는 한글 확정용이므로 추가하지 않는다 (keyCode 229 = IME 처리 중)
    if (composerIme.composing || e.isComposing || e.keyCode === 229) return;
    // 메모: Shift+Enter = 줄바꿈. 터치 기기(키보드에 줄바꿈 키뿐)에서는 Enter = 줄바꿈, 추가는 + 버튼
    if (composerMode === 'memo') {
      const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (e.shiftKey || touch) return;
    } else if (e.shiftKey) { e.preventDefault(); return; }
    e.preventDefault();
    quickAdd();
  });
  composerInput.addEventListener('input', autoGrowComposer);
  // Task·Inbox는 한 줄 입력(R4): 줄바꿈 입력(Android IME Enter 포함, keydown이 229로 오는 경우)은 막고 "보내기"로
  composerInput.addEventListener('beforeinput', (e) => {
    if (composerMode === 'memo') return;
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') {
      e.preventDefault();
      if (!composerIme.composing && !e.isComposing) quickAdd();
    }
  });

  // 토스트: 올라가 있는 동안 시간 멈춤, Cmd/Ctrl+Z = 되돌리기
  const toastEl = $('#toast');
  toastEl.addEventListener('pointerenter', pauseToast);
  toastEl.addEventListener('pointerleave', resumeToast);
  toastEl.addEventListener('pointerdown', pauseToast);
  // 단축키 공통 규칙(S2·S14): 글을 입력하는 요소에 포커스가 있을 때만 양보한다(체크박스·버튼 포커스는 해당 없음 —
  // 체크한 뒤 포커스가 체크박스에 남아도 Cmd/Ctrl+Z·/·N이 동작). 시트·더보기 메뉴가 열려 있으면 뒤 화면을 건드리지 않음
  const shortcutBlocked = () => isTextEntry(document.activeElement) || $('#sheet').classList.contains('show')
    || !!document.querySelector('#more-menu.show');
  // 입력창 포커스 단축키(D3): / 또는 N. e.code(한글 입력 상태)와 e.key(/ 자리가 다른 자판·가상 키보드) 모두 받음
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
    if (e.code !== 'Slash' && e.code !== 'KeyN' && e.key !== '/') return;
    if (shortcutBlocked()) return;
    const box = $('#composer');
    if (!composerMode || box.hidden) return;
    e.preventDefault();
    $('#composer-input').focus();
  });
  document.addEventListener('keydown', (e) => {
    // e.code KeyZ(한글 입력 상태에서 e.key가 "ㅋ")와 e.key z(QWERTZ 등) 모두
    if (!(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey || (e.code !== 'KeyZ' && String(e.key).toLowerCase() !== 'z')) return;
    // 입력 중에는 브라우저 기본 되돌리기(글자 취소)를 그대로 둔다
    if (shortcutBlocked()) return;
    if (toastState.action && toastState.action.undo) {
      e.preventDefault();
      lastUndo = null;
      toastState.action.fire();
      return;
    }
    if (lastUndo) { // 토스트가 이미 사라졌거나 토스트가 없는 동작
      e.preventDefault();
      const u = lastUndo;
      lastUndo = null;
      u.fire();
    }
  });

  $('#scrim').addEventListener('click', hideSheet);
  $('#sheet-cancel').addEventListener('click', hideSheet);
  $('#sub-add').addEventListener('click', openSubInput);
  // 편집 시트의 "보관함으로"(B2) — 상위·하위 동일. 시트를 닫고 되돌리기 토스트
  $('#sheet-archive').addEventListener('click', () => {
    if (sheetSaving || !editingItem) return;
    const item = editingItem;
    hideSheet();
    onDelete(item);
  });
  $('#sub-input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.isComposing || e.keyCode === 229) return; // 한글 조합 중 Enter는 확정용
    e.preventDefault();
    e.stopPropagation();
    addSubFromSheet();
  });
  $('#sub-input').addEventListener('blur', () => {
    // 바깥을 누르면 닫힘(쓴 글이 있으면 먼저 추가)
    setTimeout(() => { if (document.activeElement !== $('#sub-input')) { if ($('#sub-input').value.trim()) addSubFromSheet(); closeSubInput(); } }, 0);
  });
  $('#sheet-save').addEventListener('click', sheetSave);
  $('#sheet').addEventListener('keydown', trapSheetFocus);
  $('#sheet-text').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    // 조합 중 Enter는 한글 확정용 — 저장하면 마지막 글자만 남은 항목이 더 생긴다
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    sheetSave();
  });
  $('#pri-picker').addEventListener('click', (e) => {
    const pill = e.target.closest('.pri-pill');
    if (!pill) return;
    selectPriority(pill.dataset.pri);
    pill.focus();
  });
  $('#pri-picker').addEventListener('keydown', (e) => {
    const pills = [...$('#pri-picker').querySelectorAll('.pri-pill')];
    if (e.key === ' ' || e.key === 'Enter') {
      const pill = e.target.closest('.pri-pill');
      if (pill) { e.preventDefault(); selectPriority(pill.dataset.pri); }
      return;
    }
    const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown';
    const back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
    if (!fwd && !back) return;
    e.preventDefault();
    const cur = $('#pri-picker .pri-pill.selected')?.dataset.pri;
    const idx = pills.findIndex((p) => p.dataset.pri === cur);
    const nextIdx = (idx + (fwd ? 1 : -1) + pills.length) % pills.length;
    selectPriority(pills[nextIdx].dataset.pri);
    pills[nextIdx].focus();
  });

  document.addEventListener('click', (e) => {

    const moreBtn = e.target.closest('#more-btn');
    if (moreBtn) {
      const menu = $('#more-menu');
      if (menu && menu.classList.contains('show')) closeMoreMenu();
      else openMoreMenu(moreBtn);
      return;
    }

    const mi = e.target.closest('.menu-item');
    if (mi) {
      if (mi.disabled) return;
      closeMoreMenu();
      if (mi.id === 'menu-refresh') refresh();
      else if (mi.id === 'menu-archive-done') onBulkArchiveDone();
      else if (mi.id === 'menu-theme') toggleTheme();
      else if (mi.id === 'menu-token') openSettings();
      return;
    }

    // 메뉴 밖 클릭 시 닫기
    const openMenu = $('#more-menu.show');
    if (openMenu && !e.target.closest('.menu-wrap')) closeMoreMenu();
  });

  // Esc로 메뉴 닫기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMoreMenu();
  });

  // PWA SW
  // 실험실은 본 서비스 서비스워커(../sw.js, 상위 scope)에 가로채이지 않도록 lab 전용 빈 워커를
  // 더 좁은 scope(./)로 등록한다. 첫 방문에 본 서비스 워커가 이 페이지를 맡고 있었다면 한 번만 새로 연다.
  if ('serviceWorker' in navigator) {
    const isLabWorker = (w) => !!w && /\/lab\/sw-lab\.js$/.test(w.scriptURL);
    navigator.serviceWorker.register('sw-lab.js', { scope: './' }).then(() => {
      if (navigator.serviceWorker.controller && !isLabWorker(navigator.serviceWorker.controller)) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (isLabWorker(navigator.serviceWorker.controller) && !sessionStorage.getItem('tako_lab_sw_reloaded')) {
            try { sessionStorage.setItem('tako_lab_sw_reloaded', '1'); } catch (e) {}
            location.reload();
          }
        });
      }
    }).catch(() => {});
  }

  // Refresh on visibility
  // 앱을 벗어날 때: 디바운스를 기다리지 않고 바로 저장(keepalive — 페이지가 멈춰도 요청 유지)(A3)
  // keepalive는 체크 보호용 active.md에만(작은 파일). 나머지는 일반 요청 — 64KB 합계 초과 방지(Q9)
  const flushOnLeave = () => {
    ALL_STORES().forEach((st) => {
      if (!st.hasReady()) return;
      if (st === activeStore) st.leaveFlush();
      else st.flush();
    });
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flushOnLeave(); return; }
    if (state.token) refresh();
  });
  window.addEventListener('pagehide', () => { flushOnLeave(); releaseJournal(); });
  // 저장 안 된 변경이 있으면 창을 닫을 때 브라우저 기본 경고(B8)
  window.addEventListener('beforeunload', (e) => {
    if (ALL_STORES().some((st) => st.hasPending())) {
      flushOnLeave();
      e.preventDefault();
      e.returnValue = '';
    }
  });
  // 인터넷이 끊기면 "오프라인", 다시 연결되면 자동 저장 후 사라짐
  window.addEventListener('offline', renderSync);
  window.addEventListener('online', () => {
    renderSync();
    if (syncStatus.hasError) retryFailedSaves();
    // 저장 대기분을 보내고 다시 불러온 뒤에 저널 확인(S7 — 오프라인 동안 바뀐 것을 모르는 state로 판정하지 않게)
    if (state.token) refresh();
  });

  // 길게 누를 때 뜨는 기본 메뉴(Android 컨텍스트 메뉴 등)를 메모·할 일 행에서는 막는다
  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest && e.target.closest('.memo:not(.editing), .task') && (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) e.preventDefault();
  });

  // Re-layout memos on resize (column count may change)
  let resizeTimer;
  window.addEventListener('resize', () => {
    if (currentTab !== 'memo') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => drawMemos(), 120);
  });

  // Initial render
  if (!state.token) {
    renderSetup();
  } else {
    renderApp();
    initialLoad();
  }
}

// 첫 불러오기. 실패하면 조용히 삼키지 않고 "불러오지 못함 · 다시 시도"를 남긴다.
async function initialLoad() {
  syncStatus.loading = true;
  syncStatus.loadError = false;
  renderSync();
  try {
    await Promise.all([ghLoad(), ghLoadInbox(), ghLoadArchive(), ghLoadMemos()]);
    syncStatus.loading = false;
    renderCurrent();
    // 토큰을 다시 넣은 경우 등, 남아 있던 저장 안 된 변경(체크 등)을 이어서 저장(Q12)
    ALL_STORES().forEach((st) => { if (st.hasReady()) st.flush(); });
    runJournal(); // 지난번에 마저 못 끝낸 이동 정리(Q6)
  } catch (e) {
    syncStatus.loading = false;
    if (e.code === 401) { handleUnauthorized(); return; }
    syncStatus.loadError = true;
    renderCurrent();
    notifyError(e, { fallback: '불러오지 못했어요', retry: initialLoad });
  }
}

let deferredRender = false;
function isEditingUI() {
  return !!document.querySelector('.memo.editing') || $('#sheet').classList.contains('show');
}
function runDeferredRender() {
  if (!deferredRender || isEditingUI()) return;
  deferredRender = false;
  renderCurrent();
}

let setupNotice = '';
function handleUnauthorized() {
  localStorage.removeItem(TOKEN_KEY);
  state.token = null;
  setupNotice = '토큰이 만료됐거나 권한이 바뀌었어요. 다시 입력해 주세요.';
  renderSetup();
}

async function refresh() {
  if (!state.token) return;
  // 앱으로 돌아왔을 때: 아직 저장 안 된 변경을 먼저 저장하고(실패해도 지우지 않음) 불러온다(A3)
  await Promise.all(ALL_STORES().map((st) => st.flushAll().catch(() => {})));
  try {
    await Promise.all([ghLoad(), ghLoadInbox(), ghLoadArchive(), ghLoadMemos()]);
    syncStatus.loadError = false;
    syncStatus.loading = false;
    runJournal();
    // 메모를 쓰는 중이거나 시트가 열려 있으면 화면을 다시 그리지 않고, 끝난 뒤에 그린다
    if (isEditingUI()) deferredRender = true;
    else renderCurrent();
  } catch (e) {
    if (e.code === 401) {
      handleUnauthorized();
    } else {
      notifyError(e, { fallback: '불러오지 못했어요', retry: refresh });
    }
  }
}

function openSettings() {
  if (confirm('토큰을 다시 입력할까요?\n이 기기에 저장된 토큰은 지워져요.')) {
    localStorage.removeItem(TOKEN_KEY);
    state.token = null;
    renderSetup();
  }
}

init();
</script>
</body>
</html>
