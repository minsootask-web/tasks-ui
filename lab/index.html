<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tako">
<title>Tako Lab</title>
<link rel="manifest" href="../manifest.json">
<!-- 파비콘(탭): 투명 배경 SVG + PNG 폴백 -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<!-- 홈 화면/PWA 아이콘: 어두운 배경(타일에 얹히므로 불투명) -->
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root {
    /* Notion-inspired light palette */
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f7f6f3;
    --surface-3: #efeeec;
    --border: rgba(55,53,47,0.09);
    --border-strong: rgba(55,53,47,0.16);
    --text: #37352f;
    --muted: rgba(55,53,47,0.70); /* .55는 흰 바탕 3.2:1 → .70은 4.8:1(카드 회색 바탕 4.6:1), AA 통과 */
    --faint: rgba(55,53,47,0.4);
    --accent: #DF4438;
    --accent-fg: #ffffff;
    --accent-soft: rgba(223,68,56,0.11);
    /* 작은 글자·배지·토스트 버튼용 진한 빨강(B14): 흰 글자/흰 바탕 모두 5.5:1. 큰 버튼·로고·체크는 --accent 그대로 */
    --accent-strong: #C23328;
    --accent-text: #C23328; /* 바탕 위 빨간 글자(링크·실패 표시) */
    --high: #e03e3e;
    --med: #d9730d;
    --low: #448361;
    --danger: #e03e3e;
    --hover: rgba(55,53,47,0.055);
    --shadow: 0 1px 3px rgba(15,15,15,0.06), 0 6px 18px rgba(15,15,15,0.07);
    --shadow-menu: rgba(15,15,15,0.05) 0 0 0 1px, rgba(15,15,15,0.08) 0 3px 6px, rgba(15,15,15,0.14) 0 9px 24px;
    --radius: 10px;
    --radius-sm: 6px;
    --memo-bg: #fdea9c;
    --memo-bg-edit: #fbdf74;
    --memo-fg: #3a3016;
    /* 모션 기준값(디자이너 공통 기준) — 반응 120ms, 전환 200ms, 길게 누르기 예고 400ms */
    --dur-fast: 120ms;
    --dur: 200ms;
    --ease: cubic-bezier(.2,.8,.2,1);
    --dur-press: 400ms;
    --dur-flash: 600ms;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  /* Notion-inspired dark palette.
     시스템 다크(수동 라이트로 덮어쓰지 않은 경우) + 수동 다크(data-theme="dark") 공통 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --surface: #202020;
      --surface-2: #252525;
      --surface-3: #2d2d2d;
      --border: rgba(255,255,255,0.094);
      --border-strong: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.82);
      --muted: rgba(255,255,255,0.46);
      --faint: rgba(255,255,255,0.34);
      --accent: #DF4438;
      --accent-fg: #ffffff;
      --accent-soft: rgba(223,68,56,0.24);
      --accent-text: #ff7369; /* 어두운 바탕 위 빨간 글자 6.6:1 */
      --high: #ff7369;
      --med: #ffa344;
      --low: #4dab9a;
      --danger: #ff7369;
      --hover: rgba(255,255,255,0.055);
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
      --shadow-menu: rgba(15,15,15,0.1) 0 0 0 1px, rgba(15,15,15,0.2) 0 3px 6px, rgba(15,15,15,0.4) 0 9px 24px;
      --memo-bg: #f5d45e;
      --memo-bg-edit: #f8e187;
      --memo-fg: #3a3016;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --surface: #202020;
    --surface-2: #252525;
    --surface-3: #2d2d2d;
    --border: rgba(255,255,255,0.094);
    --border-strong: rgba(255,255,255,0.14);
    --text: rgba(255,255,255,0.82);
    --muted: rgba(255,255,255,0.46);
    --faint: rgba(255,255,255,0.34);
    --accent: #DF4438;
    --accent-fg: #ffffff;
    --accent-soft: rgba(223,68,56,0.24);
    --accent-text: #ff7369; /* 어두운 바탕 위 빨간 글자 6.6:1 */
    --high: #ff7369;
    --med: #ffa344;
    --low: #4dab9a;
    --danger: #ff7369;
    --hover: rgba(255,255,255,0.055);
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
    --shadow-menu: rgba(15,15,15,0.1) 0 0 0 1px, rgba(15,15,15,0.2) 0 3px 6px, rgba(15,15,15,0.4) 0 9px 24px;
    --memo-bg: #f5d45e;
    --memo-bg-edit: #f8e187;
    --memo-fg: #3a3016;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); margin: 0; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 108px);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 24px;
  }
  .title-row h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .title-row h1.brand { display: inline-flex; align-items: center; gap: 9px; }
  .title-row h1.brand span { font-weight: 900; text-transform: lowercase; }
  .brand-logo { width: 32px; height: 32px; flex-shrink: 0; display: block; }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-row { min-width: 0; flex: 1; }
  .meta { display: flex; gap: 4px; align-items: baseline; }
  .meta .meta-date { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .meta-count { flex-shrink: 0; white-space: nowrap; }
  .icon-btn {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 1px solid transparent; color: var(--muted);
    width: 38px; height: 38px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; transition: all var(--dur-fast);
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn.sort-active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .header-actions { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
  .menu-wrap { position: relative; display: inline-flex; }
  .menu {
    position: absolute; top: 46px; right: 0; z-index: 50;
    min-width: 220px; padding: 6px;
    background: var(--surface);
    border-radius: var(--radius); box-shadow: var(--shadow-menu);
    display: none; flex-direction: column; gap: 1px;
  }
  .menu.show { display: flex; }
  .menu-item {
    appearance: none; -webkit-appearance: none; background: none; border: none;
    color: var(--text); text-align: left; width: 100%;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item:disabled { opacity: 0.4; cursor: default; }
  .menu-item:disabled:hover { background: none; }
  .menu-item.danger { color: var(--danger); }
  .menu-item .mi-ic { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .menu-item .mi-count { margin-left: auto; color: var(--accent-text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  .section { margin-bottom: 22px; }
  .section-title {
    font-size: 13px; font-weight: 600; letter-spacing: 0;
    color: var(--text); margin: 0 0 8px 0;
    display: flex; align-items: center; gap: 8px; padding-left: 4px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .section-title .sec-ic { font-size: 14px; line-height: 1; }
  .pri-high .dot { background: var(--high); }
  .pri-med  .dot { background: var(--med); }
  .pri-low  .dot { background: var(--low); }
  .count { color: var(--muted); margin-left: auto; font-weight: 500; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px; overflow: hidden;
  }
  .task {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px; border-radius: var(--radius-sm); position: relative; min-height: 44px;
    transition: background var(--dur-fast);
  }
  .task:hover { background: var(--hover); }
  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; margin: 1px 0 0 0;
    border: 0; border-radius: 50%;
    background: transparent no-repeat center / contain; cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='10.5' stroke='%23868686'/%3E%3C/svg%3E");
    flex-shrink: 0; transition: opacity var(--dur-fast); position: relative;
  }
  .task input[type="checkbox"]:hover { opacity: 0.7; }
  .task input[type="checkbox"]:checked {
    background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23DF4438'/%3E%3Cpath d='M8 11.5L10.9474 15L16 9' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  }
  .task input[type="checkbox"]:checked:hover { opacity: 0.85; }
  /* 체크 순간 뿅! 튀는 마이크로 인터랙션 — 렌더링된 완료 항목이 아닌,
     사용자가 직접 클릭한 순간에만 .pop 클래스로 발동한다. */
  .task input[type="checkbox"].pop {
    animation: cb-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes cb-pop {
    0% { transform: scale(0.7); }
    55% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .task-toggle {
    flex-shrink: 0; width: 18px; height: 22px; margin-top: 0; padding: 0;
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; transition: color var(--dur-fast), background var(--dur-fast);
  }
  .task-toggle:hover { color: var(--text); background: var(--surface-2); }
  .task-toggle.leaf { visibility: hidden; cursor: default; }
  .child-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 5px; margin-left: 6px;
    border-radius: 8px; background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 600; vertical-align: middle;
  }
  .task-text {
    flex: 1; cursor: text; min-width: 0;
    word-break: break-word; padding: 1px 0;
  }
  .task-text:focus { outline: none; }
  .task-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .task input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .task-link { color: var(--accent-text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; word-break: break-all; }
  .task.done .task-link { color: inherit; }
  .task.done .task-text { color: var(--muted); text-decoration: line-through; }
  .meta-inline { color: var(--muted); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .task-actions {
    display: flex; gap: 2px; opacity: 0;
    transition: opacity var(--dur-fast);
  }
  .task:hover .task-actions, .task.menu-open .task-actions, .task:focus-within .task-actions { opacity: 1; }
  /* 모바일(hover 없음): 행에는 체크·글·펼침만. ⋮⋮·×는 없음 — 보관은 편집 시트, 순서는 길게 눌러 옮기기(B2) */
  @media (hover: none) {
    .task-actions { display: none; }
    .task { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: background var(--dur-fast), transform var(--dur-press) ease-out; }
  }
  .row-btn {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    width: 32px; height: 32px; border-radius: 6px; position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all var(--dur-fast);
  }
  .row-btn:hover { background: var(--surface-2); color: var(--text); }
  .row-btn.danger:hover { background: var(--danger); color: white; }

  /* 완료 접기 행(B3) — 높이 36px, 체크박스 줄에 맞춘 들여쓰기 */
  .done-fold {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    width: 100%; min-height: 36px; padding: 0 10px 0 38px; text-align: left; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 4px;
  }
  .done-fold:hover { background: var(--hover); color: var(--text); }
  .done-fold:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .done-fold .done-n { display: inline-block; font-variant-numeric: tabular-nums; }
  .done-fold .done-n.bump { animation: done-bump var(--dur-fast) ease-out; }
  @keyframes done-bump { 50% { transform: scale(1.15); } }
  .task.leaving { opacity: 0; max-height: 0; min-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden;
    transition: opacity var(--dur) var(--ease), max-height var(--dur) var(--ease), padding 200ms; }
  .bullet { padding: 4px 10px 4px 40px; color: var(--muted); font-size: 13px; }
  .indent-1 { padding-left: 36px; }
  .indent-2 { padding-left: 60px; }
  .indent-3 { padding-left: 84px; }
  .empty {
    padding: 12px 10px; color: var(--muted); font-size: 13px;
  }


  /* 플로팅 컴포저 (Task 탭) — 메신저/프롬프트 입력창 스타일 */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 12px 16px calc(var(--safe-bottom) + 14px);
    /* 내용이 입력창 아래로 자연스럽게 페이드되며 스크롤되도록 */
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    pointer-events: none;
  }
  .composer[hidden] { display: none; }
  .composer-inner {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    padding: 5px 5px 5px 6px;
    box-shadow: 0 6px 20px rgba(15,15,15,0.12);
    pointer-events: auto;
  }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer-pri {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: var(--surface-2); cursor: pointer;
    font-size: 19px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast), transform var(--dur-fast);
  }
  .composer-pri:hover { background: var(--hover); }
  .composer-pri:active { transform: scale(0.9); }
  .composer-input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-size: 15px; color: var(--text); font-family: inherit; line-height: 20px;
    padding: 9px 4px; resize: none; height: 38px; max-height: 98px; /* 메모는 최대 4줄 */
    overflow-y: hidden; display: block; box-sizing: border-box;
  }
  .composer-inner { align-items: flex-end; }
  .composer.mode-inbox .composer-pri, .composer.mode-memo .composer-pri { display: none; }
  .composer.mode-inbox .composer-inner, .composer.mode-memo .composer-inner { padding-left: 14px; }
  body.no-composer { padding-bottom: calc(var(--safe-bottom) + 32px); }
  .memo.fade-in { animation: memo-in var(--dur) var(--ease); }
  @keyframes memo-in { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .memo.fade-in { animation: none; } }
  .composer-input::placeholder { color: var(--muted); }
  .composer-send {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: var(--accent); color: var(--accent-fg);
    cursor: pointer; font-size: 24px; font-weight: 300; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast), transform var(--dur-fast);
  }
  .composer-send:active { transform: scale(0.9); }
  .composer-send:disabled { opacity: 0.35; cursor: default; }

  /* Modal / Bottom sheet */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur) var(--ease); z-index: 20;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(var(--safe-bottom) + 20px);
    transform: translateY(100%); transition: transform var(--dur) var(--ease);
    z-index: 21; max-width: 560px; margin: 0 auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet h2 { font-size: 17px; margin: 0 0 14px 0; font-weight: 600; }
  .sheet h2:focus { outline: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input[type="text"], .field input[type="password"], .field textarea {
    width: 100%; padding: 10px 12px; font-size: 15px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; resize: vertical;
  }
  /* 포커스는 메인 컬러 대신 중립적인 진한 보더로 은은하게 표시 */
  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
    background: var(--surface);
  }
  .pri-picker { display: flex; gap: 8px; }
  .pri-pill {
    flex: 1; padding: 10px; border-radius: 8px; cursor: pointer;
    background: var(--surface-2); border: 1.5px solid transparent;
    text-align: center; font-size: 14px; font-weight: 500;
    transition: all var(--dur-fast); user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pri-pill:hover { background: var(--hover); }
  .pri-pill.selected { border-color: var(--accent); background: var(--surface); }
  .pri-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pri-pill .dot { width: 10px; height: 10px; }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-err { color: var(--danger); font-size: 13px; margin-top: 12px; }
  .text-btn {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); min-height: 44px; padding: 0 2px; text-align: left;
  }
  .text-btn:hover { color: var(--text); }

  /* Setup screen */

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Tabs */
  /* 탭(B12): 위쪽 유지, 높이 44px, 스크롤해도 화면 위에 붙어 있음 */

<script>

<!-- UX 실험실: 가짜 GitHub API (실제 데이터 미접근) -->

<script>
'use strict';

// ============ Config ============
// localStorage 키 접두사(C2). lab은 같은 origin의 본 서비스와 키(토큰 등)를 섞지 않도록 'tako_lab_'.
// [이식] 본 서비스에서는 '' — 기존 키 이름(gh_pat·tasks_collapsed·tasks_theme)을 그대로 써서 기존 토큰·설정 유지
const LS_PREFIX = 'tako_lab_';
const lsKey = (k) => LS_PREFIX + k;
const TOKEN_KEY = lsKey('gh_pat');

const OWNER = 'minsootask-web';
const REPO  = 'tasks-data';
const FILE  = 'active.md';
const INBOX_FILE = 'inbox.md';
const ARCHIVE_FILE = 'archive.json';
const MEMOS_FILE = 'memos.json';
const API   = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`;
const INBOX_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${INBOX_FILE}`;
const ARCHIVE_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${ARCHIVE_FILE}`;
const MEMOS_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${MEMOS_FILE}`;
// 파일(active.md)의 섹션 헤더 — 봇·Skill이 쓰므로 절대 바꾸지 않는다
const SECTION_KEYS = { high: '🔥 High', medium: '🟡 Medium', low: '🟢 Low' };
// 화면에 보이는 우선순위 표기는 이것 하나로 통일(B10). 🥚(보관함의 Inbox 출처)는 우선순위가 아니라 별도
const PRI = {
  high: { icon: '🍅', label: 'High', to: 'High로' },
  medium: { icon: '🍋', label: 'Medium', to: 'Medium으로' },
  low: { icon: '🥝', label: 'Low', to: 'Low로' },
};
const PRI_ORDER = ['high', 'medium', 'low'];
function getMemoCols() { return window.innerWidth <= 600 ? 2 : 3; }
const MEMO_MAX_COLS = 3;

// ============ State ============
// content/sections·inboxContent/inboxItems·archiveItems·memos는 각 파일 스토어의 view를 비춘 값(F3).
// 직접 대입하지 말고 스토어 연산(apply/commit)으로 바꾼다.
const state = {
  token: localStorage.getItem(TOKEN_KEY) || null,
  content: '',
  sections: [],
  inboxContent: '',
  inboxItems: [],
  archiveItems: [],
  memos: [],
};

let currentTab = 'active';
let composerPriority = 'medium'; // 플로팅 컴포저 우선순위
let selectedInbox = new Set();
let selectedArchive = new Set();
let sheetMode = 'edit'; // 시트는 이제 편집 전용(추가는 하단 입력창, R18)
let editingLine = -1;
let editingItem = null; // 편집 대상 항목 — 저장 직전 줄 위치를 다시 찾는 데 쓴다
let editingIsSub = false; // 편집 대상이 하위 할 일인지

// 하위 항목 접기 상태 — 부모 할 일의 텍스트를 키로 저장(재정렬·재조회에도 유지)
const COLLAPSE_KEY = lsKey('tasks_collapsed');
let collapsedSet = new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '[]'));
function collapseKeyOf(item) { return item.text.trim(); }
function isCollapsed(item) { return collapsedSet.has(collapseKeyOf(item)); }
function toggleCollapse(item) {
  const k = collapseKeyOf(item);
  if (collapsedSet.has(k)) collapsedSet.delete(k); else collapsedSet.add(k);
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsedSet]));
  renderApp();
}

// ============ Theme (light/dark toggle) ============
const THEME_KEY = lsKey('tasks_theme');
// 현재 실제 적용 중인 테마('light'|'dark') — 수동 지정이 있으면 그 값, 없으면 시스템 설정
function effectiveTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'light' || t === 'dark') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(mode) { // 'light' | 'dark' | 'system'
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') {
    root.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  } else {
    root.removeAttribute('data-theme');
    try { localStorage.removeItem(THEME_KEY); } catch (e) {}
  }
  updateThemeColorMeta();
}
function toggleTheme() {
  applyTheme(effectiveTheme() === 'dark' ? 'light' : 'dark');
}
// 수동 지정 시 모바일 브라우저 상단바 색을 실제 테마에 맞춘다(미지정이면 media 메타에 위임)
function updateThemeColorMeta() {
  const forced = document.documentElement.getAttribute('data-theme');
  let m = document.querySelector('meta#theme-color-dynamic');
  if (!forced) { if (m) m.remove(); return; }
  if (!m) {
    m = document.createElement('meta');
    m.id = 'theme-color-dynamic';
    m.setAttribute('name', 'theme-color');
    document.head.appendChild(m);
  }
  m.setAttribute('content', forced === 'dark' ? '#191919' : '#ffffff');
}

};
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// URL 자동 링크(B14): http(s)만. 긴 주소는 "도메인/…"으로 줄여 보여 주고 전체 주소는 툴팁.
// 파일 원문은 그대로(표시만). 이스케이프한 글 위에서 만들기 때문에 다른 HTML은 들어갈 수 없다.
// 속성값용 이스케이프(따옴표까지) — esc는 따옴표를 바꾸지 않으므로 속성값에 쓰지 않는다
const escAttr = (s) => esc(String(s)).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
function linkHTML(url) {
  const m = url.match(/^https?:\/\/([^/?#]+)([^]*)$/);
  const host = m ? m[1].replace(/^www\./, '') : url;
  const label = m && m[2] && m[2] !== '/' ? `${host}/…` : host;
  return `<a class="task-link" href="${escAttr(url)}" target="_blank" rel="noopener noreferrer" title="${escAttr(url)}">${esc(label)}</a>`;
}
// 원문(이스케이프 전)에서 URL을 찾고, 조각마다 이스케이프한다(R14 — 이스케이프한 글 위에서 끝 ';'를 떼면
// &amp; 같은 문자 참조가 반토막 났다). URL이 아닌 조각은 plain(이스케이프된 글)으로 한 번 더 가공
function linkify(raw, plain = (t) => t) {
  const out = [];
  const re = /https?:\/\/[^\s<>"']+/g;
  let last = 0, m;
  while ((m = re.exec(raw))) {
    let url = m[0];
    // 문장 끝 구두점·괄호 닫기는 링크에서 뺀다(괄호가 짝이 맞으면 유지)
    while (/[.,;:!?)\]]$/.test(url)) {
      const ch = url.slice(-1);
      if (ch === ')' && (url.match(/\(/g) || []).length >= (url.match(/\)/g) || []).length) break;
      url = url.slice(0, -1);
    }
    out.push(plain(esc(raw.slice(last, m.index))), linkHTML(url));
    last = m.index + url.length;
    re.lastIndex = last;

  out.push(plain(esc(raw.slice(last))));

const highlightMeta = (s) => linkify(s, (t) => t.replace(/\(([~^]?[\d\-/.][^)]*)\)/g, '<span class="meta-inline">($1)</span>'));

// ============ 공용 토스트 (F1) ============
// 규칙: 한 번에 하나만(새 것이 오면 이전 것은 그대로 확정되고 교체), 용도는 되돌리기·다시 시도·짧은 안내.
// 시간: 되돌리기 5초, 오류 6초, 안내 2.5초. 손가락·마우스가 올라가 있는 동안은 멈춤.
// PC에서 Cmd/Ctrl+Z = 지금 떠 있는 토스트의 되돌리기.
const TOAST_MS = { info: 2500, undo: 5000, error: 6000 };
// 마지막 동작 1개의 되돌리기(D2): 토스트가 있는 동작(보관·분류·메모 삭제 등)은 토스트가, 토스트가 없는 동작
// (체크·순서 바꾸기·우선순위·글 고치기·추가)은 setLastUndo가 기록. PC Cmd/Ctrl+Z가 이것을 무르고 그 행을 600ms 깜빡임
// S12: 기록은 "저장이 성공한 뒤"에만(reserveUndo → 성공하면 그 함수로 기록). 실패하면 기록이 남지 않는다.
// 기록되는 동작이 시작될 때마다 순번이 올라가 이전 기록을 지운다 → 늦게 끝난 앞 동작이 뒤 동작의 기록을 덮지 않음
let lastUndo = null;
let undoSeq = 0;
function setLastUndo(run, flashKey) {
  undoSeq++;
  let fired = false;
  lastUndo = { fire: () => { if (fired) return; fired = true; lastUndo = null; run(); if (flashKey) setTimeout(() => flashTaskRows([flashKey]), 0); } };
}
function reserveUndo() {
  const tok = ++undoSeq;
  lastUndo = null;
  return (run, flashKey) => { if (tok === undoSeq) { setLastUndo(run, flashKey); undoSeq = tok; } };
}
const clearLastUndo = () => { undoSeq++; lastUndo = null; };
const toastState = { timer: null, remaining: 0, startedAt: 0, action: null, kind: null };

function showToast(msg, { kind = 'info', ms, action = null } = {}) {
  const t = $('#toast');
  clearTimeout(toastState.timer);
  t.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  t.appendChild(span);
  toastState.action = null;
  toastState.kind = kind;
  if (action && action.label && typeof action.onClick === 'function') {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.type = 'button';
    btn.textContent = action.label;
    let fired = false;
    const fire = () => {
      if (fired) return;
      fired = true;
      hideToast();
      action.onClick();
    };
    btn.addEventListener('click', fire);
    t.appendChild(btn);
    toastState.action = { fire, undo: kind === 'undo' };
    // 되돌리기 토스트는 사라진 뒤에도 Cmd/Ctrl+Z로 무를 수 있게 "마지막 동작"으로 기억(D2)
    if (kind === 'undo') { undoSeq++; lastUndo = { fire }; }
  }
  t.classList.add('show');
  toastState.remaining = ms ?? TOAST_MS[kind] ?? TOAST_MS.info;
  startToastTimer();
}
function startToastTimer() {
  clearTimeout(toastState.timer);
  toastState.startedAt = Date.now();
  toastState.timer = setTimeout(hideToast, toastState.remaining);
}
function pauseToast() {
  if (!$('#toast').classList.contains('show')) return;
  clearTimeout(toastState.timer);
  toastState.remaining = Math.max(800, toastState.remaining - (Date.now() - toastState.startedAt));
}
function resumeToast() {
  if (!$('#toast').classList.contains('show')) return;
  startToastTimer();
}
function hideToast() {
  clearTimeout(toastState.timer);
  $('#toast').classList.remove('show');
  toastState.action = null;
}

// 화면에 보여줄 쉬운 오류 문구. 원래 오류(PUT 500, conflict 등)는 콘솔에만 남긴다.
function friendlyError(e, fallback = '저장하지 못했어요') {
  if (e && e.userMessage) return e.userMessage;
  if (e && e.uncertain && !(typeof navigator !== 'undefined' && navigator.onLine === false)) {
    return '연결이 끊겨 저장됐는지 확인하지 못했어요'; // B-5: 실제로는 저장됐을 수도 있음
  }
  // 연결 문제는 요청 단계에서 붙인 표시(network)로만 판단(Q15) — 코드 오류(TypeError)를 연결 탓으로 돌리지 않음
  if (e && (e.network || e.offline || (typeof navigator !== 'undefined' && navigator.onLine === false))) {
    return '인터넷 연결을 확인해 주세요';
  }
  return fallback;
}

const notify = {
  info: (msg, ms) => showToast(msg, { kind: 'info', ms }),
  undo: (msg, onUndo) => showToast(msg, { kind: 'undo', action: { label: '되돌리기', onClick: onUndo } }),
  error: (msg, { retry, label = '다시 시도', ms } = {}) =>
    showToast(msg, { kind: 'error', ms, action: retry ? { label, onClick: retry } : null }),
};
// 오류 객체를 받아 쉬운 말로 알린다(retry가 있으면 "다시 시도" 버튼)
function notifyError(e, { fallback, retry } = {}) {
  if (e) console.error(e);
  notify.error(friendlyError(e, fallback), { retry });
}

// 이전 호출부 호환: toast(msg, ms, { label, onClick })
function toast(msg, ms, action = null) {
  if (action) showToast(msg, { kind: 'undo', ms, action });
  else showToast(msg, { kind: 'info', ms });
}

// utf-8 safe base64
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// ============ GitHub API ============
// ============ 파일 스토어 (F3) ============
// 파일 하나 = 스토어 하나. 화면은 늘 view(= base + 아직 저장 안 된 연산 pending)로 그린다.
//  - base/sha: 마지막으로 확인된 원격본
//  - apply(op): 연산을 pending에 쌓고 view를 즉시 갱신(낙관적). 저장은 파일당 하나의 큐에서만.
//  - 저장 내용은 "base 위에 pending 연산을 다시 적용한 결과" → 저장 중에 생긴 변경이 덮이지 않음(A3b)
//  - 409(다른 기기·봇이 먼저 씀): 최신본을 받아 같은 연산을 다시 적용하고 재시도(최대 2번)
//  - reload(): base만 바꾸고 pending은 그 위에 다시 적용 → 불러오기가 미저장 변경을 지우지 않음(A3·A3c)
//  - 연산은 (content) => content 순수 함수. 대상은 줄 번호가 아니라 원문 줄·글·id로 찾는다.
//    대상을 못 찾으면 예외 → 그 연산만 버림(userMessage로 알림)
//  - 저장 실패 시: onFail 'keep'(체크 등)은 pending에 남겨 "저장 안 됨 · 다시 시도"로 재시도,
//    'drop'(추가·이동·보관 등)은 버리고 view를 되돌린 뒤 호출자에게 실패를 알림(글 복원·토스트는 호출자)
function deferred() {
  let resolve, reject;
  const promise = new Promise((a, b) => { resolve = a; reject = b; });
  promise.catch(() => {}); // 호출자가 기다리지 않아도 미처리 거부 경고를 내지 않게
  return { promise, resolve, reject };
}

// fetch 자체가 실패(응답 없음)하면 network 표시를 붙인다 — 연결 문제와 코드 오류를 구분(Q15)
async function netFetch(url, init) {
  try {
    return await fetch(url, init);
  } catch (e) {
    throw Object.assign(e instanceof Error ? e : new Error(String(e)), { network: true });
  }
}
async function ghGet(url) {
  const res = await netFetch(url, {
    headers: { Authorization: `Bearer ${state.token}`, Accept: 'application/vnd.github+json' },
    cache: 'no-cache',
  });
  if (!res.ok) {
    if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
    if (res.status === 404) throw Object.assign(new Error('not-found'), { code: 404 });
    throw Object.assign(new Error(`HTTP ${res.status}`), { code: res.status });
  }
  const data = await res.json();
  return { sha: data.sha, content: base64ToUtf8(data.content) };
}

// keepalive 요청은 브라우저가 동시에 보내는 본문 합계 64KB까지만 허용한다(넘으면 바로 실패, Q9)
const KEEPALIVE_MAX = 60 * 1024;
async function ghPut(url, content, sha, message, { keepalive = false } = {}) {
  const body = JSON.stringify({ message, content: utf8ToBase64(content), sha });
  const res = await netFetch(url, {
    method: 'PUT',
    keepalive: keepalive && body.length <= KEEPALIVE_MAX,
    headers: {
      Authorization: `Bearer ${state.token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body,
  });
  if (!res.ok) throw Object.assign(new Error(`PUT ${url.split('/').pop()} ${res.status}`), { code: res.status });
  const data = await res.json();
  return data.content.sha;
}

function createStore({ file, url, parse, serialize, onChange, onRebase, missing }) {
  const s = {
    file, base: null, sha: '', pending: [], view: null, loaded: false,
    queue: Promise.resolve(), timer: null, flushing: false,
    gen: 0, // 저장이 성공할 때마다 +1 — 그 전에 보낸 GET 응답은 낡은 것이라 버린다(Q3)
  };
  // pending 연산을 차례로 적용. 대상을 못 찾는 연산은 bad로 모은다.
  const applyAll = (base, ops) => {
    let c = base;
    const bad = [];
    for (const p of ops) {
      try { c = p.op(c); } catch (e) { bad.push({ p, e }); }
    }
    return { c, bad };
  };
  const recompute = () => {
    if (s.base == null) return;
    const { c, bad } = applyAll(s.base, s.pending);
    bad.forEach(({ p, e }) => dropOp(p, e));
    s.view = c;
    onChange && onChange(s.view);
  };
  const dropOp = (p, e) => {
    s.pending = s.pending.filter((x) => x !== p);
    p.done.reject(e);
    // 한 번 실패해 기다리는 곳이 없는 keep 연산(저장 못 한 체크·메모 수정)이 그 뒤 대상이 사라져 버려지면
    // 조용히 사라지지 않게 알린다(Q16)
    if (p.onFail === 'keep' && p.failedOnce) {
      notify.error(e && e.gone ? '다른 기기에서 지워지거나 바뀐 항목이라 저장하지 못했어요' : friendlyError(e));
    }
  };

  // gate: 이 연산을 저장해도 되는 시점(예: 다른 파일의 "추가"가 저장된 뒤). 화면에는 바로 반영되고,
  // gate가 풀리면 저장, gate가 실패하면 연산을 버리고 화면을 되돌린다(B9·A4 순서 보장).
  // idem: 두 번 적용해도 결과가 같은 연산(체크 상태 지정 등) — 앱을 벗어날 때 앞 저장을 기다리지 않고 보내도 안전(Q17)
  s.apply = (op, { msg = 'update', debounce = 0, onFail = 'drop', gate = null, idem = false } = {}) => {
    const p = { op, msg, onFail, idem, done: deferred(), ready: !gate };
    s.pending.push(p);
    recompute();
    if (gate) {
      gate.then(() => { p.ready = true; s.schedule(0); },
        (e) => { if (s.pending.includes(p)) { dropOp(p, e); recompute(); } });
    } else {
      s.schedule(debounce);
    }
    return p.done.promise;
  };
  // 즉시 저장하고 결과를 기다린다
  s.commit = (op, opts = {}) => {
    const pr = s.apply(op, { ...opts, debounce: 0 });
    return pr;
  };
  s.schedule = (debounce = 0) => {
    clearTimeout(s.timer);
    if (debounce > 0) s.timer = setTimeout(() => { s.timer = null; s.flush(); }, debounce);
    else { s.timer = null; s.flush(); }
  };
  s.flush = ({ keepalive = false } = {}) => {
    clearTimeout(s.timer);
    s.timer = null;
    const run = s.queue.then(() => flushOnce(keepalive));
    s.queue = run.catch(() => {});
    return run;
  };
  const flushOnce = async (keepalive) => {
    const batch = s.pending.filter((p) => p.ready);
    if (!batch.length) {
      // 다시 보낼 것이 없으면 남은 실패 표시도 정리
      if (syncStatus.errors[file]) { delete syncStatus.errors[file]; renderSync(); }
      return;
    }
    s.flushing = true;
    syncStatus.start(file);
    let rebased = false;
    try {
      // 아직 한 번도 불러오지 못했으면(첫 로딩 중·실패 뒤) 먼저 불러온 다음 그 위에 적용한다(Q4)
      if (s.base == null) await s.reloadBase();
      for (let attempt = 0; ; attempt++) {
        const { c: next, bad } = applyAll(s.base, batch);
        bad.forEach(({ p, e }) => { batch.splice(batch.indexOf(p), 1); dropOp(p, e); });
        if (!batch.length) { syncStatus.ok(file); recompute(); return; }
        const msg = batch.length === 1 ? batch[0].msg : `${batch[batch.length - 1].msg} (+${batch.length - 1})`;
        const text = serialize(next);
        try {
          s.sha = await ghPut(url, text, s.sha, msg, { keepalive });
          s.gen++;
          s.base = next;
          s.pending = s.pending.filter((p) => !batch.includes(p));
          recompute();
          syncStatus.ok(file);
          batch.forEach((p) => p.done.resolve());
          if (rebased) onRebase && onRebase();
          return;
        } catch (e) {
          // 409: 다른 기기·봇이 먼저 썼다. 422: 파일이 없던 줄 알고 sha 없이 보냈는데 그새 생겼다(Q18)
          if ((e.code === 409 || e.code === 422) && attempt < 2) {
            // → 최신본 위에 같은 연산을 다시 적용해 재시도
            await s.reloadBase();
            // 먼저 도착한 것이 앱을 떠날 때 보낸 내 요청이면 다른 기기 변경이 아니다(R20)
            if (s.leaveSent && serialize(s.base) === s.leaveSent) { s.leaveSent = null; continue; }
            rebased = true;
            continue;
          }
          if (e.network) {
            // 결과를 알 수 없는 실패(응답 전에 연결 끊김)(Q8·R5): 서버에 이미 반영됐을 수 있다.
            // 원격본을 다시 받아, 보낸 내용과 같거나 batch의 연산을 하나씩 다시 적용해도 아무것도 안 바뀌면
            // (제거 대상이 이미 없음 = gone 포함) 반영된 것으로 본다. 그 사이 다른 기기가 다른 줄을 써도 판정 가능
            // 판정은 연산마다 true(반영)·false(미반영)·null(애매). 한 번의 PUT은 통째로 반영되거나 안 되므로
            // 섞여 나오면 그 사이 다른 변경이 있었다는 뜻 → 애매. 애매하면 uncertain(되돌리지 않고 저널에 맡김, S3)
            let applied = false, reloaded = false, doubtful = false;
            const before = s.base;
            const sentSha = s.sha;
            try {
              reloaded = await s.reloadBase();
              if (reloaded) {
                const now = serialize(s.base);
                const vs = batch.map((p) => {
                  if (p.op.isApplied) return p.op.isApplied(s.base, before);
                  try { return serialize(p.op(s.base)) === now; } catch (e3) { return e3 && e3.gone ? null : false; }
                });
                applied = now === text || vs.every((v) => v === true);
                doubtful = !applied && !vs.every((v) => v === false);
              }
            } catch (e2) { /* 아직 연결 안 됨 */ }
            // 다시 받아 보지도 못했거나 판정이 애매 → 반영됐는지 모름. 저널이 원격 sha 변화를 보도록 보낸 기준 sha를 남김(S7)
            if (!applied && (!reloaded || doubtful)) { e.uncertain = true; e.baseSha = sentSha; }
            if (applied) {
              s.gen++;
              s.pending = s.pending.filter((p) => !batch.includes(p));
              recompute();
              syncStatus.ok(file);
              batch.forEach((p) => p.done.resolve());
              if (rebased) onRebase && onRebase();
              return;
            }
          }
          throw e;
        }
      }
    } catch (e) {
      console.error(e);
      // 토큰 만료·권한 변경(Q12): 같은 실패를 반복하지 않고 토큰 다시 입력 화면으로.
      // 저장 안 된 체크(keep)는 남겨 두어, 토큰을 다시 넣으면 다음 저장 때 함께 나간다
      if (e.code === 401) setTimeout(handleUnauthorized, 0);
      batch.forEach((p) => { if (p.onFail !== 'keep') dropOp(p, e); });
      // 저장 안 된 변경(keep)이 남아 있을 때만 "저장 안 됨 · 다시 시도"를 계속 보인다.
      // 버린 변경(추가·이동 등)은 호출자가 글 복원·토스트로 알린다.
      if (s.pending.some((p) => p.onFail === 'keep')) {
        syncStatus.retry[file] = () => s.flush();
        syncStatus.fail(file);
      } else {
        syncStatus.end(file);
      }
      recompute();
      if (rebased) onRebase && onRebase();
      // keep 연산은 남겨 두고 실패를 알린다(다시 시도하면 함께 저장)
      batch.forEach((p) => {
        if (p.onFail === 'keep') { const d = p.done; p.done = deferred(); p.failedOnce = true; d.reject(e); }
      });
    } finally {
      s.flushing = false;
    }
  };
  // 반환: 새 내용을 받았으면 true, 그 사이 저장이 끝나 낡은 응답이면 false(버림)
  s.reloadBase = async () => {
    const gen = s.gen;
    let r;
    try {
      r = await ghGet(url);
    } catch (e) {
      if (e.code !== 404 || missing == null) throw e;
      // 파일이 아직 없으면 빈 파일로 만든다(archive.json·memos.json 첫 사용)
      if (gen !== s.gen) return false;
      if (missing === false) { s.sha = undefined; s.base = parse(''); s.loaded = true; return true; }
      await ghPut(url, missing, undefined, `init: ${file}`);
      r = await ghGet(url);
    }
    if (gen !== s.gen) return false; // 이 GET을 보낸 뒤 저장이 성공함 → 응답이 저장 전 내용일 수 있음
    s.sha = r.sha;
    s.base = parse(r.content);
    s.loaded = true;
    return true;
  };
  // 원격본을 다시 받아 오되, 아직 저장 안 된 연산은 그 위에 다시 적용한다.
  // 저장(PUT)과 같은 큐에서 차례로 실행 — 늦게 온 GET 응답이 방금 저장한 내용을 되돌리지 않게(Q3)
  s.reload = () => {
    const run = s.queue.then(async () => { await s.reloadBase(); recompute(); });
    s.queue = run.catch(() => {});
    return run;
  };
  // 앱을 벗어날 때(Q17): 앞 저장이 아직 날아가는 중이면 큐에서 기다리다 페이지가 멈춰 못 보낼 수 있다.
  // 남은 연산이 모두 idem(체크)이면 기다리지 않고 지금 내용 전체를 keepalive로 바로 보낸다.
  // (앞 저장이 먼저 도착하면 이 요청은 409로 무시되고, 이 요청이 먼저면 앞 저장이 409 → 재적용해도 결과 같음)
  s.leaveFlush = () => {
    if (!s.hasReady()) return;
    if (s.flushing && s.base != null && s.pending.every((p) => p.idem)) {
      const { c } = applyAll(s.base, s.pending);
      s.leaveSent = serialize(c); // 이 요청이 먼저 도착해 앞 저장이 409가 나도 "다른 기기" 안내를 하지 않게(R20)
      ghPut(url, s.leaveSent, s.sha, 'save on leave', { keepalive: true }).catch(() => {});
      return;
    }
    s.flush({ keepalive: true });
  };
  s.hasPending = () => s.pending.length > 0;
  s.hasReady = () => s.pending.some((p) => p.ready);
  // 대기 중인 디바운스까지 지금 저장하고, 큐가 빌 때까지 기다린다
  s.flushAll = async (opts) => {
    if (s.hasReady()) await s.flush(opts);
    await s.queue;
  };
  return s;
}

// ---- inbox / archive / memos 연산 ----
// 추가 연산이 "결과 모름" 뒤 이미 반영됐는지 판단(R5·B-5): 같은 줄 개수가 보내기 전보다 늘었으면 반영됨
const countExactLines = (content, line) => (content || '').split('\n').filter((l) => l === line).length;
const withApplied = (fn, isApplied) => Object.assign(fn, { isApplied });
// rec(선택): 넣은 줄의 지문(되돌리기·실패 되돌림이 그 줄만 찾게, S1·S12)
const opInboxAppend = (texts, rec = null) => withApplied((c) => {
  let out = c || '';
  if (out && !out.endsWith('\n')) out += '\n';
  const first = out.split('\n').length - 1;
  texts.forEach((t) => { out += `- ${String(t).replace(/\s*[\r\n]+\s*/g, ' ').trim()}\n`; });
  if (rec) { const ls = out.split('\n'); rec.fps = texts.map((t, k) => lineFp(ls, first + k, INBOX_LOC)); }
  return out;
}, (now, before) => texts.every((t) => countExactLines(now, `- ${t}`) > countExactLines(before, `- ${t}`)));
// 제거 연산의 반영 판정(S3): 보내기 전(before)보다 그 글의 개수가 정확히 n개 줄었으면 반영, 그대로면 미반영,
// 그 밖(다른 기기도 같은 글을 지움·늘어남)은 애매(null) → 결과 모름으로 저널에 맡긴다.
// (제거를 다시 적용해 보는 방식은 같은 글이 여럿이면 남은 사본을 찾아 "미반영"으로 오판했다)
function removedVerdict(keys, countIn, now, before) {
  const need = new Map();
  keys.forEach((k) => need.set(k, (need.get(k) || 0) + 1));
  const vs = [...need].map(([k, n]) => {
    const d = countIn(before, k) - countIn(now, k);
    return d === n ? true : d === 0 ? false : null;
  });
  if (vs.every((v) => v === true)) return true;
  if (vs.every((v) => v === false)) return false;
  return null;
}
const countKeyLines = (key) => (content, k) => (content || '').split('\n').filter((l) => key(l) === k).length;
const opInboxRemove = (items) => withApplied((c) => removeInboxLines(items, c, { strict: true }),
  (now, before) => removedVerdict(items.map((i) => inboxKey(inboxTarget(i).raw)), countKeyLines(inboxKey), now, before));
const opArchiveAdd = (entries) => (list) => [...list, ...entries.filter((e) => !list.some((x) => x.id === e.id))];
const opArchiveRemove = (ids) => withApplied((list) => list.filter((x) => !ids.includes(x.id)), (now, before) => {
  const was = ids.filter((id) => (before || []).some((x) => x.id === id));
  const left = was.filter((id) => (now || []).some((x) => x.id === id));
  return left.length === 0 ? true : left.length === was.length ? false : null;
});
const opMemoReplace = (fn) => (list) => fn(list);
const memoGone = () => {
  const msg = '메모가 이미 바뀌었어요. 새로 불러온 뒤 다시 해 주세요';
  return Object.assign(new Error(msg), { userMessage: msg, gone: true });
};
const opMemoEdit = (id, text) => (list) => {
  if (!list.some((x) => x.id === id)) throw memoGone();
  return list.map((x) => (x.id === id ? { ...x, text } : x));
};
// ---- 두 파일 이동 (F4) ----
// 원칙: "추가 먼저, 제거 나중" — 중간에 실패해도 유실이 아니라 중복이 된다. 그 위에 보상을 얹는다.
//  adds: [{ store, op, undo, msg }] 차례로 저장. 하나라도 실패하면 앞서 저장한 추가를 거꾸로 되돌림
//  remove: { store, op, msg } 마지막에 저장. 실패하면 모든 추가를 되돌림 → 항목은 원래 자리에만 남음
//  되돌리기마저 실패하면 e.partial = true (두 곳에 있을 수 있음 → "일부만 저장됐어요 · 새로 불러오기")
function runTransfer({ adds, remove }) {
  // 선기록(R16): 화면을 바꾸기 전에 "제거" 단계를 저널에 먼저 쓴다. 끝나면(성공·되돌림) 지운다
  // 진행 중 표시는 이 탭(liveJournal)과 다른 탭(기록의 owner·beat, S5) 모두에 남긴다
  const jid = remove.journal ? addJournal({ ...remove.journal, msg: remove.msg }) : null;
  if (jid) liveJournal.add(jid);
  // keep: 다음 확인 때 마저 정리하도록 남김(소유 해제 → 어느 탭이든 실행 가능). patch: 기록에 덧붙일 값(sha 등)
  const finishJournal = (keep, patch = null) => {
    if (!jid) return;
    liveJournal.delete(jid);
    if (!keep) dropJournal(jid);
    else patchJournal(jid, { owner: null, beat: 0, ...(patch || {}) });
  };
  const journalTakenElsewhere = () => !!jid && !readJournal().some((x) => x.id === jid);
  // 화면은 지금 바로 바뀐다(B9): 추가 쪽은 즉시, 제거 쪽은 화면엔 즉시·저장은 추가가 저장된 뒤(gate)
  const addPs = adds.map((a) => a.store.apply(a.op, { msg: a.msg }));
  const gate = Promise.all(addPs);
  gate.catch(() => {});
  const removeP = remove.store.apply(remove.op, { msg: remove.msg, gate });
  const rollback = async (okAdds, cause) => {
    for (const a of okAdds.reverse()) {
      try {
        await a.store.commit(a.undo, { msg: `rollback: ${a.msg}` });
      } catch (e3) {
        console.error('rollback failed', e3);
        throw Object.assign(new Error('partial'), { partial: true, cause });

  return (async () => {
    const results = await Promise.allSettled(addPs);
    const failed = results.find((r) => r.status === 'rejected');
    if (failed) {

      const okAdds = adds.filter((a, i) => results[i].status === 'fulfilled');
      finishJournal(false);

    try {
      await removeP;

    } catch (e2) {
      // 다른 탭이 이 기록을 먼저 실행해 제거를 끝냈다(기록이 사라짐) → 되돌리면 두 곳 모두에서 사라진다(S5)
      if (e2 && e2.gone && journalTakenElsewhere()) { liveJournal.delete(jid); return; }
      if (e2 && e2.uncertain) {
        // 제거가 서버에 반영됐는지 모름(R5): 여기서 추가를 되돌리면 둘 다 사라질 수 있다.
        // 되돌리지 않고 선기록 저널에 맡긴다(다음 확인 때 도착지·개수를 보고 마저 정리 — 중복은 잠깐 생길 수 있어도 유실 없음)
        // 보낸 기준 sha를 남겨, 그 뒤 원격이 바뀌었으면(내 요청이 반영됐거나 다른 기기가 씀) 자동으로 지우지 않게(S7)
        finishJournal(true, { sha: e2.baseSha || null, uncertain: true });
        throw Object.assign(new Error('uncertain'), { uncertain: true, journaled: true, cause: e2 });
      }

        await rollback([...adds], e2);
        finishJournal(false); // 되돌림 성공 → 한 곳(원래 자리)에만 있음
      } catch (e3) {
        // 추가는 저장됐는데 제거·되돌리기가 모두 실패 → 기록을 남겨 다음 기회에 마저 끝낸다(Q6)
        const keep = !!(e3.partial && !(e2 && e2.gone));
        finishJournal(keep);
        if (keep) e3.journaled = true;
        throw e3;
      }

}

// ---- 마저 정리하기 기록(저널, Q6·R16·R11) ----
// 두 파일 이동의 "제거" 단계를 데이터로 localStorage에 남긴다.
// R16 선기록: 이동을 시작할 때 먼저 쓰고, 끝나면(성공·되돌림) 지운다 → 이동 도중 앱이 종료돼도 다음 실행 때 마저 정리.
// R11 확인 조건: 다시 실행하기 전에
//   ① 도착지에 사본이 실제로 있는지(verify) — 없으면 이동이 안 된 것이거나 사용자가 사본을 지운 것 → 실행하지 않음
//   ② 지울 대상 개수가 기록 때와 같은지(expectCount) — 줄었으면 이미 지워짐, 늘었으면(같은 글 새로 생김) 자동 실행 안 함
//   ③ 24시간 이내인지
const JOURNAL_KEY = lsKey('tako_pending_moves');
const JOURNAL_MAX_AGE = 24 * 3600 * 1000;
const countActiveLine = (key, raw) => {
  const want = normLine(raw.trim());
  const sec = state.sections.find((x) => x.title === SECTION_KEYS[key]);
  return sec ? sec.items.filter((i) => normLine(i.raw.trim()) === want).length : 0;
};
const countAllActive = (raw) => {
  const want = normLine(raw);
  return state.content.split('\n').filter((l) => normLine(l) === want).length;
};
const countInbox = (t) => state.inboxItems.filter((i) => i.text === t).length;
const JOURNAL_OPS = {
  archiveRemove: { store: () => archiveStore, op: (ids) => opArchiveRemove(ids),
    count: (ids) => state.archiveItems.filter((e) => ids.includes(e.id)).length },
  inboxRemove: { store: () => inboxStore, op: (items) => opInboxRemove(items),
    count: (items) => [...new Set(items.map((i) => i.text))].reduce((n, t) => n + countInbox(t), 0) },
  activeDeleteBlock: { store: () => activeStore, op: (item) => opDeleteBlock(item),
    count: (item) => countAllActive(item.raw) },
  activeDeleteBlocks: { store: () => activeStore, op: (items) => opDeleteBlocks(items),
    count: (items) => [...new Set(items.map((i) => normLine(i.raw)))].reduce((n, r) => n + countAllActive(r), 0) },
  activeRemoveAppended: { store: () => activeStore, op: (key, texts, fps) => opActiveRemoveAppended(key, texts, fps),
    count: (key, texts) => [...new Set(texts)].reduce((n, t) => n + countActiveLine(key, `- [ ] ${t}`), 0) },
};
// 도착지 확인(verify) 종류 — 도착지의 같은 글(id) 개수. 기록할 때의 개수(before)보다 "늘었을 때만" 이동된 것으로 본다(S6:
// 도착지에 원래 같은 글이 있으면 "있는지"만으로는 이동이 안 됐어도 통과해 원래 자리 항목을 지웠다)
const JOURNAL_DEST = {
  archiveHas: (v) => v.ids.map((id) => ['a:' + id, () => state.archiveItems.filter((e) => e.id === id).length]),
  inboxHas: (v) => v.texts.map((t) => ['i:' + t, () => countInbox(t)]),
  activeHas: (v) => v.texts.map((t) => ['t:' + t, () => countActiveLine(v.key, `- [ ] ${t}`)]),
  activeHasFirst: (v) => v.list.map((x) => [`f:${x.priority}:${x.first}`, () => countActiveLine(x.priority, x.first)]),
};
function destCounts(v) {
  const m = {};
  (JOURNAL_DEST[v.k] ? JOURNAL_DEST[v.k](v) : []).forEach(([k, f]) => { m[k] = { need: ((m[k] && m[k].need) || 0) + 1, now: f() }; });
  return m;
}

  if (!JOURNAL_DEST[v.k] || !v.before) return false;

  return Object.keys(m).every((k) => m[k].now - (v.before[k] || 0) >= m[k].need);
}
function restoreVerify(entries) {
  const out = [];
  const act = entries.filter((e) => e.source === 'active' && e.block && e.block[0]);
  if (act.length) out.push({ k: 'activeHasFirst', list: act.map((e) => ({ priority: e.priority, first: e.block[0] })) });
  const inb = entries.filter((e) => e.source === 'inbox').map((e) => e.text);

}
function readJournal() {
  try { return JSON.parse(localStorage.getItem(JOURNAL_KEY) || '[]') || []; } catch (e) { return []; }
}
function writeJournal(list) {
  try {
    if (list.length) localStorage.setItem(JOURNAL_KEY, JSON.stringify(list));
    else localStorage.removeItem(JOURNAL_KEY);
  } catch (e) {}
}
const liveJournal = new Set(); // 이 탭에서 아직 진행 중인 이동(다시 실행하면 안 됨)
// 다른 탭(같은 브라우저의 PC 탭 2개, PWA 창 + 탭)도 같은 기록을 본다(S5). 진행 중인 탭은 기록에 자기 id(owner)와
// 갱신 시각(beat)을 15초마다 남기고, 다른 탭은 beat가 90초 넘게 멈춘 기록만 실행한다(탭이 닫히거나 멈춤)
const TAB_ID = genArchiveId();
const JOURNAL_BEAT_MS = 15000;
const JOURNAL_STALE_MS = 90000;
const JOURNAL_VER = 2; // verify.before·expectCount를 남기는 형식. 그 전 기록은 확인할 근거가 없어 실행하지 않음(S20④)
let journalBeatTimer = null;
function journalBeat() {
  if (!liveJournal.size) { clearInterval(journalBeatTimer); journalBeatTimer = null; return; }
  const now = Date.now();
  writeJournal(readJournal().map((j) => (liveJournal.has(j.id) ? { ...j, owner: TAB_ID, beat: now } : j)));
}
function patchJournal(id, patch) {

}
// 이 탭이 닫힐 때 진행 중이던 기록을 놓아 준다(새로고침 뒤 바로 마저 정리)
function releaseJournal() {
  if (!liveJournal.size) return;
  writeJournal(readJournal().map((j) => (liveJournal.has(j.id) ? { ...j, owner: null, beat: 0 } : j)));
}
const ownedElsewhere = (j) => !!j.owner && j.owner !== TAB_ID && Date.now() - (j.beat || 0) < JOURNAL_STALE_MS;
// 선기록: 화면에 반영(apply)하기 전, 지금 보이는 상태 기준으로 지울 대상 개수와 도착지 개수를 함께 남긴다
function addJournal(step) {
  const d = JOURNAL_OPS[step.type];
  const verify = (step.verify || []).map((v) => {
    const m = destCounts(v);
    const before = {};
    Object.keys(m).forEach((k) => { before[k] = m[k].now; });
    return { ...v, before };
  });
  const entry = {
    id: genArchiveId(), ver: JOURNAL_VER, at: new Date().toISOString(), type: step.type, args: step.args,
    verify, expectCount: d.count(...step.args), msg: step.msg || step.type, owner: TAB_ID, beat: Date.now(),

  if (!journalBeatTimer) journalBeatTimer = setInterval(journalBeat, JOURNAL_BEAT_MS);

}
function dropJournal(id) { writeJournal(readJournal().filter((x) => x.id !== id)); }
let journalRunning = false;
let journalRecheck = null;
// 실행 순서: 불러오기를 마친 state 기준(refresh 뒤에만 부름 — online에서도 refresh를 거침, S7)
//  ① 다른 탭이 진행 중(owner·beat 신선)이면 건너뜀 ② 옛 형식·24시간 넘음 → 지움(안내)
//  ③ 도착지 개수가 기록 때보다 늘지 않았으면 → 이동이 안 됐거나 사본이 정리됨 → 지움
//  ④ 지울 대상 개수: 줄었으면 이미 정리됨, 늘었으면 같은 글이 새로 생김(안내) → 지움
//  ⑤ 결과 모름 기록인데 원격 sha가 그 뒤 바뀜 → 자동으로 지우지 않음(안내)
async function runJournal() {
  if (journalRunning || !state.token) return;
  const all = readJournal().filter((j) => !liveJournal.has(j.id));
  const busy = all.filter(ownedElsewhere);
  const list = all.filter((j) => !ownedElsewhere(j));
  // 다른 탭이 잡고 있는 기록은 그 탭이 멈췄을 때를 대비해 나중에 다시 확인
  if (busy.length && !journalRecheck) journalRecheck = setTimeout(() => { journalRecheck = null; runJournal(); }, JOURNAL_STALE_MS + 1000);
  if (!list.length) return;
  journalRunning = true;
  let changed = false, doubtful = false;
  try {
    for (const j of list) {
      const d = JOURNAL_OPS[j.type];
      if (!d) { dropJournal(j.id); continue; }
      if (j.ver !== JOURNAL_VER || j.expectCount == null) { dropJournal(j.id); doubtful = true; continue; }
      if (Date.now() - new Date(j.at).getTime() > JOURNAL_MAX_AGE) { dropJournal(j.id); doubtful = true; continue; }
      const destOk = (j.verify || []).every(destArrived);
      if (!destOk) { dropJournal(j.id); continue; } // 이동이 안 됐거나 사본이 이미 정리됨 → 남은 쪽은 건드리지 않음
      const now = d.count(...j.args);
      if (now !== j.expectCount) {
        dropJournal(j.id);
        if (now > j.expectCount) doubtful = true; // 같은 글이 새로 생김 → 자동으로 지우지 않음
        continue; // 줄었으면 이미 정리된 것
      }
      if (j.uncertain && j.sha && d.store().sha !== j.sha) { dropJournal(j.id); doubtful = true; continue; }
      try {
        await d.store().commit(d.op(...j.args), { msg: `finish: ${j.msg}` });
        changed = true;
        dropJournal(j.id);
      } catch (e) {
        if (e && e.gone) dropJournal(j.id); // 이미 정리됨
        else break; // 아직 연결이 안 됨 → 다음 기회에
      }
    }
  } finally {
    journalRunning = false;
  }
  if (changed) renderCurrent();
  if (doubtful) notify.error('두 곳에 남은 항목이 있을 수 있어요. 한 번 확인해 주세요');
}

// 이동 실패 알림(디자이너 스펙 A4)
function notifyTransferError(e, retry) {
  console.error(e && e.cause ? e.cause : e);
  if (e && e.uncertain && e.journaled) {
    notify.error('연결이 끊겨 저장됐는지 확인하지 못했어요. 연결되면 정리할게요', { label: '다시 확인', retry: () => refresh() });
  } else if (e && e.partial && e.journaled) {
    notify.error('일부만 저장됐어요. 연결되면 마저 정리할게요', { label: '지금 다시', retry: () => runJournal().then(refresh) });
  } else if (e && e.partial) {
    notify.error('일부만 저장됐어요', { label: '새로 불러오기', retry: refresh });
  } else if (e && e.rolledBack && e.cause && e.cause.gone) {
    // 이미 다른 곳에서 처리됨 → 다시 시도할 일이 아님. 최신 내용으로 다시 그림
    notify.error(e.cause.userMessage || '목록이 바뀌었어요');
    refresh();
  } else if (e && e.rolledBack) {
    notify.error('옮기지 못했어요. 원래 자리에 그대로 있어요', { retry });
  } else {
    notify.error(friendlyError(e), { retry });
  }
}

// 되돌리기 대상을 못 찾으면 조용히 성공하지 않고 gone(Q7) → runTransfer가 "일부만 저장됐어요"로 알림
const undoGone = () => {
  const msg = '되돌릴 항목이 그새 바뀌었어요';
  return Object.assign(new Error(msg), { userMessage: msg, gone: true });

const sectionRange = (lines, key) => {
  const header = sectionHeaderIndex(lines, key);
  if (header === -1) return null;
  let end = lines.length;
  for (let i = header + 1; i < lines.length; i++) if (lines[i].startsWith('## ')) { end = i; break; }
  return { header, end };
};
// 넣은 그 줄들(기록한 지문 fps)을 찾아 지운다 — 추가·복구의 되돌리기와 실패 되돌림(S1·S12).
// 글로 찾지 않으므로 같은 글의 원래 항목을 지우지 않는다. 저장되는 사이 체크하거나 하위를 붙였어도 찾음(체크 무시, 하위 포함).
// 하나라도 정확히 못 찾으면 gone(Q7)
const removeByFps = (fps, opts = {}) => (c) => {
  if (!fps || !fps.length) throw undoGone();
  const lines = c.split('\n');
  const claimed = new Set();
  const ranges = fps.map((fp) => {
    let idx;
    try { idx = locate(lines, fp, { ...opts, exclude: claimed }); } catch (e) { throw undoGone(); }
    const end = blockEndAt(lines, idx, opts.block !== false);
    for (let i = idx; i <= end; i++) claimed.add(i);
    return { start: idx, end };
  });
  ranges.sort((a, b) => b.start - a.start).forEach((r) => lines.splice(r.start, r.end - r.start + 1));
  return lines.join('\n');
};
// Task: 넣은 블록들 지우기. rec는 {fps}를 담은 기록(연산이 채움) 또는 지문 목록
const opActiveRemoveRec = (rec) => (c) => removeByFps(Array.isArray(rec) ? rec : rec && rec.fps)(c);

const opActiveRemoveAppended = (key, texts, fps) => opActiveRemoveRec(fps || []);

// 지운 메모를 원래 col/order 그대로 되살리기(메모 삭제 되돌리기 전용). 새 메모 추가는 opMemoAddTop(봇과 같은 규칙)

    .filter((x) => x.id !== m.id && Math.min(cols - 1, Math.max(0, memoCol(x))) === targetCol)

  const bi = belowId ? colList.findIndex((x) => x.id === belowId) : -1;
  const ai = aboveId ? colList.findIndex((x) => x.id === aboveId) : -1;
  if (bi !== -1) idx = bi;
  else if (ai !== -1) idx = ai + 1;
  else if (!belowId && aboveId == null) idx = Math.min(targetIdx, colList.length);
  else if (!belowId) idx = colList.length;

// ---- active.md 연산 (모두 content → content) ----
// 렌더 시점 item(raw·lineIndex)으로 현재 줄을 다시 찾는다.
const lineOf = (item, content) => resolveLineIndex(item, content.split('\n'));

const opAppend = (key, text, rec = null) => withApplied((c) => {

// 되돌리기는 글로 다시 찾지 않는다. 연산이 실행될 때 "그 연산이 만든 줄"의 지문(locate용)과
// 원래 자리(바로 위 기준 줄의 지문)를 rec에 남기고, 되돌릴 때 그 지문으로만 찾는다(못 고르면 gone).
// rec는 연산이 다시 적용될 때마다(409 재적용·다시 그리기) 마지막 결과로 갱신된다.
// 블록을 뺀 줄 배열 mid에서, 블록이 있던 자리(at) 바로 위 기준 줄
function anchorAt(mid, at) {
  let a = at - 1, gap = 0;
  while (a >= 0 && mid[a].trim() === '') { a--; gap++; }
  if (a < 0) return { top: true, gap };
  if (/^##\s/.test(mid[a])) return { header: mid[a], gap };
  return { fp: lineFp(mid, a), gap };
}
// 기준 줄 다음 = 다시 넣을 자리. 기준 줄을 정확히 하나로 못 찾으면 gone
function anchorIndex(lines, anchor) {
  let a;
  if (!anchor) throw undoGone();
  if (anchor.top) a = -1;
  else if (anchor.header != null) {
    const hs = [];
    lines.forEach((l, i) => { if (l === anchor.header) hs.push(i); });
    if (hs.length !== 1) throw undoGone();
    a = hs[0];
  } else {
    try { a = locate(lines, anchor.fp); } catch (e) { throw undoGone(); }
  }
  let at = a + 1;
  for (let k = 0; k < (anchor.gap || 0) && lines[at] != null && lines[at].trim() === ''; k++) at++;
  return at;
}
const recordMove = (rec, info, out) => {
  if (!rec || info.at == null) return;
  rec.fp = lineFp(out.split('\n'), info.at);
  rec.indent = info.from.indent;
  rec.anchor = anchorAt(info.from.mid, info.from.start);
};
const opEdit = (item, text, rec = null) => (c) => {
  const idx = lineOf(item, c);
  const out = editLine(idx, text, c);
  if (rec) rec.fp = lineFp(out.split('\n'), idx);
  return out;
};
// 글 고치기 되돌리기: 고친 그 줄(기록한 지문)을 원래 글로
const opEditBack = (rec, backText) => (c) => {
  if (!rec || !rec.fp) throw undoGone();
  let idx;
  try { idx = locate(c.split('\n'), rec.fp); } catch (e) { throw undoGone(); }
  return editLine(idx, backText, c);
};
const opEditMove = (item, text, key, rec = null) => (c) => {
  const idx = lineOf(item, c);
  const info = {};
  const out = moveLineToSection(idx, key, editLine(idx, text, c), info);
  recordMove(rec, info, out);
  return out;
};
const opDeleteBlock = (item) => withApplied((c) => deleteAt(lineOf(item, c), c),
  (now, before) => removedVerdict([normLine(item.raw)], countKeyLines(normLine), now, before));
// 옮기기·우선순위 변경 되돌리기(D2·S1): 옮긴 그 블록(기록한 지문)을 "지금 모습 그대로"(그 사이 체크·하위 변경 유지)
// 빼서 원래 기준 줄 다음, 원래 들여쓰기로 다시 넣는다. backText: 글도 함께 고쳤으면 원래 글로
const opUndoMove = (rec, { backText = null } = {}) => (c) => {
  if (!rec || !rec.fp) throw undoGone();
  const lines = c.split('\n');
  let idx;
  try { idx = locate(lines, rec.fp); } catch (e) { throw undoGone(); }
  const r = extractBlock(lines, idx);
  let block = lines.splice(r.start, r.end - r.start + 1);
  block = adjustBlockIndent(block, rec.indent - getLineIndent(block[0]));
  if (backText != null) block[0] = editLine(0, backText, block[0]);
  const at = anchorIndex(lines, rec.anchor);
  lines.splice(at, 0, ...block);
  return lines.join('\n');
};
// 보관함 항목들을 되돌려 넣기
// rec(선택): 넣은 블록들의 지문(실패 되돌림이 그 블록만 지우게)
const opRestore = (entries, rec = null) => (c) => {
  const lines = c.split('\n');
  const ats = [];
  entries.forEach((entry) => {
    const n = (entry.block || []).length;
    const at = restoreBlockInto(lines, entry);
    if (at < 0) return;
    for (let k = 0; k < ats.length; k++) if (ats[k] >= at) ats[k] += n;
    ats.push(at);
  });
  if (rec) rec.fps = recFps(lines, ats);
  return lines.join('\n');
};
// 앞 블록을 넣으면 뒤 블록 번호가 밀리므로, 넣은 번호를 그때그때 기록한 뒤 마지막 내용에서 다시 계산
function recFps(lines, ats) {
  return ats.filter((a) => a >= 0).map((a) => lineFp(lines, a));
}
// 여러 블록을 원문 줄로 찾아 한꺼번에 지우기(뒤에서부터)
// 여러 대상을 한 번에 찾는다(Q1): 이미 잡힌 블록의 줄은 다음 대상 후보에서 빼서, 같은 글이 둘이어도
// 서로 다른 줄로 배정된다. 범위가 겹치면 하나로 합친다.
const opDeleteBlocks = (items) => withApplied((c) => {
  const lines = c.split('\n');
  const claimed = new Set();
  const ranges = [];
  items.forEach((it) => {
    const idx = resolveLineIndex(it, lines, { exclude: claimed });
    const r = extractBlock(lines, idx);
    for (let i = r.start; i <= r.end; i++) claimed.add(i);
    ranges.push(r);
  });
  ranges.sort((a, b) => a.start - b.start);
  const merged = [];
  ranges.forEach((r) => {
    const last = merged[merged.length - 1];
    if (last && r.start <= last.end) last.end = Math.max(last.end, r.end);
    else merged.push({ ...r });
  });
  merged.reverse().forEach((r) => lines.splice(r.start, r.end - r.start + 1));
  return lines.join('\n');
}, (now, before) => removedVerdict(items.map((it) => normLine(it.raw)), countKeyLines(normLine), now, before));
// 드래그 이동: 목표 줄도 원문으로 다시 찾는다
const opMove = (srcItem, target, rec = null) => (c) => {
  const lines = c.split('\n');
  const t = { ...target };
  if (target.beforeItem) t.beforeLine = resolveLineIndex(target.beforeItem, lines);
  if (target.intoItem) t.intoLine = resolveLineIndex(target.intoItem, lines);
  const info = {};
  const out = moveLineToPosition(resolveLineIndex(srcItem, lines), t, c, info);
  recordMove(rec, info, out);
  return out;
};

// ============ Parsing / Mutation ============
// key: 줄 번호 대신 쓰는 안정 키(Q10·Q14) = 글 + 같은 글 중 몇 번째. 위쪽 줄이 바뀌어도 같은 항목을 가리킨다
function parseInbox(text) {
  const seen = new Map();
  const lines = text.split('\n');
  const same = new Map();
  lines.forEach((l, i) => { const k = inboxKey(l); if (!same.has(k)) same.set(k, []); same.get(k).push(i); });
  return lines
    .map((line, idx) => ({ line, idx }))
    .filter(({ line }) => line.match(/^-\s+\S/))
    .map(({ line, idx }) => {
      const t = line.replace(/^-\s+/, '').trim();
      const n = (seen.get(t) || 0) + 1;
      seen.set(t, n);
      const list = same.get(inboxKey(line));
      // 지문(locate): Inbox는 섹션이 없어 section null, 하위 없음
      return { text: t, lineIdx: idx, key: `${t}\u0000${n}`, raw: line, lineIndex: idx, section: null,
        ordinal: list.indexOf(idx), sameCount: list.length, ...lineSig(lines, idx, INBOX_LOC) };
    });
}

// Inbox 줄 위치는 렌더 이후 바뀔 수 있다(앞선 처리·봇 추가). 줄 번호가 아니라 지문으로 locate.
// 정확히 하나로 정해지지 않으면 -1(이미 지워졌거나 애매함)
const inboxTarget = (item) => ({ ...item, raw: item.raw != null ? item.raw : `- ${item.text}`,
  lineIndex: item.lineIndex != null ? item.lineIndex : item.lineIdx });
function resolveInboxLine(item, lines, { exclude = null } = {}) {
  try { return locate(lines, inboxTarget(item), { ...INBOX_LOC, exclude }); } catch (e) { return -1; }
}

function removeInboxLine(item, content = state.inboxContent) {
  return removeInboxLines([item], content);
}

// strict: 지울 줄을 하나라도 못 찾으면 gone(Q14) — 다른 기기가 이미 옮긴 항목을 또 옮겨 Task에 2개가 되지 않게
function removeInboxLines(items, content = state.inboxContent, { strict = false } = {}) {
  const lines = content.split('\n');
  const idxs = [];
  items.forEach((it) => {
    const i = resolveInboxLine(it, lines, { exclude: new Set(idxs) });
    if (i !== -1) idxs.push(i);
    else if (strict) {
      const msg = '이미 다른 곳에서 정리된 항목이에요';
      throw Object.assign(new Error(msg), { userMessage: msg, gone: true });
    }
  });
  idxs.sort((a, b) => b - a).forEach((idx) => lines.splice(idx, 1));
  return lines.join('\n');
}

// (A8 연타 잠금은 B9 즉시 반영 + C1 자리 탭 무시 + strict 제거(Q14)로 대체하고 없앴다 — R8)


function parseSections(text) {
  const lines = text.split('\n');
  const sections = [];
  let cur = null;
  lines.forEach((line, idx) => {
    const hd = line.match(/^##\s+(.+)$/);
    if (hd) {
      cur = { title: hd[1].trim(), items: [], headerLine: idx };
      sections.push(cur);
      return;
    }
    if (!cur) return;
    const cb = line.match(/^(\s*)- \[([ xX])\] (.*)$/);
    if (cb) {
      cur.items.push({
        type: 'task',
        indent: Math.floor(cb[1].length / 2),
        checked: cb[2].toLowerCase() === 'x',
        text: cb[3],
        lineIndex: idx,
        raw: line, // 저장 직전 실제 줄 위치를 다시 확인하는 기준값
      });
      return;
    }
    const bl = line.match(/^(\s*)- (.+)$/);
    if (bl && bl[2].trim() !== '') {
      cur.items.push({
        type: 'bullet',
        indent: Math.floor(bl[1].length / 2),
        text: bl[2],
        lineIndex: idx,
        raw: line,
      });
    }
  });
  // 같은 글의 줄이 여럿일 때 구분할 단서(Q2): 섹션, 부모 줄, 파일 안에서 같은 글 중 몇 번째인지
  const same = new Map();
  lines.forEach((l, i) => { const k = normLine(l); if (!same.has(k)) same.set(k, []); same.get(k).push(i); });
  sections.forEach((sec) => {
    const stack = [];
    sec.items.forEach((it) => {
      while (stack.length && stack[stack.length - 1].indent >= it.indent) stack.pop();
      it.section = sec.title;
      it.parentRaw = stack.length ? stack[stack.length - 1].raw : null;
      const list = same.get(normLine(it.raw)) || [];
      it.ordinal = list.indexOf(it.lineIndex);
      it.sameCount = list.length;
      Object.assign(it, lineSig(lines, it.lineIndex));
      stack.push(it);
    });
  });
  return sections;
}

function findSectionByKey(key) {
  const want = SECTION_KEYS[key];
  return state.sections.find((s) => s.title === want);
}

function sectionHeaderIndex(lines, key) {
  const want = SECTION_KEYS[key];
  return lines.findIndex((l) => l.match(/^##\s+(.+)$/)?.[1]?.trim() === want);
}

// 섹션 헤더가 사라진 파일에서도 막히지 않도록, 없으면 정해진 순서에 맞춰 다시 만든다.
// (헤더가 지워진 채로 두면 그 우선순위로는 추가·이동·복구가 전부 실패한다)
function ensureSectionHeader(lines, key) {
  const found = sectionHeaderIndex(lines, key);
  if (found !== -1) return found;
  const order = ['high', 'medium', 'low'];
  const laterIdx = order
    .slice(order.indexOf(key) + 1)
    .map((k) => sectionHeaderIndex(lines, k))
    .filter((i) => i !== -1);
  const at = laterIdx.length ? Math.min(...laterIdx) : lines.length;
  lines.splice(at, 0, `## ${SECTION_KEYS[key]}`);
  return at;
}

// 섹션 안에서 새 줄을 넣을 기준 위치(마지막 비어있지 않은 줄)
function sectionInsertAfter(lines, key) {
  const headerIdx = ensureSectionHeader(lines, key);
  let insertAfter = headerIdx;
  for (let i = headerIdx + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    if (lines[i].trim() !== '') insertAfter = i;
  }
  return insertAfter;
}

// 섹션 끝에 블록을 넣는다. 마지막 줄이 "- " 자리표시자면 그 줄을 대체한다.
// 반환: 넣은 블록 첫 줄의 번호(되돌리기 기록용)
function insertIntoSection(lines, key, block) {
  const at = sectionInsertAfter(lines, key);
  if (lines[at].trim() === '-' || lines[at].trim() === '- ') { lines.splice(at, 1, ...block); return at; }
  lines.splice(at + 1, 0, ...block);
  return at + 1;
}

// 렌더 시점의 lineIndex는 그 뒤 다른 저장이 끝나면 어긋난다(줄이 늘거나 줄어듦).
// 그 상태로 삭제·이동하면 엉뚱한 줄(섹션 헤더까지)이 지워지므로,
// 저장 직전에 원본 줄 내용으로 실제 위치를 다시 찾는다.
function normLine(l) {
  return l == null ? null : l.replace(/- \[[xX]\]/, '- [ ]');
}

// 줄이 속한 섹션 제목과 부모 줄(원문)
function lineContext(ls, idx) {
  const ind = getLineIndent(ls[idx] || '');
  let parent = null, section = null;
  for (let i = idx - 1; i >= 0; i--) {
    const l = ls[i];
    const hd = l.match(/^##\s+(.+)$/);
    if (hd) { section = hd[1].trim(); break; }
    if (parent == null && l.trim() !== '' && /^\s*- /.test(l) && getLineIndent(l) < ind) parent = l;
  }
  return { section, parent };
}

// ---- 대상 찾기(공용, QA3 구조 원칙) ----
// 같은 글의 줄이 여럿일 때 "글로 대상을 찾다가" 다른 줄을 지우거나 옮기는 버그가 1~3차 리뷰 대부분이었다.
// 그래서 줄을 찾는 모든 경로(체크·고치기·보관·이동·되돌리기·응답 유실 판정·저널·Inbox)가 locate 하나만 쓴다.
// 규칙: 후보가 정확히 하나로 정해질 때만 그 줄. 조금이라도 애매하면 추측하지 않고 gone
//      ("목록이 바뀌었어요 · 새로 불러오기") — 유실·오삭제보다 멈춤이 낫다.
// 대상(지문) = 줄 원문 raw + 섹션 section + 부모 줄 parentRaw + 같은 글 중 순번 ordinal / 개수 sameCount
//            + 앞 줄 prev + 블록 다음 줄 next + 하위 줄 kids. parseSections·parseInbox·lineFp가 만든다.
const locateGone = () => {
  const msg = '목록이 바뀌었어요. 새로 불러온 뒤 다시 해 주세요';
  return Object.assign(new Error(msg), { userMessage: msg, gone: true });
};
// Inbox 줄 비교 기준(앞 기호 뒤 공백 차이는 같은 줄로)
function inboxKey(l) {
  if (l == null) return null;
  return /^-\s+\S/.test(l) ? '- ' + l.replace(/^-\s+/, '').trim() : l;
}
const INBOX_LOC = { key: inboxKey, block: false };
// idx 줄 블록(하위 포함)의 마지막 줄
function blockEndAt(lines, idx, block = true) {
  if (!block) return idx;
  const ind = (l) => (l.match(/^(\s*)/)?.[0] || '').length;
  const base = ind(lines[idx] || '');
  let end = idx;
  for (let i = idx + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    if (lines[i].trim() === '') continue;
    if (ind(lines[i]) > base) end = i; else break;
  }
  return end;
}
// 앞 줄·블록 다음 줄·하위 줄(비교 기준 key로 정규화)
function lineSig(lines, idx, { key = normLine, block = true } = {}) {
  const end = blockEndAt(lines, idx, block);
  return {
    prev: idx > 0 ? key(lines[idx - 1]) : null,
    next: end + 1 < lines.length ? key(lines[end + 1]) : null,
    kids: lines.slice(idx + 1, end + 1).filter((l) => l.trim()).map(key).join('\n'),
  };
}
// 지금 lines의 idx 줄 지문(되돌리기·저널 기록용)
function lineFp(lines, idx, { key = normLine, block = true } = {}) {
  const want = key(lines[idx]);
  const same = [];
  lines.forEach((l, i) => { if (key(l) === want) same.push(i); });
  const ctx = lineContext(lines, idx);
  return {
    raw: lines[idx], lineIndex: idx, section: ctx.section, parentRaw: ctx.parent,
    ordinal: same.indexOf(idx), sameCount: same.length, ...lineSig(lines, idx, { key, block }),
  };
}
function locate(lines, t, { exclude = null, key = normLine, block = true } = {}) {
  const want = t && t.raw != null ? key(t.raw) : null;
  if (want == null) throw locateGone();
  const all = [];
  lines.forEach((l, i) => { if (key(l) === want) all.push(i); });
  const cands = all.filter((i) => !(exclude && exclude.has(i)));
  if (!cands.length) throw locateGone();
  // ① 같은 글이 기록 때도 지금도 하나뿐 → 그 줄(섹션을 옮겼어도 같은 항목)
  if (all.length === 1 && !(t.sameCount > 1)) return cands[0];
  // 맥락을 남기지 않은 옛 기록은 하나뿐일 때만
  if (t.section === undefined) throw locateGone();
  const norm = (l) => (l == null ? null : key(l));
  const ctx = cands.filter((i) => {
    const c = lineContext(lines, i);
    if (c.section !== t.section) return false;
    return t.parentRaw === undefined || norm(c.parent) === norm(t.parentRaw);
  });
  // ② 같은 글 개수가 그대로이고 순번 자리의 줄이 섹션·부모도 같음
  if (t.sameCount === all.length && t.ordinal >= 0 && ctx.includes(all[t.ordinal])) return all[t.ordinal];
  // ③ 개수가 바뀜(R2·S4): 앞 줄·다음 줄·하위 줄이 모두 기록과 같은 줄이 정확히 하나일 때만.
  //    기록한 앞뒤 줄이 같은 글(같은 글이 붙어 있음)이면 구분할 근거가 없으니 멈춘다
  if (t.prev === undefined || t.prev === want || t.next === want) throw locateGone();
  const strong = ctx.filter((i) => {
    const g = lineSig(lines, i, { key, block });
    return g.prev === t.prev && g.next === t.next && (t.kids === undefined || g.kids === t.kids);
  });
  if (strong.length === 1) return strong[0];
  throw locateGone();
}
// active.md 줄 찾기(예전 이름 유지 — 내부는 locate)
// exclude: 이미 다른 대상으로 잡힌 줄(Q1, 여러 대상을 한 번에 찾을 때)
function resolveLineIndex(item, lines, { exclude = null } = {}) {
  const ls = lines || state.content.split('\n');
  if (item.raw == null) return item.lineIndex;
  return locate(ls, item, { exclude });
}

// 헤더·빈 줄은 항목 조작 대상이 될 수 없다. 마지막 안전장치.
function assertItemLine(lines, idx) {
  const l = lines[idx];
  if (l == null || /^##\s/.test(l) || l.trim() === '') {
    const msg = '항목을 찾지 못했어요. 새로 불러온 뒤 다시 해 주세요';
    throw Object.assign(new Error(msg), { userMessage: msg, gone: true });
  }
}

// active.md 변경의 직렬화는 activeStore(F3)가 맡는다. 연산은 저장 직전 원문 줄로 위치를 다시 찾는다.

function toggleAt(lineIndex, checked, content = state.content) {
  const lines = content.split('\n');
  assertItemLine(lines, lineIndex);
  const line = lines[lineIndex];
  lines[lineIndex] = checked
    ? line.replace('- [ ]', '- [x]')
    : line.replace('- [x]', '- [ ]');
  return lines.join('\n');
}

function appendToSection(key, text, content = state.content, info = null) {
  text = String(text).replace(/\s*[\r\n]+\s*/g, ' ').trim(); // 한 줄 보장(R4 방어 — md 형식이 깨지지 않게)
  const lines = content.split('\n');
  const at = insertIntoSection(lines, key, [`- [ ] ${text}`]);
  if (info) info.at = at;
  return lines.join('\n');
}

function editLine(lineIndex, newText, content = state.content) {
  const lines = content.split('\n');
  const line = lines[lineIndex];
  const m = line.match(/^(\s*- \[[ xX]\] )(.*)$/);
  if (!m) throw new Error('not a task line');
  lines[lineIndex] = m[1] + newText;
  return lines.join('\n');
}

function deleteAt(lineIndex, content = state.content) {
  const lines = content.split('\n');
  assertItemLine(lines, lineIndex);
  const base = lines[lineIndex];
  const baseIndent = (base.match(/^(\s*)/)?.[0] || '').length;
  let removeUntil = lineIndex;
  for (let i = lineIndex + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    const ind = (lines[i].match(/^(\s*)/)?.[0] || '').length;
    if (lines[i].trim() === '') continue;
    if (ind > baseIndent) removeUntil = i;
    else break;
  }
  lines.splice(lineIndex, removeUntil - lineIndex + 1);
  return lines.join('\n');
}

function extractBlock(lines, lineIndex) {
  assertItemLine(lines, lineIndex);
  const baseIndent = (lines[lineIndex].match(/^(\s*)/)?.[0] || '').length;
  let endIdx = lineIndex;
  for (let i = lineIndex + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    const ind = (lines[i].match(/^(\s*)/)?.[0] || '').length;
    if (lines[i].trim() === '') continue;
    if (ind > baseIndent) endIdx = i;
    else break;
  }
  return { start: lineIndex, end: endIdx };
}

function getLineIndent(line) {
  const m = line.match(/^(\s*)/);
  return Math.floor((m?.[0]?.length || 0) / 2);
}

function adjustBlockIndent(block, deltaIndent) {
  if (deltaIndent === 0) return block;
  return block.map((line) => {
    if (line.trim() === '') return line;
    const m = line.match(/^(\s*)(.*)$/);
    const curIndent = Math.floor(m[1].length / 2);
    const newIndent = Math.max(0, curIndent + deltaIndent);
    return '  '.repeat(newIndent) + m[2];
  });
}

// 부모 줄(parentIdx)의 마지막 하위 항목 바로 다음 위치
// 부모의 마지막 하위(비어 있지 않은 줄) 바로 다음 — 섹션 끝 빈 줄 뒤에 넣지 않는다(B-6:
// 부모와 하위 사이에 빈 줄이 끼고 다음 섹션 제목 앞 빈 줄이 사라졌다)
function childInsertIndex(lines, parentIdx) {
  const parentIndent = getLineIndent(lines[parentIdx]);
  let last = parentIdx;
  for (let i = parentIdx + 1; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('## ')) break;
    if (l.trim() === '') continue;
    if (getLineIndent(l) <= parentIndent) break;
    last = i;
  }
  return last + 1;
}

// 보관함 항목을 active.md 줄 배열에 되돌린다.
// 하위 할 일(entry.parent 있음)은 같은 섹션에 부모가 있으면 그 부모의 마지막 하위로,
// 없으면 상위 항목으로 섹션 끝에 넣는다(A6). 들여쓴 채 섹션 끝에 넣으면 엉뚱한 부모에 붙기 때문.
// 반환: 넣은 블록 첫 줄 번호(없으면 -1)
function restoreBlockInto(lines, entry) {
  const block = entry.block || [];
  if (!block.length) return -1;
  if (entry.parent) {
    const headerIdx = ensureSectionHeader(lines, entry.priority);
    for (let i = headerIdx + 1; i < lines.length && !lines[i].startsWith('## '); i++) {
      const m = lines[i].match(/^(\s*)- \[[ xX]\] (.*)$/);
      if (m && m[2] === entry.parent) {
        const at = childInsertIndex(lines, i);
        const indented = adjustBlockIndent(block, getLineIndent(lines[i]) + 1 - getLineIndent(block[0]));
        lines.splice(at, 0, ...indented);
        return at;
      }
    }
  }
  return insertIntoSection(lines, entry.priority, adjustBlockIndent(block, -getLineIndent(block[0])));
}

// info(선택): { at } = 옮긴 블록 첫 줄의 새 번호, { from } = 블록을 뺀 직후 줄 배열·원래 시작 번호(되돌리기 기록용)
function moveLineToSection(lineIndex, targetKey, content = state.content, info = null) {
  const lines = content.split('\n');
  const { start, end } = extractBlock(lines, lineIndex);
  const block = lines.splice(start, end - start + 1);
  if (info) info.from = { mid: [...lines], start, indent: getLineIndent(block[0]) };
  const at = insertIntoSection(lines, targetKey, block);
  if (info) info.at = at;
  return lines.join('\n');
}

// Move a task block.
// target: { sectionKey, beforeLine?, intoLine?, indent? }
//   - beforeLine: insert before this line at the target line's indent (sibling)
//   - intoLine: insert as the last child of this line (indent = target + 1)
//   - neither: append at end of section as a main task (indent 0)
//   - indent: optional explicit depth override (used for the depth-ambiguous gap below a
//     last child, where the next line's indent alone can't express "stay as the last child")
function moveLineToPosition(srcLineIndex, target, content = state.content, info = null) {
  const lines = content.split('\n');
  const { start, end } = extractBlock(lines, srcLineIndex);
  const blockLen = end - start + 1;

  if (target.beforeLine != null && target.beforeLine > start && target.beforeLine <= end) {
    throw new Error('invalid drop: before-target is inside source block');
  }
  if (target.intoLine != null && target.intoLine >= start && target.intoLine <= end) {
    throw new Error('invalid drop: cannot make self/descendant into a child');
  }

  const srcBaseIndent = getLineIndent(lines[start]);
  let block = lines.splice(start, blockLen);
  if (info) info.from = { mid: [...lines], start, indent: srcBaseIndent };

  let targetIndent;
  if (target.intoLine != null) {
    let intoIdx = target.intoLine;
    if (intoIdx > start) intoIdx -= blockLen;
    targetIndent = getLineIndent(lines[intoIdx]) + 1;
  } else if (target.beforeLine != null) {
    let beforeIdx = target.beforeLine;
    if (beforeIdx > start) beforeIdx -= blockLen;
    targetIndent = getLineIndent(lines[beforeIdx]);
  } else {
    targetIndent = 0;
  }
  if (target.indent != null && target.intoLine == null) targetIndent = target.indent;
  block = adjustBlockIndent(block, targetIndent - srcBaseIndent);

  if (target.intoLine != null) {
    let parentIdx = target.intoLine;
    if (parentIdx > start) parentIdx -= blockLen;
    const at = childInsertIndex(lines, parentIdx);
    lines.splice(at, 0, ...block);
    if (info) info.at = at;
    return lines.join('\n');
  }

  if (target.beforeLine != null) {
    let insertAt = target.beforeLine;
    if (insertAt > start) insertAt -= blockLen;
    lines.splice(insertAt, 0, ...block);
    if (info) info.at = insertAt;
    return lines.join('\n');
  }

  const at = insertIntoSection(lines, target.sectionKey, block);
  if (info) info.at = at;
  return lines.join('\n');
}

  const bar = $('#inbox-bar');
  if (!bar) return;

function renderInbox() {
  const app = $('#app');
  const count = state.inboxItems.length;
  app.innerHTML = `
    ${renderShell('inbox')}

function renderInboxItem(item) {
  const div = document.createElement('div');
  div.className = 'inbox-item' + (selectedInbox.has(item.key) ? ' selected' : '');
  div.dataset.key = item.key;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'inbox-cb';
  cb.checked = selectedInbox.has(item.key);
  cb.setAttribute('aria-label', `선택: ${item.text}`);
  cb.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleInboxSelect(item.key, div, cb);
  });

  const text = document.createElement('div');
  text.className = 'inbox-text';
  text.textContent = item.text;

  const actions = document.createElement('div');
  actions.className = 'inbox-actions';
  // 버튼 이름에 항목 글을 넣어 스크린리더에서 어느 항목인지 알 수 있게(R17)
  const t = escAttr(item.text);
  actions.innerHTML = `
    <button class="pri-mini h" title="High로 보내기" aria-label="High로 보내기: ${t}">🍅</button>
    <button class="pri-mini m" title="Medium으로 보내기" aria-label="Medium으로 보내기: ${t}">🍋</button>
    <button class="pri-mini l" title="Low로 보내기" aria-label="Low로 보내기: ${t}">🥝</button>
    <button class="row-btn" title="보관함으로 옮기기" aria-label="보관함으로 옮기기: ${t}">📥</button>

  actions.querySelectorAll('.pri-mini').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); onMoveToActive(item, btn.classList.contains('h') ? 'high' : btn.classList.contains('m') ? 'medium' : 'low'); });
  });
  actions.querySelector('.row-btn').addEventListener('click', (e) => { e.stopPropagation(); onDeleteFromInbox(item); });

  div.addEventListener('click', () => toggleInboxSelect(item.key, div, cb));
  div.appendChild(cb);
  div.appendChild(text);
  div.appendChild(actions);
  return div;
}

function toggleInboxSelect(key, div, cb) {
  if (selectedInbox.has(key)) {
    selectedInbox.delete(key);
    div.classList.remove('selected');
    cb.checked = false;
  } else {
    selectedInbox.add(key);
    div.classList.add('selected');
    cb.checked = true;
  }
  updateInboxBar();
}

function renderArchive() {
  const app = $('#app');
  const items = [...state.archiveItems].sort((a, b) => (b.deletedAt || '').localeCompare(a.deletedAt || ''));
  app.innerHTML = `
    ${renderShell('archive')}

  bindTabEvents();
