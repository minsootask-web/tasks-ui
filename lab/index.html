<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tako">
<title>Tako Lab</title>
<link rel="manifest" href="../manifest.json">
<!-- 파비콘(탭): 투명 배경 SVG + PNG 폴백 -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
<!-- 홈 화면/PWA 아이콘: 어두운 배경(타일에 얹히므로 불투명) -->
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root {
    /* Notion-inspired light palette */
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f7f6f3;
    --surface-3: #efeeec;
    --border: rgba(55,53,47,0.09);
    --border-strong: rgba(55,53,47,0.16);
    --text: #37352f;
    --muted: rgba(55,53,47,0.70); /* .55는 흰 바탕 3.2:1 → .70은 4.8:1(카드 회색 바탕 4.6:1), AA 통과 */
    --faint: rgba(55,53,47,0.4);
    --accent: #DF4438;
    --accent-fg: #ffffff;
    --accent-soft: rgba(223,68,56,0.11);
    /* 작은 글자·배지·토스트 버튼용 진한 빨강(B14): 흰 글자/흰 바탕 모두 5.5:1. 큰 버튼·로고·체크는 --accent 그대로 */
    --accent-strong: #C23328;
    --accent-text: #C23328; /* 바탕 위 빨간 글자(링크·실패 표시) */
    --high: #e03e3e;
    --med: #d9730d;
    --low: #448361;
    --danger: #e03e3e;
    --hover: rgba(55,53,47,0.055);
    --shadow: 0 1px 3px rgba(15,15,15,0.06), 0 6px 18px rgba(15,15,15,0.07);
    --shadow-menu: rgba(15,15,15,0.05) 0 0 0 1px, rgba(15,15,15,0.08) 0 3px 6px, rgba(15,15,15,0.14) 0 9px 24px;
    --radius: 10px;
    --radius-sm: 6px;
    --memo-bg: #fdea9c;
    --memo-bg-edit: #fbdf74;
    --memo-fg: #3a3016;
    /* 모션 기준값(디자이너 공통 기준) — 반응 120ms, 전환 200ms, 길게 누르기 예고 400ms */
    --dur-fast: 120ms;
    --dur: 200ms;
    --ease: cubic-bezier(.2,.8,.2,1);
    --dur-press: 400ms;
    --dur-flash: 600ms;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  /* Notion-inspired dark palette.
     시스템 다크(수동 라이트로 덮어쓰지 않은 경우) + 수동 다크(data-theme="dark") 공통 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --surface: #202020;
      --surface-2: #252525;
      --surface-3: #2d2d2d;
      --border: rgba(255,255,255,0.094);
      --border-strong: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.82);
      --muted: rgba(255,255,255,0.46);
      --faint: rgba(255,255,255,0.34);
      --accent: #DF4438;
      --accent-fg: #ffffff;
      --accent-soft: rgba(223,68,56,0.24);
      --accent-text: #ff7369; /* 어두운 바탕 위 빨간 글자 6.6:1 */
      --high: #ff7369;
      --med: #ffa344;
      --low: #4dab9a;
      --danger: #ff7369;
      --hover: rgba(255,255,255,0.055);
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
      --shadow-menu: rgba(15,15,15,0.1) 0 0 0 1px, rgba(15,15,15,0.2) 0 3px 6px, rgba(15,15,15,0.4) 0 9px 24px;
      --memo-bg: #f5d45e;
      --memo-bg-edit: #f8e187;
      --memo-fg: #3a3016;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919;
    --surface: #202020;
    --surface-2: #252525;
    --surface-3: #2d2d2d;
    --border: rgba(255,255,255,0.094);
    --border-strong: rgba(255,255,255,0.14);
    --text: rgba(255,255,255,0.82);
    --muted: rgba(255,255,255,0.46);
    --faint: rgba(255,255,255,0.34);
    --accent: #DF4438;
    --accent-fg: #ffffff;
    --accent-soft: rgba(223,68,56,0.24);
    --accent-text: #ff7369; /* 어두운 바탕 위 빨간 글자 6.6:1 */
    --high: #ff7369;
    --med: #ffa344;
    --low: #4dab9a;
    --danger: #ff7369;
    --hover: rgba(255,255,255,0.055);
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.45);
    --shadow-menu: rgba(15,15,15,0.1) 0 0 0 1px, rgba(15,15,15,0.2) 0 3px 6px, rgba(15,15,15,0.4) 0 9px 24px;
    --memo-bg: #f5d45e;
    --memo-bg-edit: #f8e187;
    --memo-fg: #3a3016;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); margin: 0; }
  body {
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 108px);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 24px;
  }
  .title-row h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .title-row h1.brand { display: inline-flex; align-items: center; gap: 9px; }
  .title-row h1.brand span { font-weight: 900; text-transform: lowercase; }
  .brand-logo { width: 32px; height: 32px; flex-shrink: 0; display: block; }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-row { min-width: 0; flex: 1; }
  .icon-btn {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 1px solid transparent; color: var(--muted);
    width: 38px; height: 38px; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; transition: all var(--dur-fast);
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn.sort-active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  .header-actions { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
  .menu-wrap { position: relative; display: inline-flex; }
  .menu {
    position: absolute; top: 46px; right: 0; z-index: 50;
    min-width: 220px; padding: 6px;
    background: var(--surface);
    border-radius: var(--radius); box-shadow: var(--shadow-menu);
    display: none; flex-direction: column; gap: 1px;
  }
  .menu.show { display: flex; }
  .menu-item {
    appearance: none; -webkit-appearance: none; background: none; border: none;
    color: var(--text); text-align: left; width: 100%;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item:disabled { opacity: 0.4; cursor: default; }
  .menu-item:disabled:hover { background: none; }
  .menu-item.danger { color: var(--danger); }
  .menu-item .mi-ic { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .menu-item .mi-count { margin-left: auto; color: var(--accent-text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }

  .section { margin-bottom: 22px; }
  .section-title {
    font-size: 13px; font-weight: 600; letter-spacing: 0;
    color: var(--text); margin: 0 0 8px 0;
    display: flex; align-items: center; gap: 8px; padding-left: 4px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .section-title .sec-ic { font-size: 14px; line-height: 1; }
  .pri-high .dot { background: var(--high); }
  .pri-med  .dot { background: var(--med); }
  .pri-low  .dot { background: var(--low); }
  .count { color: var(--muted); margin-left: auto; font-weight: 500; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px; overflow: hidden;
  }
  .task {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px; border-radius: var(--radius-sm); position: relative; min-height: 44px;
    transition: background var(--dur-fast);
  }
  .task:hover { background: var(--hover); }
  .task input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; margin: 1px 0 0 0;
    border: 0; border-radius: 50%;
    background: transparent no-repeat center / contain; cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='10.5' stroke='%23868686'/%3E%3C/svg%3E");
    flex-shrink: 0; transition: opacity var(--dur-fast); position: relative;
  }
  .task input[type="checkbox"]:hover { opacity: 0.7; }
  .task input[type="checkbox"]:checked {
    background-image: url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23DF4438'/%3E%3Cpath d='M8 11.5L10.9474 15L16 9' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  }
  .task input[type="checkbox"]:checked:hover { opacity: 0.85; }
  /* 체크 순간 뿅! 튀는 마이크로 인터랙션 — 렌더링된 완료 항목이 아닌,
     사용자가 직접 클릭한 순간에만 .pop 클래스로 발동한다. */
  .task input[type="checkbox"].pop {
    animation: cb-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes cb-pop {
    0% { transform: scale(0.7); }
    55% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .task-toggle {
    flex-shrink: 0; width: 18px; height: 22px; margin-top: 0; padding: 0;
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; transition: color var(--dur-fast), background var(--dur-fast);
  }
  .task-toggle:hover { color: var(--text); background: var(--surface-2); }
  .task-toggle.leaf { visibility: hidden; cursor: default; }
  .child-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 5px; margin-left: 6px;
    border-radius: 8px; background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 600; vertical-align: middle;
  }
  .task-text {
    flex: 1; cursor: text; min-width: 0;
    word-break: break-word; padding: 1px 0;
  }
  .task-text:focus { outline: none; }
  .task-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .task input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .task-link { color: var(--accent-text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; word-break: break-all; }
  .task.done .task-link { color: inherit; }
  .task.done .task-text { color: var(--muted); text-decoration: line-through; }
  .meta-inline { color: var(--muted); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .task-actions {
    display: flex; gap: 2px; opacity: 0;
    transition: opacity var(--dur-fast);
  }
  .task:hover .task-actions, .task.menu-open .task-actions, .task:focus-within .task-actions { opacity: 1; }
  /* 모바일(hover 없음): 행에는 체크·글·펼침만. ⋮⋮·×는 없음 — 보관은 편집 시트, 순서는 길게 눌러 옮기기(B2) */
  @media (hover: none) {
    .task-actions { display: none; }
    .task { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: background var(--dur-fast), transform var(--dur-press) ease-out; }
  }
  .row-btn {
    appearance: none; -webkit-appearance: none;
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
    width: 32px; height: 32px; border-radius: 6px; position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all var(--dur-fast);
  }
  .row-btn:hover { background: var(--surface-2); color: var(--text); }
  .row-btn.danger:hover { background: var(--danger); color: white; }

  /* 완료 접기 행(B3) — 높이 36px, 체크박스 줄에 맞춘 들여쓰기 */
  .done-fold {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    width: 100%; min-height: 36px; padding: 0 10px 0 38px; text-align: left; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 4px;
  }
  .done-fold:hover { background: var(--hover); color: var(--text); }
  .done-fold:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .done-fold .done-n { display: inline-block; font-variant-numeric: tabular-nums; }
  .done-fold .done-n.bump { animation: done-bump var(--dur-fast) ease-out; }
  @keyframes done-bump { 50% { transform: scale(1.15); } }
  .task.leaving { opacity: 0; max-height: 0; min-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden;
    transition: opacity var(--dur) var(--ease), max-height var(--dur) var(--ease), padding 200ms; }
  .bullet { padding: 4px 10px 4px 40px; color: var(--muted); font-size: 13px; }
  .indent-1 { padding-left: 36px; }
  .indent-2 { padding-left: 60px; }
  .indent-3 { padding-left: 84px; }
  .empty {
    padding: 12px 10px; color: var(--muted); font-size: 13px;
  }


  /* 플로팅 컴포저 (Task 탭) — 메신저/프롬프트 입력창 스타일 */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 12px 16px calc(var(--safe-bottom) + 14px);
    /* 내용이 입력창 아래로 자연스럽게 페이드되며 스크롤되도록 */
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    pointer-events: none;
  }
  .composer[hidden] { display: none; }
  .composer-inner {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 26px;
    padding: 5px 5px 5px 6px;
    box-shadow: 0 6px 20px rgba(15,15,15,0.12);
    pointer-events: auto;
  }
  .composer-inner:focus-within { border-color: var(--accent); }
  .composer-pri {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: var(--surface-2); cursor: pointer;
    font-size: 19px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast), transform var(--dur-fast);
  }
  .composer-pri:hover { background: var(--hover); }
  .composer-pri:active { transform: scale(0.9); }
  .composer-input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-size: 15px; color: var(--text); font-family: inherit; line-height: 20px;
    padding: 9px 4px; resize: none; height: 38px; max-height: 98px; /* 메모는 최대 4줄 */
    overflow-y: hidden; display: block; box-sizing: border-box;
  }
  .composer-inner { align-items: flex-end; }
  .composer.mode-inbox .composer-pri, .composer.mode-memo .composer-pri { display: none; }
  .composer.mode-inbox .composer-inner, .composer.mode-memo .composer-inner { padding-left: 14px; }
  body.no-composer { padding-bottom: calc(var(--safe-bottom) + 32px); }
  .memo.fade-in { animation: memo-in var(--dur) var(--ease); }
  @keyframes memo-in { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .memo.fade-in { animation: none; } }
  .composer-input::placeholder { color: var(--muted); }
  .composer-send {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: 0; background: var(--accent); color: var(--accent-fg);
    cursor: pointer; font-size: 24px; font-weight: 300; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast), transform var(--dur-fast);
  }
  .composer-send:active { transform: scale(0.9); }
  .composer-send:disabled { opacity: 0.35; cursor: default; }

  /* Modal / Bottom sheet */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur) var(--ease); z-index: 20;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 16px 16px 0 0;
    padding: 20px 20px calc(var(--safe-bottom) + 20px);
    transform: translateY(100%); transition: transform var(--dur) var(--ease);
    z-index: 21; max-width: 560px; margin: 0 auto;
  }
  .sheet.show { transform: translateY(0); }
  .sheet h2 { font-size: 17px; margin: 0 0 14px 0; font-weight: 600; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input[type="text"], .field input[type="password"], .field textarea {
    width: 100%; padding: 10px 12px; font-size: 15px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; resize: vertical;
  }
  /* 포커스는 메인 컬러 대신 중립적인 진한 보더로 은은하게 표시 */
  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent;
    background: var(--surface);
  }
  .pri-picker { display: flex; gap: 8px; }
  .pri-pill {
    flex: 1; padding: 10px; border-radius: 8px; cursor: pointer;
    background: var(--surface-2); border: 1.5px solid transparent;
    text-align: center; font-size: 14px; font-weight: 500;
    transition: all var(--dur-fast); user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pri-pill:hover { background: var(--hover); }
  .pri-pill.selected { border-color: var(--accent); background: var(--surface); }
  .pri-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pri-pill .dot { width: 10px; height: 10px; }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-err { color: var(--danger); font-size: 13px; margin-top: 12px; }
  .text-btn {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; color: var(--muted); min-height: 44px; padding: 0 2px; text-align: left;
  }
  .text-btn:hover { color: var(--text); }
  .text-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .sub-field[hidden], .sub-input[hidden] { display: none; }
  .sub-list { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
  .sub-list li { padding: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub-list li.done { text-decoration: line-through; }
  .sub-field .sub-input {
    width: 100%; padding: 8px 10px; font-size: 14px; margin-top: 4px;

  }
  .sheet-err[hidden] { display: none; }
  .actions .btn { flex: 1; } /* 취소/저장 버튼 가로폭 동일 */

  .actions .sheet-archive[hidden] { display: none; }
  .btn {
    appearance: none; -webkit-appearance: none;

  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }

  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }

  /* Setup screen */
  .setup {
    max-width: 480px; margin: 80px auto; padding: 24px;

  }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 90px); left: 50%;

    background: var(--text); color: var(--bg);
    padding: 9px 12px 9px 16px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); pointer-events: none;
    z-index: 50; width: max-content; max-width: calc(100vw - 32px);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .toast.show { opacity: 0.94; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .toast-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast .toast-action {
    pointer-events: auto; flex-shrink: 0; cursor: pointer;
    appearance: none; -webkit-appearance: none; border: none;
    background: var(--accent-strong); color: var(--accent-fg);

    position: relative; margin: -6px -4px -6px 0;
  }
  /* 보이는 높이 32px, 누르는 영역은 위아래로 넓혀 44px */
  .toast .toast-action::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
  .toast .toast-action:active { transform: scale(0.96); }

  /* Skeleton */
  .skeleton {
    height: 16px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
    border-radius: 4px; margin: 8px 0;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Sync indicator */
  /* 저장 표시(B8): 헤더 오른쪽 고정 칸. 평소엔 비어 있고(자리만 차지 → 화면이 밀리지 않음),
     0.6초 넘게 걸리면 작게 "저장 중", 실패하면 해결될 때까지 빨간 알약 */
  .sync-slot { display: inline-flex; align-items: center; justify-content: flex-end; min-width: 0; }
  .sync-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted); white-space: nowrap;
    padding: 3px 8px; border-radius: 999px; border: 0; background: transparent; font-family: inherit;
    opacity: 0; transition: opacity var(--dur) ease-out; pointer-events: none;
  }
  .sync-pill.show { opacity: 1; }
  .sync-pill .dot { width: 6px; height: 6px; display: none; }
  .sync-pill.saving .dot { display: inline-block; background: var(--med); animation: pulse 1s infinite; }
  .sync-pill.error {
    background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600;
    cursor: pointer; pointer-events: auto; padding: 5px 10px; position: relative;
  }
  .sync-pill.error::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; bottom: -8px; }
  .sync-pill.error:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sync-pill.offline { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 10px; }
  @media (prefers-reduced-motion: reduce) { .sync-pill.saving .dot { animation: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 600px) {
    .icon-btn { width: 44px; height: 44px; }
  }

  /* Tabs */
  /* 탭(B12): 위쪽 유지, 높이 44px, 스크롤해도 화면 위에 붙어 있음 */
  .tabs {
    display: flex; gap: 4px;
    background: var(--surface-2); border-radius: 10px; padding: 3px;
    margin-bottom: 20px;
    position: sticky; top: calc(var(--safe-top) + 6px); z-index: 12;
    box-shadow: 0 0 0 6px var(--bg); /* 붙어 있을 때 뒤 글자가 비치지 않게 */
  }
  .tab {
    flex: 1; appearance: none; -webkit-appearance: none;
    background: transparent; border: 0; color: var(--muted);
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; min-height: 38px;
    transition: all var(--dur-fast); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(15,15,15,0.06); }
  .tab:not(.active):hover { color: var(--text); }
  .badge {
    background: var(--accent-strong); color: var(--accent-fg);
    font-size: 11px; font-weight: 700; min-width: 18px; height: 18px;
    border-radius: 999px; padding: 0 5px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* Inbox */
  .inbox-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px; border-radius: 8px; min-height: 44px;
    transition: background var(--dur-fast); cursor: pointer;
  }
  .inbox-item:hover { background: var(--hover); }
  .inbox-item.selected { background: var(--accent-soft); }
  .inbox-item.flash, .task.flash, .memo.flash { animation: row-flash var(--dur-flash) ease-out; }
  @keyframes row-flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .inbox-item.flash, .task.flash, .memo.flash { animation-duration: 120ms; } }
  .inbox-cb {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; flex-shrink: 0; margin: 0;
    border: 1.5px solid var(--border-strong); border-radius: 4px;
    background: transparent; cursor: pointer;
    transition: all var(--dur-fast); position: relative;
  }
  .inbox-cb:checked { background: var(--accent); border-color: var(--accent); }
  .inbox-cb:checked::after {
    content: ""; position: absolute; left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid var(--accent-fg); border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .inbox-text { flex: 1; word-break: break-word; font-size: 15px; }
  .inbox-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .pri-mini {
    appearance: none; -webkit-appearance: none;
    border: 1.5px solid var(--border); background: var(--surface-2); color: var(--muted);
    font-size: 16px; line-height: 1; width: 28px; height: 28px; border-radius: 6px; padding: 0;
    cursor: pointer; transition: all var(--dur-fast); position: relative;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pri-mini:hover { border-color: var(--accent); color: var(--text); background: var(--surface); }
  .pri-mini.h:hover { border-color: var(--high); }
  .pri-mini.m:hover { border-color: var(--med); }
  .pri-mini.l:hover { border-color: var(--low); }

  /* 터치 타깃 확대 — 시각 크기는 유지하고 히트 영역을 최소 44px 높이로 넓힌다.
     행이 세로로 쌓이므로 세로 확장은 인접 버튼과 겹치지 않아 안전하다. */
  @media (pointer: coarse) {
    .row-btn::before, .pri-mini::before, .inbox-cb::before {
      content: ""; position: absolute; top: 50%; left: 50%;
      width: 100%; min-width: 32px; height: 44px;
      transform: translate(-50%, -50%);
    }
  }
  /* 체크 누르는 영역(B14): 보이는 원은 20px 그대로, 감싼 label이 44×44px.
     오른쪽은 글 영역과 4px 떨어지게(글자를 누르면 편집, 원 근처를 누르면 체크 — 오조작 감소).
     input의 ::before는 Safari에서 안 그려지므로 label로 넓힌다 */
  .cb-hit {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;

  .task-toggle { position: relative; }
  .task-toggle:not(.leaf)::before {
    content: ""; position: absolute; top: 50%; right: 0; width: 44px; height: 44px; transform: translateY(-50%);
  }

  /* Bulk action bar */
  .inbox-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 16px calc(var(--safe-bottom) + 10px);
    display: flex; align-items: center; gap: 6px;
    z-index: 10; transform: translateY(100%); transition: transform var(--dur) var(--ease);
    max-width: 720px; margin: 0 auto;
  }
  .inbox-bar.show { transform: translateY(0); }
  .inbox-bar-label { font-size: 13px; color: var(--muted); flex: 1; white-space: nowrap; }
  .bar-btn {
    appearance: none; -webkit-appearance: none;
    border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text);
    font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: 8px;
    cursor: pointer; transition: all var(--dur-fast); font-family: inherit; white-space: nowrap;
  }
  .bar-btn.h:hover { border-color: var(--high); color: var(--high); }
  .bar-btn.m:hover { border-color: var(--med); color: var(--med); }
  .bar-btn.l:hover { border-color: var(--low); color: var(--low); }
  .bar-btn.h, .bar-btn.m, .bar-btn.l { font-size: 16px; line-height: 1; padding: 5px 10px; }
  .bar-btn.danger { border-color: transparent; }
  .bar-btn.danger:hover { background: var(--danger); border-color: var(--danger); color: white; }
  .bar-btn.ghost { background: transparent; border-color: transparent; color: var(--muted); font-weight: 400; }
  .bar-btn.ghost:hover { background: var(--surface-2); color: var(--text); }

  /* Drag & drop */
  .drag-handle {
    cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none;
    font-size: 16px; line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; }
  .task.dragging { opacity: 0.3; }
  .drag-ghost {
    position: fixed; pointer-events: none; z-index: 100;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    opacity: 0.92; transition: none;
  }
  .drop-indicator {
    height: 2px; background: var(--accent);
    margin: 0 8px; border-radius: 1px;
    pointer-events: none;
  }
  .section.drop-active .card {
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
  }
  .task.drop-into {
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
    border-radius: 8px;
  }

  /* Archive */
  .archive-parent { margin-left: 0; font-size: 12px; }
  .archive-when { flex-shrink: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .archive-badge {
    display: inline-flex; align-items: center; justify-content: center;

    font-size: 13px; line-height: 1;
  }

  /* Memo board (masonry / column-based) */
  .memo-board {
    --cols: 3;
    --gap: 10px;
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: var(--gap);

  }
  .memo-col {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-height: 60px;
  }
  .memo {
    background: var(--memo-bg);
    color: var(--memo-fg);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px; line-height: 1.5;
    box-shadow: 0 1px 2px rgba(15,15,15,0.06), 0 2px 8px rgba(15,15,15,0.05);
    cursor: grab;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

    transition: box-shadow var(--dur-fast), transform var(--dur-press) ease-out;

  .memo.pressing, .task.pressing { transform: scale(0.98); }
  @media (prefers-reduced-motion: reduce) { .memo.pressing, .task.pressing { transform: none; } }
  .memo:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.18), 0 8px 16px rgba(0,0,0,0.1); }
  .memo.dragging { opacity: 0.3; }
  .memo.editing {

  }
  .memo .memo-text {
    min-height: 36px;
    outline: none;
  }
  .memo .memo-del {
    position: absolute; top: 2px; right: 2px;

    display: none; align-items: center; justify-content: center;
    padding: 0;
  }
  /* 메모 ×는 편집 중일 때만(B13). 글과 겹치지 않게 오른쪽 여백 28px, 누르는 영역 44px */
  .memo.editing { padding-right: 28px; }
  .memo.editing .memo-del { display: inline-flex; top: 4px; right: 4px; }
  .memo .memo-del::before { content: ""; position: absolute; inset: -12px; }
  .memo-ghost {
    position: fixed; pointer-events: none; z-index: 100;

  @media (max-width: 600px) {

  }
</style>
<script>
  // 저장된 테마를 렌더 전에 적용(깜빡임 방지). 'light' | 'dark' | 없음(시스템)
  (function () {

      var t = localStorage.getItem('tasks_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);

<body>

<div class="wrap" id="app"></div>


<!-- 하단 입력창 — Task·Inbox·Memo 공용(B5). Archive에는 없음 -->

      <div class="pri-pill pri-med selected" data-pri="medium" role="radio" aria-checked="true" tabindex="0"><span class="pri-ic" aria-hidden="true">🍋</span>Medium</div>

    </div>

<!-- UX 실험실: 가짜 GitHub API (실제 데이터 미접근) -->
<script src="mock-github.js"></script>
<script>
'use strict';

// ============ Config ============
const OWNER = 'minsootask-web';
const REPO  = 'tasks-data';
const FILE  = 'active.md';
const INBOX_FILE = 'inbox.md';
const ARCHIVE_FILE = 'archive.json';

// ============ Theme (light/dark toggle) ============
const THEME_KEY = 'tasks_theme';
// 현재 실제 적용 중인 테마('light'|'dark') — 수동 지정이 있으면 그 값, 없으면 시스템 설정
function effectiveTheme() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t === 'light' || t === 'dark') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(mode) { // 'light' | 'dark' | 'system'
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') {
    root.setAttribute('data-theme', mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  } else {
    root.removeAttribute('data-theme');
    try { localStorage.removeItem(THEME_KEY); } catch (e) {}
  }
  updateThemeColorMeta();
}
function toggleTheme() {
  applyTheme(effectiveTheme() === 'dark' ? 'light' : 'dark');
}
// 수동 지정 시 모바일 브라우저 상단바 색을 실제 테마에 맞춘다(미지정이면 media 메타에 위임)
function updateThemeColorMeta() {
  const forced = document.documentElement.getAttribute('data-theme');
  let m = document.querySelector('meta#theme-color-dynamic');
  if (!forced) { if (m) m.remove(); return; }
  if (!m) {
    m = document.createElement('meta');
    m.id = 'theme-color-dynamic';
    m.setAttribute('name', 'theme-color');
    document.head.appendChild(m);
  }
  m.setAttribute('content', forced === 'dark' ? '#191919' : '#ffffff');
}

};
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// URL 자동 링크(B14): http(s)만. 긴 주소는 "도메인/…"으로 줄여 보여 주고 전체 주소는 툴팁.
// 파일 원문은 그대로(표시만). 이스케이프한 글 위에서 만들기 때문에 다른 HTML은 들어갈 수 없다.
function linkHTML(url) {
  const m = url.match(/^https?:\/\/([^/?#]+)([^]*)$/);
  const host = m ? m[1].replace(/^www\./, '') : url;
  const label = m && m[2] && m[2] !== '/' ? `${host}/…` : host;
  return `<a class="task-link" href="${url}" target="_blank" rel="noopener noreferrer" title="${url}">${label}</a>`;
}
// 이스케이프한 글을 URL과 나머지로 나눠, URL은 링크로·나머지는 plain()으로 처리
function linkify(escaped, plain = (t) => t) {
  const out = [];
  const re = /https?:\/\/[^\s<>"']+/g;
  let last = 0, m;
  while ((m = re.exec(escaped))) {
    let url = m[0], tail = '';
    // 문장 끝 구두점·괄호 닫기는 링크에서 뺀다(괄호가 짝이 맞으면 유지)
    while (/[.,;:!?)\]]$/.test(url)) {
      const ch = url.slice(-1);
      if (ch === ')' && (url.match(/\(/g) || []).length >= (url.match(/\)/g) || []).length) break;
      tail = ch + tail;
      url = url.slice(0, -1);
    }
    out.push(plain(escaped.slice(last, m.index)), linkHTML(url));
    last = m.index + url.length;
    re.lastIndex = last;
  }
  out.push(plain(escaped.slice(last)));
  return out.join('');
}
const highlightMeta = (s) => linkify(esc(s), (t) => t.replace(/\(([~^]?[\d\-/.][^)]*)\)/g, '<span class="meta-inline">($1)</span>'));

const TOAST_MS = { info: 2500, undo: 5000, error: 6000 };
const toastState = { timer: null, remaining: 0, startedAt: 0, action: null, kind: null };

function showToast(msg, { kind = 'info', ms, action = null } = {}) {
  const t = $('#toast');
  clearTimeout(toastState.timer);
  t.innerHTML = '';
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  t.appendChild(span);
  toastState.action = null;
  toastState.kind = kind;
  if (action && action.label && typeof action.onClick === 'function') {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.type = 'button';
    btn.textContent = action.label;
    let fired = false;
    const fire = () => {
      if (fired) return;
      fired = true;
      hideToast();
      action.onClick();
    };
    btn.addEventListener('click', fire);
    t.appendChild(btn);
    toastState.action = { fire, undo: kind === 'undo' };
  }
  t.classList.add('show');
  toastState.remaining = ms ?? TOAST_MS[kind] ?? TOAST_MS.info;
  startToastTimer();
}
function startToastTimer() {
  clearTimeout(toastState.timer);
  toastState.startedAt = Date.now();
  toastState.timer = setTimeout(hideToast, toastState.remaining);
}
function pauseToast() {
  if (!$('#toast').classList.contains('show')) return;
  clearTimeout(toastState.timer);
  toastState.remaining = Math.max(800, toastState.remaining - (Date.now() - toastState.startedAt));
}
function resumeToast() {
  if (!$('#toast').classList.contains('show')) return;
  startToastTimer();
}
function hideToast() {
  clearTimeout(toastState.timer);
  $('#toast').classList.remove('show');
  toastState.action = null;
}

// 화면에 보여줄 쉬운 오류 문구. 원래 오류(PUT 500, conflict 등)는 콘솔에만 남긴다.
function friendlyError(e, fallback = '저장하지 못했어요') {
  if (e && e.userMessage) return e.userMessage;
  if (e && (e.name === 'TypeError' || e.offline || (typeof navigator !== 'undefined' && navigator.onLine === false))) {
    return '인터넷 연결을 확인해 주세요';
  }
  return fallback;
}

const notify = {
  info: (msg, ms) => showToast(msg, { kind: 'info', ms }),
  undo: (msg, onUndo) => showToast(msg, { kind: 'undo', action: { label: '되돌리기', onClick: onUndo } }),
  error: (msg, { retry, label = '다시 시도', ms } = {}) =>
    showToast(msg, { kind: 'error', ms, action: retry ? { label, onClick: retry } : null }),
};
// 오류 객체를 받아 쉬운 말로 알린다(retry가 있으면 "다시 시도" 버튼)
function notifyError(e, { fallback, retry } = {}) {
  if (e) console.error(e);
  notify.error(friendlyError(e, fallback), { retry });
}

// 이전 호출부 호환: toast(msg, ms, { label, onClick })
function toast(msg, ms, action = null) {
  if (action) showToast(msg, { kind: 'undo', ms, action });
  else showToast(msg, { kind: 'info', ms });
}

// utf-8 safe base64
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function base64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// ============ GitHub API ============
// ============ 파일 스토어 (F3) ============
// 파일 하나 = 스토어 하나. 화면은 늘 view(= base + 아직 저장 안 된 연산 pending)로 그린다.
//  - base/sha: 마지막으로 확인된 원격본
//  - apply(op): 연산을 pending에 쌓고 view를 즉시 갱신(낙관적). 저장은 파일당 하나의 큐에서만.
//  - 저장 내용은 "base 위에 pending 연산을 다시 적용한 결과" → 저장 중에 생긴 변경이 덮이지 않음(A3b)
//  - 409(다른 기기·봇이 먼저 씀): 최신본을 받아 같은 연산을 다시 적용하고 재시도(최대 2번)
//  - reload(): base만 바꾸고 pending은 그 위에 다시 적용 → 불러오기가 미저장 변경을 지우지 않음(A3·A3c)
//  - 연산은 (content) => content 순수 함수. 대상은 줄 번호가 아니라 원문 줄·글·id로 찾는다.
//    대상을 못 찾으면 예외 → 그 연산만 버림(userMessage로 알림)
//  - 저장 실패 시: onFail 'keep'(체크 등)은 pending에 남겨 "저장 안 됨 · 다시 시도"로 재시도,
//    'drop'(추가·이동·보관 등)은 버리고 view를 되돌린 뒤 호출자에게 실패를 알림(글 복원·토스트는 호출자)
function deferred() {
  let resolve, reject;
  const promise = new Promise((a, b) => { resolve = a; reject = b; });
  promise.catch(() => {}); // 호출자가 기다리지 않아도 미처리 거부 경고를 내지 않게
  return { promise, resolve, reject };
}

async function ghGet(url) {
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${state.token}`, Accept: 'application/vnd.github+json' },
    cache: 'no-cache',
  });
  if (!res.ok) {
    if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
    if (res.status === 404) throw Object.assign(new Error('not-found'), { code: 404 });
    throw Object.assign(new Error(`HTTP ${res.status}`), { code: res.status });
  }
  const data = await res.json();
  return { sha: data.sha, content: base64ToUtf8(data.content) };
}

async function ghPut(url, content, sha, message, { keepalive = false } = {}) {
  const res = await fetch(url, {
    method: 'PUT',
    keepalive,
    headers: {
      Authorization: `Bearer ${state.token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ message, content: utf8ToBase64(content), sha }),
  });
  if (!res.ok) throw Object.assign(new Error(`PUT ${url.split('/').pop()} ${res.status}`), { code: res.status });
  const data = await res.json();
  return data.content.sha;
}

function createStore({ file, url, parse, serialize, onChange, onRebase, missing }) {
  const s = {
    file, base: null, sha: '', pending: [], view: null, loaded: false,
    queue: Promise.resolve(), timer: null, flushing: false,
  };
  // pending 연산을 차례로 적용. 대상을 못 찾는 연산은 bad로 모은다.
  const applyAll = (base, ops) => {
    let c = base;
    const bad = [];
    for (const p of ops) {
      try { c = p.op(c); } catch (e) { bad.push({ p, e }); }
    }
    return { c, bad };
  };
  const recompute = () => {
    if (s.base == null) return;
    const { c, bad } = applyAll(s.base, s.pending);
    bad.forEach(({ p, e }) => dropOp(p, e));
    s.view = c;
    onChange && onChange(s.view);
  };
  const dropOp = (p, e) => {
    s.pending = s.pending.filter((x) => x !== p);
    p.done.reject(e);
  };

  // gate: 이 연산을 저장해도 되는 시점(예: 다른 파일의 "추가"가 저장된 뒤). 화면에는 바로 반영되고,
  // gate가 풀리면 저장, gate가 실패하면 연산을 버리고 화면을 되돌린다(B9·A4 순서 보장).
  s.apply = (op, { msg = 'update', debounce = 0, onFail = 'drop', gate = null } = {}) => {
    const p = { op, msg, onFail, done: deferred(), ready: !gate };
    s.pending.push(p);
    recompute();
    if (gate) {
      gate.then(() => { p.ready = true; s.schedule(0); },
        (e) => { if (s.pending.includes(p)) { dropOp(p, e); recompute(); } });
    } else {
      s.schedule(debounce);
    }
    return p.done.promise;
  };
  // 즉시 저장하고 결과를 기다린다
  s.commit = (op, opts = {}) => {
    const pr = s.apply(op, { ...opts, debounce: 0 });
    return pr;
  };
  s.schedule = (debounce = 0) => {
    clearTimeout(s.timer);
    if (debounce > 0) s.timer = setTimeout(() => { s.timer = null; s.flush(); }, debounce);
    else { s.timer = null; s.flush(); }
  };
  s.flush = ({ keepalive = false } = {}) => {
    clearTimeout(s.timer);
    s.timer = null;
    const run = s.queue.then(() => flushOnce(keepalive));
    s.queue = run.catch(() => {});
    return run;
  };
  const flushOnce = async (keepalive) => {
    const batch = s.pending.filter((p) => p.ready);
    if (!batch.length) {
      // 다시 보낼 것이 없으면 남은 실패 표시도 정리
      if (syncStatus.errors[file]) { delete syncStatus.errors[file]; renderSync(); }
      return;
    }
    s.flushing = true;
    syncStatus.start(file);
    let rebased = false;
    try {
      for (let attempt = 0; ; attempt++) {
        const { c: next, bad } = applyAll(s.base, batch);
        bad.forEach(({ p, e }) => { batch.splice(batch.indexOf(p), 1); dropOp(p, e); });
        if (!batch.length) { syncStatus.ok(file); recompute(); return; }
        const msg = batch.length === 1 ? batch[0].msg : `${batch[batch.length - 1].msg} (+${batch.length - 1})`;
        try {
          const text = serialize(next);
          s.sha = await ghPut(url, text, s.sha, msg, { keepalive });
          s.base = next;
          s.pending = s.pending.filter((p) => !batch.includes(p));
          recompute();
          syncStatus.ok(file);
          batch.forEach((p) => p.done.resolve());
          if (rebased) onRebase && onRebase();
          return;
        } catch (e) {
          if (e.code === 409 && attempt < 2) {
            // 다른 기기·봇이 먼저 썼다 → 최신본 위에 같은 연산을 다시 적용해 재시도
            await s.reloadBase();
            rebased = true;
            continue;
          }
          throw e;
        }
      }
    } catch (e) {
      console.error(e);
      batch.forEach((p) => { if (p.onFail !== 'keep') dropOp(p, e); });
      // 저장 안 된 변경(keep)이 남아 있을 때만 "저장 안 됨 · 다시 시도"를 계속 보인다.
      // 버린 변경(추가·이동 등)은 호출자가 글 복원·토스트로 알린다.
      if (s.pending.some((p) => p.onFail === 'keep')) {
        syncStatus.retry[file] = () => s.flush();
        syncStatus.fail(file);
      } else {
        syncStatus.end(file);
      }
      recompute();
      if (rebased) onRebase && onRebase();
      // keep 연산은 남겨 두고 실패를 알린다(다시 시도하면 함께 저장)
      batch.forEach((p) => {
        if (p.onFail === 'keep') { const d = p.done; p.done = deferred(); d.reject(e); }
      });
    } finally {
      s.flushing = false;
    }
  };
  s.reloadBase = async () => {
    let r;
    try {
      r = await ghGet(url);
    } catch (e) {
      if (e.code !== 404 || missing == null) throw e;
      // 파일이 아직 없으면 빈 파일로 만든다(archive.json·memos.json 첫 사용)
      if (missing === false) { s.sha = undefined; s.base = parse(''); s.loaded = true; return; }
      await ghPut(url, missing, undefined, `init: ${file}`);
      r = await ghGet(url);
    }
    s.sha = r.sha;
    s.base = parse(r.content);
    s.loaded = true;
  };
  // 원격본을 다시 받아 오되, 아직 저장 안 된 연산은 그 위에 다시 적용한다
  s.reload = async () => {
    await s.reloadBase();
    recompute();
  };
  s.hasPending = () => s.pending.length > 0;
  s.hasReady = () => s.pending.some((p) => p.ready);
  // 대기 중인 디바운스까지 지금 저장하고, 큐가 빌 때까지 기다린다
  s.flushAll = async (opts) => {
    if (s.hasReady()) await s.flush(opts);
    await s.queue;
  };
  return s;
}

// ---- 두 파일 이동 (F4) ----
// 원칙: "추가 먼저, 제거 나중" — 중간에 실패해도 유실이 아니라 중복이 된다. 그 위에 보상을 얹는다.
//  adds: [{ store, op, undo, msg }] 차례로 저장. 하나라도 실패하면 앞서 저장한 추가를 거꾸로 되돌림
//  remove: { store, op, msg } 마지막에 저장. 실패하면 모든 추가를 되돌림 → 항목은 원래 자리에만 남음
//  되돌리기마저 실패하면 e.partial = true (두 곳에 있을 수 있음 → "일부만 저장됐어요 · 새로 불러오기")
function runTransfer({ adds, remove }) {
  // 화면은 지금 바로 바뀐다(B9): 추가 쪽은 즉시, 제거 쪽은 화면엔 즉시·저장은 추가가 저장된 뒤(gate)
  const addPs = adds.map((a) => a.store.apply(a.op, { msg: a.msg }));
  const gate = Promise.all(addPs);
  gate.catch(() => {});
  const removeP = remove.store.apply(remove.op, { msg: remove.msg, gate });
  const rollback = async (okAdds, cause) => {
    for (const a of okAdds.reverse()) {
      try {
        await a.store.commit(a.undo, { msg: `rollback: ${a.msg}` });
      } catch (e3) {
        console.error('rollback failed', e3);
        throw Object.assign(new Error('partial'), { partial: true, cause });
      }
    }
    throw Object.assign(new Error('rolled back'), { rolledBack: true, cause, offline: cause && cause.name === 'TypeError' });
  };
  return (async () => {
    const results = await Promise.allSettled(addPs);
    const failed = results.find((r) => r.status === 'rejected');
    if (failed) {
      // 제거 쪽은 gate 실패로 이미 버려짐(화면 원위치)
      const okAdds = adds.filter((a, i) => results[i].status === 'fulfilled');
      if (!okAdds.length) throw failed.reason;
      await rollback(okAdds, failed.reason);
    }
    try {
      await removeP;
    } catch (e2) {
      await rollback([...adds], e2);
    }
  })();
}

// 이동 실패 알림(디자이너 스펙 A4)
function notifyTransferError(e, retry) {
  console.error(e && e.cause ? e.cause : e);
  if (e && e.partial) {
    notify.error('일부만 저장됐어요', { label: '새로 불러오기', retry: refresh });
  } else if (e && e.rolledBack) {
    notify.error('옮기지 못했어요. 원래 자리에 그대로 있어요', { retry });
  } else {
    notify.error(friendlyError(e), { retry });
  }
}

// 되돌리기용 연산: 방금 섹션 끝에 넣은 줄(들)을 그 섹션 안에서 뒤에서부터 찾아 지운다
const opActiveRemoveAppended = (key, texts) => (c) => {
  const lines = c.split('\n');
  texts.forEach((t) => {
    const header = sectionHeaderIndex(lines, key);
    if (header === -1) return;
    let end = lines.length;
    for (let i = header + 1; i < lines.length; i++) if (lines[i].startsWith('## ')) { end = i; break; }
    for (let i = end - 1; i > header; i--) {
      if (lines[i] === `- [ ] ${t}`) { lines.splice(i, 1); break; }
    }
  });
  return lines.join('\n');
};
// 되돌리기용: 복구해 넣은 블록을 첫 줄 글로 찾아(섹션 안 뒤에서부터) 지운다
const opActiveRemoveRestored = (entries) => (c) => {
  const lines = c.split('\n');
  entries.forEach((entry) => {
    const first = (entry.block || [])[0];
    if (!first) return;
    const want = normLine(first.trim());
    const header = sectionHeaderIndex(lines, entry.priority);
    if (header === -1) return;
    let end = lines.length;
    for (let i = header + 1; i < lines.length; i++) if (lines[i].startsWith('## ')) { end = i; break; }
    for (let i = end - 1; i > header; i--) {
      if (normLine(lines[i].trim()) === want) {
        const r = extractBlock(lines, i);
        lines.splice(r.start, r.end - r.start + 1);
        break;
      }
    }
  });
  return lines.join('\n');
};

const opInboxRemoveLast = (texts) => (c) => {

const opMemoMove = (m, targetCol, targetIdx, cols, { aboveId, belowId } = {}) => (list) => {
  if (!list.some((x) => x.id === m.id)) throw memoGone();
  // 이웃 메모 기준으로 위치를 다시 계산(그 사이 다른 메모가 끼어들어도 같은 자리)
  const colList = list
    .filter((x) => x.id !== m.id && Math.min(cols - 1, Math.max(0, memoCol(x))) === targetCol)
    .sort((a, b) => memoOrder(a) - memoOrder(b));
  let idx = targetIdx;
  const bi = belowId ? colList.findIndex((x) => x.id === belowId) : -1;
  const ai = aboveId ? colList.findIndex((x) => x.id === aboveId) : -1;
  if (bi !== -1) idx = bi;
  else if (ai !== -1) idx = ai + 1;
  else if (!belowId && aboveId == null) idx = Math.min(targetIdx, colList.length);
  else if (!belowId) idx = colList.length;
  return memosAfterMove(list, list.find((x) => x.id === m.id), targetCol, idx, cols);
};

// ---- active.md 연산 (모두 content → content) ----
// 렌더 시점 item(raw·lineIndex)으로 현재 줄을 다시 찾는다.
const lineOf = (item, content) => resolveLineIndex(item, content.split('\n'));
const opToggle = (item, checked) => (c) => toggleAt(lineOf(item, c), checked, c);
const opAppend = (key, text) => (c) => appendToSection(key, text, c);
const opEdit = (item, text) => (c) => editLine(lineOf(item, c), text, c);
const opEditMove = (item, text, key) => (c) => {
  const idx = lineOf(item, c);
  return moveLineToSection(idx, key, editLine(idx, text, c));
};
const opDeleteBlock = (item) => (c) => deleteAt(lineOf(item, c), c);
// 보관함 항목들을 되돌려 넣기
const opRestore = (entries) => (c) => {
  const lines = c.split('\n');
  entries.forEach((entry) => restoreBlockInto(lines, entry));
  return lines.join('\n');
};
// 여러 블록을 원문 줄로 찾아 한꺼번에 지우기(뒤에서부터)
const opDeleteBlocks = (items) => (c) => {
  const lines = c.split('\n');
  const ranges = items.map((it) => extractBlock(lines, resolveLineIndex(it, lines)));
  ranges.sort((a, b) => b.start - a.start).forEach((r) => lines.splice(r.start, r.end - r.start + 1));
  return lines.join('\n');
};
// 드래그 이동: 목표 줄도 원문으로 다시 찾는다
const opMove = (srcItem, target) => (c) => {
  const lines = c.split('\n');
  const t = { ...target };
  if (target.beforeItem) t.beforeLine = resolveLineIndex(target.beforeItem, lines);
  if (target.intoItem) t.intoLine = resolveLineIndex(target.intoItem, lines);
  return moveLineToPosition(resolveLineIndex(srcItem, lines), t, c);
};

// ============ Parsing / Mutation ============
function parseInbox(text) {
  return text.split('\n')
    .map((line, idx) => ({ line, idx }))
    .filter(({ line }) => line.match(/^-\s+\S/))
    .map(({ line, idx }) => ({ text: line.replace(/^-\s+/, '').trim(), lineIdx: idx }));
}

// Inbox 줄 위치는 렌더 이후 바뀔 수 있다(앞선 처리·봇 추가). 줄 번호만 믿고 지우면 엉뚱한 줄이
// 지워지므로, 원래 글(`- text`)로 가장 가까운 줄을 다시 찾는다. 없으면 -1(이미 지워짐).
function resolveInboxLine(item, lines) {
  const same = (l) => l != null && /^-\s+\S/.test(l) && l.replace(/^-\s+/, '').trim() === item.text;
  if (same(lines[item.lineIdx])) return item.lineIdx;
  for (let d = 1; d < lines.length; d++) {
    if (same(lines[item.lineIdx - d])) return item.lineIdx - d;
    if (same(lines[item.lineIdx + d])) return item.lineIdx + d;
  }
  return -1;
}

function removeInboxLine(item, content = state.inboxContent) {
  return removeInboxLines([item], content);
}

function removeInboxLines(items, content = state.inboxContent) {
  const lines = content.split('\n');
  const idxs = [];
  items.forEach((it) => {
    const i = resolveInboxLine(it, lines.map((l, k) => (idxs.includes(k) ? null : l)));
    if (i !== -1) idxs.push(i);
  });
  idxs.sort((a, b) => b - a).forEach((idx) => lines.splice(idx, 1));
  return lines.join('\n');
}

// Inbox 처리 잠금(A8): 같은 항목을 처리하는 중에 또 누르면 무시하고, 서로 다른 항목 처리는
// 차례대로 실행한다(겹치면 sha 충돌·엉뚱한 줄 삭제).
const inboxBusy = new Set();
function withInboxLock(items, fn) {
  // 화면은 바로 바뀌므로(B9) 차례 기다리기는 하지 않고, 처리 중인 같은 항목만 무시한다.
  // 저장 순서·충돌은 파일 스토어가 맡는다.
  const keys = items.map((i) => i.text);
  if (keys.some((k) => inboxBusy.has(k))) return Promise.resolve();
  keys.forEach((k) => inboxBusy.add(k));
  return Promise.resolve().then(fn).finally(() => keys.forEach((k) => inboxBusy.delete(k)));
}

function parseSections(text) {
  const lines = text.split('\n');
  const sections = [];
  let cur = null;
  lines.forEach((line, idx) => {
    const hd = line.match(/^##\s+(.+)$/);
    if (hd) {
      cur = { title: hd[1].trim(), items: [], headerLine: idx };
      sections.push(cur);
      return;
    }
    if (!cur) return;
    const cb = line.match(/^(\s*)- \[([ xX])\] (.*)$/);
    if (cb) {
      cur.items.push({
        type: 'task',
        indent: Math.floor(cb[1].length / 2),
        checked: cb[2].toLowerCase() === 'x',
        text: cb[3],
        lineIndex: idx,
        raw: line, // 저장 직전 실제 줄 위치를 다시 확인하는 기준값
      });
      return;
    }
    const bl = line.match(/^(\s*)- (.+)$/);
    if (bl && bl[2].trim() !== '') {
      cur.items.push({
        type: 'bullet',
        indent: Math.floor(bl[1].length / 2),
        text: bl[2],
        lineIndex: idx,
        raw: line,
      });
    }
  });
  // 같은 글의 줄이 여럿일 때 구분할 단서(Q2): 섹션, 부모 줄, 파일 안에서 같은 글 중 몇 번째인지
  const same = new Map();
  lines.forEach((l, i) => { const k = normLine(l); if (!same.has(k)) same.set(k, []); same.get(k).push(i); });
  sections.forEach((sec) => {
    const stack = [];
    sec.items.forEach((it) => {
      while (stack.length && stack[stack.length - 1].indent >= it.indent) stack.pop();
      it.section = sec.title;
      it.parentRaw = stack.length ? stack[stack.length - 1].raw : null;
      const list = same.get(normLine(it.raw)) || [];
      it.ordinal = list.indexOf(it.lineIndex);
      it.sameCount = list.length;
      stack.push(it);
    });
  });
  return sections;
}

function findSectionByKey(key) {
  const want = SECTION_KEYS[key];
  return state.sections.find((s) => s.title === want);
}

function sectionHeaderIndex(lines, key) {
  const want = SECTION_KEYS[key];
  return lines.findIndex((l) => l.match(/^##\s+(.+)$/)?.[1]?.trim() === want);
}

// 섹션 헤더가 사라진 파일에서도 막히지 않도록, 없으면 정해진 순서에 맞춰 다시 만든다.
// (헤더가 지워진 채로 두면 그 우선순위로는 추가·이동·복구가 전부 실패한다)
function ensureSectionHeader(lines, key) {
  const found = sectionHeaderIndex(lines, key);
  if (found !== -1) return found;
  const order = ['high', 'medium', 'low'];
  const laterIdx = order
    .slice(order.indexOf(key) + 1)
    .map((k) => sectionHeaderIndex(lines, k))
    .filter((i) => i !== -1);
  const at = laterIdx.length ? Math.min(...laterIdx) : lines.length;
  lines.splice(at, 0, `## ${SECTION_KEYS[key]}`);
  return at;
}

// 섹션 안에서 새 줄을 넣을 기준 위치(마지막 비어있지 않은 줄)
function sectionInsertAfter(lines, key) {
  const headerIdx = ensureSectionHeader(lines, key);
  let insertAfter = headerIdx;
  for (let i = headerIdx + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    if (lines[i].trim() !== '') insertAfter = i;
  }
  return insertAfter;
}

// 섹션 끝에 블록을 넣는다. 마지막 줄이 "- " 자리표시자면 그 줄을 대체한다.
function insertIntoSection(lines, key, block) {
  const at = sectionInsertAfter(lines, key);
  if (lines[at].trim() === '-' || lines[at].trim() === '- ') lines.splice(at, 1, ...block);
  else lines.splice(at + 1, 0, ...block);
}

// 렌더 시점의 lineIndex는 그 뒤 다른 저장이 끝나면 어긋난다(줄이 늘거나 줄어듦).
// 그 상태로 삭제·이동하면 엉뚱한 줄(섹션 헤더까지)이 지워지므로,
// 저장 직전에 원본 줄 내용으로 실제 위치를 다시 찾는다.
function normLine(l) {
  return l == null ? null : l.replace(/- \[[xX]\]/, '- [ ]');
}

// 줄이 속한 섹션 제목과 부모 줄(원문)
function lineContext(ls, idx) {
  const ind = getLineIndent(ls[idx] || '');
  let parent = null, section = null;
  for (let i = idx - 1; i >= 0; i--) {
    const l = ls[i];
    const hd = l.match(/^##\s+(.+)$/);
    if (hd) { section = hd[1].trim(); break; }
    if (parent == null && l.trim() !== '' && /^\s*- /.test(l) && getLineIndent(l) < ind) parent = l;
  }
  return { section, parent };
}

// 줄 위치 다시 찾기. 원래 자리에 그대로 있으면 그 줄, 아니면 같은 글의 줄을 찾는다.
// 같은 글의 줄이 여럿이면(Q2) 섹션 → 부모 줄 → "같은 글 중 몇 번째"(개수가 그대로일 때) 순서로 좁히고,
// 그래도 하나로 정해지지 않으면 추측하지 않고 gone 예외(엉뚱한 줄을 지우거나 옮기지 않게).
// exclude: 이미 다른 대상으로 잡힌 줄(Q1, 여러 대상을 한 번에 찾을 때)
// 렌더 정보가 없는 위치 기준(드래그 목표·되돌리기 기준 줄)은 예전처럼 가장 가까운 줄.
function resolveLineIndex(item, lines, { exclude = null } = {}) {
  const ls = lines || state.content.split('\n');
  const want = normLine(item.raw);
  if (want == null) return item.lineIndex;
  const free = (i) => !(exclude && exclude.has(i));
  // 맥락(섹션·부모)이 같은지 — 원래 자리에 같은 글이 있어도 다른 섹션·다른 부모의 줄일 수 있다
  const sameContext = (i) => {
    if (item.section === undefined) return true;
    const ctx = lineContext(ls, i);
    if (ctx.section !== item.section) return false;
    if (item.parentRaw === undefined) return true;
    return (ctx.parent == null ? null : normLine(ctx.parent)) === (item.parentRaw == null ? null : normLine(item.parentRaw));
  };
  if (free(item.lineIndex) && normLine(ls[item.lineIndex]) === want && sameContext(item.lineIndex)) return item.lineIndex;
  const all = [];
  ls.forEach((l, i) => { if (normLine(l) === want) all.push(i); });
  let cands = all.filter(free);
  const gone = () => {
    const msg = '목록이 바뀌었어요. 새로 불러온 뒤 다시 해 주세요';
    return Object.assign(new Error(msg), { userMessage: msg, gone: true });
  };
  if (!cands.length) throw gone();
  if (cands.length === 1) return cands[0];
  if (item.section === undefined) {
    // 맥락 정보가 없는 기준 줄: 가장 가까운 줄
    return cands.reduce((a, b) => (Math.abs(b - item.lineIndex) < Math.abs(a - item.lineIndex) ? b : a));
  }
  let c = cands.filter((i) => lineContext(ls, i).section === item.section);
  if (!c.length) c = cands;
  if (item.parentRaw !== undefined) {
    const wantParent = item.parentRaw == null ? null : normLine(item.parentRaw);
    const c2 = c.filter((i) => { const p = lineContext(ls, i).parent; return (p == null ? null : normLine(p)) === wantParent; });
    if (c2.length) c = c2;
  }
  if (c.length === 1) return c[0];
  if (item.ordinal != null && item.ordinal >= 0 && all.length === item.sameCount) {
    const byOrder = all[item.ordinal];
    if (c.includes(byOrder)) return byOrder;
  }
  throw gone();
}

// 헤더·빈 줄은 항목 조작 대상이 될 수 없다. 마지막 안전장치.
function assertItemLine(lines, idx) {
  const l = lines[idx];
  if (l == null || /^##\s/.test(l) || l.trim() === '') {
    const msg = '항목을 찾지 못했어요. 새로 불러온 뒤 다시 해 주세요';
    throw Object.assign(new Error(msg), { userMessage: msg, gone: true });
  }
}

// active.md 변경의 직렬화는 activeStore(F3)가 맡는다. 연산은 저장 직전 원문 줄로 위치를 다시 찾는다.

function toggleAt(lineIndex, checked, content = state.content) {
  const lines = content.split('\n');
  assertItemLine(lines, lineIndex);
  const line = lines[lineIndex];
  lines[lineIndex] = checked
    ? line.replace('- [ ]', '- [x]')
    : line.replace('- [x]', '- [ ]');
  return lines.join('\n');
}

function appendToSection(key, text, content = state.content) {
  const lines = content.split('\n');
  insertIntoSection(lines, key, [`- [ ] ${text}`]);
  return lines.join('\n');
}

function editLine(lineIndex, newText, content = state.content) {
  const lines = content.split('\n');
  const line = lines[lineIndex];
  const m = line.match(/^(\s*- \[[ xX]\] )(.*)$/);
  if (!m) throw new Error('not a task line');
  lines[lineIndex] = m[1] + newText;
  return lines.join('\n');
}

function deleteAt(lineIndex, content = state.content) {
  const lines = content.split('\n');
  assertItemLine(lines, lineIndex);
  const base = lines[lineIndex];
  const baseIndent = (base.match(/^(\s*)/)?.[0] || '').length;
  let removeUntil = lineIndex;
  for (let i = lineIndex + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    const ind = (lines[i].match(/^(\s*)/)?.[0] || '').length;
    if (lines[i].trim() === '') continue;
    if (ind > baseIndent) removeUntil = i;
    else break;
  }
  lines.splice(lineIndex, removeUntil - lineIndex + 1);
  return lines.join('\n');
}

function extractBlock(lines, lineIndex) {
  assertItemLine(lines, lineIndex);
  const baseIndent = (lines[lineIndex].match(/^(\s*)/)?.[0] || '').length;
  let endIdx = lineIndex;
  for (let i = lineIndex + 1; i < lines.length; i++) {
    if (lines[i].startsWith('## ')) break;
    const ind = (lines[i].match(/^(\s*)/)?.[0] || '').length;
    if (lines[i].trim() === '') continue;
    if (ind > baseIndent) endIdx = i;
    else break;
  }
  return { start: lineIndex, end: endIdx };
}

function getLineIndent(line) {
  const m = line.match(/^(\s*)/);
  return Math.floor((m?.[0]?.length || 0) / 2);
}

function adjustBlockIndent(block, deltaIndent) {
  if (deltaIndent === 0) return block;
  return block.map((line) => {
    if (line.trim() === '') return line;
    const m = line.match(/^(\s*)(.*)$/);
    const curIndent = Math.floor(m[1].length / 2);
    const newIndent = Math.max(0, curIndent + deltaIndent);
    return '  '.repeat(newIndent) + m[2];
  });
}

// 부모 줄(parentIdx)의 마지막 하위 항목 바로 다음 위치
function childInsertIndex(lines, parentIdx) {
  const parentIndent = getLineIndent(lines[parentIdx]);
  let insertAt = parentIdx + 1;
  while (insertAt < lines.length) {
    const l = lines[insertAt];
    if (l.startsWith('## ')) break;
    if (l.trim() === '') { insertAt++; continue; }
    if (getLineIndent(l) <= parentIndent) break;
    insertAt++;
  }
  return insertAt;
}

// 보관함 항목을 active.md 줄 배열에 되돌린다.
// 하위 할 일(entry.parent 있음)은 같은 섹션에 부모가 있으면 그 부모의 마지막 하위로,
// 없으면 상위 항목으로 섹션 끝에 넣는다(A6). 들여쓴 채 섹션 끝에 넣으면 엉뚱한 부모에 붙기 때문.
function restoreBlockInto(lines, entry) {
  const block = entry.block || [];
  if (!block.length) return;
  if (entry.parent) {
    const headerIdx = ensureSectionHeader(lines, entry.priority);
    for (let i = headerIdx + 1; i < lines.length && !lines[i].startsWith('## '); i++) {
      const m = lines[i].match(/^(\s*)- \[[ xX]\] (.*)$/);
      if (m && m[2] === entry.parent) {
        const at = childInsertIndex(lines, i);
        const indented = adjustBlockIndent(block, getLineIndent(lines[i]) + 1 - getLineIndent(block[0]));
        lines.splice(at, 0, ...indented);
        return;
      }
    }
  }
  insertIntoSection(lines, entry.priority, adjustBlockIndent(block, -getLineIndent(block[0])));
}

function moveLineToSection(lineIndex, targetKey, content = state.content) {
  const lines = content.split('\n');
  const { start, end } = extractBlock(lines, lineIndex);
  const block = lines.splice(start, end - start + 1);
  insertIntoSection(lines, targetKey, block);
  return lines.join('\n');
}

// Move a task block.
// target: { sectionKey, beforeLine?, intoLine?, indent? }
//   - beforeLine: insert before this line at the target line's indent (sibling)
//   - intoLine: insert as the last child of this line (indent = target + 1)
//   - neither: append at end of section as a main task (indent 0)
//   - indent: optional explicit depth override (used for the depth-ambiguous gap below a
//     last child, where the next line's indent alone can't express "stay as the last child")
function moveLineToPosition(srcLineIndex, target, content = state.content) {
  const lines = content.split('\n');
  const { start, end } = extractBlock(lines, srcLineIndex);
  const blockLen = end - start + 1;

  if (target.beforeLine != null && target.beforeLine > start && target.beforeLine <= end) {
    throw new Error('invalid drop: before-target is inside source block');
  }
  if (target.intoLine != null && target.intoLine >= start && target.intoLine <= end) {
    throw new Error('invalid drop: cannot make self/descendant into a child');
  }

  const srcBaseIndent = getLineIndent(lines[start]);
  let block = lines.splice(start, blockLen);

  let targetIndent;
  if (target.intoLine != null) {
    let intoIdx = target.intoLine;
    if (intoIdx > start) intoIdx -= blockLen;
    targetIndent = getLineIndent(lines[intoIdx]) + 1;
  } else if (target.beforeLine != null) {
    let beforeIdx = target.beforeLine;
    if (beforeIdx > start) beforeIdx -= blockLen;
    targetIndent = getLineIndent(lines[beforeIdx]);
  } else {
    targetIndent = 0;
  }
  if (target.indent != null && target.intoLine == null) targetIndent = target.indent;
  block = adjustBlockIndent(block, targetIndent - srcBaseIndent);

  if (target.intoLine != null) {
    let parentIdx = target.intoLine;
    if (parentIdx > start) parentIdx -= blockLen;
    lines.splice(childInsertIndex(lines, parentIdx), 0, ...block);
    return lines.join('\n');
  }

  if (target.beforeLine != null) {
    let insertAt = target.beforeLine;
    if (insertAt > start) insertAt -= blockLen;
    lines.splice(insertAt, 0, ...block);
    return lines.join('\n');
  }

  insertIntoSection(lines, target.sectionKey, block);
  return lines.join('\n');
}

// ============ Inbox rendering & handlers ============
function updateInboxBar() {
  const bar = $('#inbox-bar');
  if (!bar) return;
  const n = selectedInbox.size;
  const all = state.inboxItems.length;
  bar.classList.toggle('show', n > 0);
  syncComposerVisibility();
  if (n > 0) {
    $('#inbox-bar-label').textContent = `${n}개 선택`;
    $('#bar-select-all').textContent = n === all ? '전체해제' : '전체선택';
  }
}

function renderInbox() {
  const app = $('#app');
  const count = state.inboxItems.length;
  app.innerHTML = `
    ${renderShell('inbox')}
    <div class="card" id="inbox-list">
      ${count === 0 ? '<div class="empty">Inbox를 다 정리했어요 🌮</div>' : ''}
    </div>
  `;
  bindTabEvents();
  const list = $('#inbox-list');
  state.inboxItems.forEach((item) => list.appendChild(renderInboxItem(item)));
  updateInboxBar();
  setComposerMode('inbox');
}

function renderInboxItem(item) {
  const div = document.createElement('div');
  div.className = 'inbox-item' + (selectedInbox.has(item.lineIdx) ? ' selected' : '');

  const cb = document.createElement('input');

  cb.addEventListener('click', (e) => {

    toggleInboxSelect(item.lineIdx, div, cb);
  });

  const text = document.createElement('div');
  text.className = 'inbox-text';
  text.textContent = item.text;

  const actions = document.createElement('div');

    <button class="pri-mini h" title="High로 보내기" aria-label="High로 보내기">🍅</button>
    <button class="pri-mini m" title="Medium으로 보내기" aria-label="Medium으로 보내기">🍋</button>
    <button class="pri-mini l" title="Low로 보내기" aria-label="Low로 보내기">🥝</button>

  actions.querySelectorAll('.pri-mini').forEach((btn) => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); onMoveToActive(item, btn.classList.contains('h') ? 'high' : btn.classList.contains('m') ? 'medium' : 'low'); });
  });
  actions.querySelector('.row-btn').addEventListener('click', (e) => { e.stopPropagation(); onDeleteFromInbox(item); });

  div.addEventListener('click', () => toggleInboxSelect(item.lineIdx, div, cb));
  div.appendChild(cb);
  div.appendChild(text);
  div.appendChild(actions);
  return div;
}

function toggleInboxSelect(lineIdx, div, cb) {
  if (selectedInbox.has(lineIdx)) {
    selectedInbox.delete(lineIdx);
    div.classList.remove('selected');

}

  }

    ? (entry.block?.[0] || '').replace(/^\s*- \[[ xX]\] /, '')

  text.innerHTML = esc(firstLine) + (extraCount ? ` <span class="meta-inline">+${extraCount}</span>` : '')
    + (entry.parent ? `<div class="meta-inline archive-parent">↳ ${esc(entry.parent)}</div>` : '');
  cb.setAttribute('aria-label', `선택: ${firstLine}`);

  div.appendChild(meta);
  div.appendChild(text);
  div.appendChild(when);
  div.appendChild(actions);
  return div;
}

function relativeDay(iso, now = new Date()) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff <= 0) return '오늘';
  if (diff === 1) return '어제';
  if (diff <= 7) return `${diff}일 전`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function toggleArchiveSelect(id, div, cb) {
  if (selectedArchive.has(id)) {
    selectedArchive.delete(id);
    div.classList.remove('selected');

async function onBulkRestore() {
  const ids = [...selectedArchive];
  const entries = state.archiveItems.filter((i) => selectedArchive.has(i.id));
  if (!entries.length) return;
  const work = runTransfer({
    adds: restoreAdds(entries),
    remove: { store: archiveStore, op: opArchiveRemove(ids), msg: `restore done: ${ids.length}` },
  });
  selectedArchive.clear();
  renderArchive();
  try { await work; } catch (e) {
    renderArchive();
    flashArchiveRows(ids);
    notifyTransferError(e, () => { ids.forEach((id) => selectedArchive.add(id)); onBulkRestore(); });
  }
}

// 보관함 항목 복구의 "추가" 단계들(Task·Inbox 각각)
function restoreAdds(entries) {
  const adds = [];
  const activeEntries = entries.filter((e) => e.source === 'active');
  if (activeEntries.length) {
    adds.push({ store: activeStore, op: opRestore(activeEntries), undo: opActiveRemoveRestored(activeEntries),
      msg: `restore ${activeEntries.length} from archive` });
  }
  const inboxTexts = entries.filter((e) => e.source === 'inbox').map((e) => e.text);
  if (inboxTexts.length) {
    adds.push({ store: inboxStore, op: opInboxAppend(inboxTexts), undo: opInboxRemoveLast(inboxTexts),
      msg: `restore ${inboxTexts.length} from archive` });
  }
  return adds;
}

async function onBulkPurge() {
  const ids = [...selectedArchive];
  if (!ids.length) return;
  if (!confirm(`${ids.length}개를 완전히 지울까요?\n지우면 다시 살릴 수 없어요.`)) return;
  const work = archiveStore.commit(opArchiveRemove(ids), { msg: `purge ${ids.length} from archive` });
  selectedArchive.clear();
  renderArchive();
  try { await work; } catch (e) { renderArchive(); flashArchiveRows(ids); notifyError(e); }
}

function genArchiveId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

// 반환: { work(저장 완료 Promise), entry, pos } — 화면은 호출 즉시 바뀐다(B9)
function archiveActiveTask(item) {
  const lineIndex = resolveLineIndex(item);
  const lines = state.content.split('\n');
  const { start, end } = extractBlock(lines, lineIndex);
  const block = lines.slice(start, end + 1);
  const sec = state.sections.find((s) => s.items.some((i) => i.lineIndex === lineIndex));
  const priority = Object.keys(SECTION_KEYS).find((k) => SECTION_KEYS[k] === sec?.title) || 'medium';
  const entry = {
    id: genArchiveId(),
    deletedAt: new Date().toISOString(),
    source: 'active',
    priority,
    block,
  };
  // 하위 할 일: 들여쓰기를 0으로 맞춰 보관하고, 복구할 자리를 찾도록 부모 글을 함께 남긴다(A6)
  const baseIndent = getLineIndent(lines[start]);
  if (baseIndent > 0) {
    entry.block = adjustBlockIndent(block, -baseIndent);
    for (let i = start - 1; i >= 0 && !lines[i].startsWith('## '); i--) {
      const m = lines[i].match(/^(\s*)- \[[ xX]\] (.*)$/);
      if (m && getLineIndent(lines[i]) < baseIndent) { entry.parent = m[2]; break; }
    }
  }
  // 보관함에 먼저 넣고 Task에서 뺀다. 뺄 때 실패하면 보관함에서 다시 빼서 한 곳에만 남긴다(A4)
  const work = runTransfer({
    adds: [{ store: archiveStore, op: opArchiveAdd([entry]), undo: opArchiveRemove([entry.id]), msg: `archive: ${item.text}` }],
    remove: { store: activeStore, op: opDeleteBlock({ ...item, lineIndex, raw: block[0] }), msg: `archive (from active): ${item.text}` },
  });
  // 되돌리기용 원래 자리: 블록 바로 위 줄(원문)과 원래 들여쓰기 블록
  return { work, entry, pos: { block, after: { lineIndex: start - 1, raw: lines[start - 1] } } };
}


async function onRestore(entry) {
  const work = runTransfer({
    adds: restoreAdds([entry]),
    remove: { store: archiveStore, op: opArchiveRemove([entry.id]), msg: 'restore done' },
  });
  renderArchive();
  try { await work; } catch (e) { renderArchive(); flashArchiveRows([entry.id]); notifyTransferError(e, () => onRestore(entry)); }
}

async function onPurge(entry) {
  if (!confirm('완전히 지울까요?\n지우면 다시 살릴 수 없어요.')) return;
  const work = archiveStore.commit(opArchiveRemove([entry.id]), { msg: 'purge: archive' });
  renderArchive();
  try { await work; } catch (e) { renderArchive(); flashArchiveRows([entry.id]); notifyError(e); }
}
