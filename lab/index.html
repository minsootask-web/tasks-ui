function renderArchiveItem(entry) {
  const div = document.createElement('div');
  div.className = 'inbox-item archive-item' + (selectedArchive.has(entry.id) ? ' selected' : '');
  div.dataset.id = entry.id;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'inbox-cb';
  cb.checked = selectedArchive.has(entry.id);
  cb.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleArchiveSelect(entry.id, div, cb);
  });

  const meta = document.createElement('span');
  meta.className = 'archive-badge';
  if (entry.source === 'active') {
    meta.classList.add('pri-' + entry.priority);
    const p = PRI[entry.priority] || PRI.medium;
    meta.textContent = p.icon;
    meta.title = `Task · ${p.label}`;
  } else {
    // 과일 아이콘은 우선순위 전용 — Inbox 출신은 11px 회색 글자 "Inbox"(D5, 이전 🥚는 뜻이 안 보였다)
    meta.textContent = 'Inbox';
    meta.classList.add('from-inbox');
    meta.title = 'Inbox에서 보관함으로 옮긴 항목';
  }

  const text = document.createElement('div');
  text.className = 'inbox-text';
  const firstLine = entry.source === 'active'
    ? (entry.block?.[0] || '').replace(/^\s*- \[[ xX]\] /, '')
    : (entry.text || '');
  const extraCount = entry.source === 'active' && entry.block && entry.block.length > 1 ? entry.block.length - 1 : 0;
  text.innerHTML = esc(firstLine) + (extraCount ? ` <span class="meta-inline">+${extraCount}</span>` : '')
    + (entry.parent ? `<div class="meta-inline archive-parent">↳ ${esc(entry.parent)}</div>` : '');
  cb.setAttribute('aria-label', `선택: ${firstLine}`);

  // 보관한 날짜(B14): 오늘 / 어제 / n일 전 / 7일 넘으면 10/12
  const when = document.createElement('span');
  when.className = 'archive-when';
  when.textContent = relativeDay(entry.deletedAt);
  if (entry.deletedAt) when.title = new Date(entry.deletedAt).toLocaleString('ko-KR');

  const actions = document.createElement('div');
  actions.className = 'inbox-actions';
  const restore = document.createElement('button');
  restore.className = 'row-btn';
  restore.title = '되살리기';
  restore.setAttribute('aria-label', `되살리기: ${firstLine}`);
  restore.innerHTML = '↺';
  restore.addEventListener('click', (e) => { e.stopPropagation(); onRestore(entry); });
  const del = document.createElement('button');
  del.className = 'row-btn danger';
  del.title = '완전히 지우기';
  del.setAttribute('aria-label', `완전히 지우기: ${firstLine}`);
  del.innerHTML = '🗑';
  del.addEventListener('click', (e) => { e.stopPropagation(); onPurge(entry); });
  actions.appendChild(restore);
  actions.appendChild(del);

  div.addEventListener('click', () => toggleArchiveSelect(entry.id, div, cb));
  div.appendChild(cb);
  div.appendChild(meta);
  div.appendChild(text);
  div.appendChild(when);
  div.appendChild(actions);
  return div;
}

function relativeDay(iso, now = new Date()) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff <= 0) return '오늘';
  if (diff === 1) return '어제';
  if (diff <= 7) return `${diff}일 전`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// 복구 잠금(Q5): 같은 보관 항목을 두 번 복구하면 Task에 같은 블록이 두 번 들어간다.
// 처리 중인 id는 무시하고, 이미 보관함 화면에서 빠진(복구된) 항목도 무시한다.
// (두 번째 탭이 아래로 밀려온 다른 항목에 떨어지는 것은 C1 자리 탭 무시가 막는다 — 전역 쿨다운은 없앰, R15)
const archiveBusy = new Set();
function claimArchive(entries) {
  const live = entries.filter((e) => state.archiveItems.some((x) => x.id === e.id) && !archiveBusy.has(e.id));
  if (!live.length) return null;
  live.forEach((e) => archiveBusy.add(e.id));
  return { live, release: () => live.forEach((e) => archiveBusy.delete(e.id)) };
}

async function onBulkRestore() {
  const claim = claimArchive(state.archiveItems.filter((i) => selectedArchive.has(i.id)));
  if (!claim) return;
  const entries = claim.live;
  const ids = entries.map((e) => e.id);
  const rows = archiveRowsFor(ids);
  const work = runTransfer({
    adds: restoreAdds(entries),
    remove: removeStep('archiveRemove', [ids], `restore done: ${ids.length}`, restoreVerify(entries)),
  });
  selectedArchive.clear();
  vanishRows(rows, renderArchive);
  try { await work; } catch (e) {
    renderArchive();
    flashArchiveRows(ids);
    notifyTransferError(e, () => { ids.forEach((id) => selectedArchive.add(id)); onBulkRestore(); });
  } finally { claim.release(); }
}

// 보관함 항목 복구의 "추가" 단계들(Task·Inbox 각각)
function restoreAdds(entries) {
  const adds = [];
  const activeEntries = entries.filter((e) => e.source === 'active');
  if (activeEntries.length) {
    const rec = {};
    adds.push({ store: activeStore, op: opRestore(activeEntries, rec), undo: opActiveRemoveRec(rec),
      msg: `restore ${activeEntries.length} from archive` });
  }
  const inboxTexts = entries.filter((e) => e.source === 'inbox').map((e) => e.text);
  if (inboxTexts.length) {
    const rec = {};
    adds.push({ store: inboxStore, op: opInboxAppend(inboxTexts, rec), undo: opInboxRemoveRec(rec),
      msg: `restore ${inboxTexts.length} from archive` });
  }
  return adds;
}

async function onBulkPurge() {
  const ids = [...selectedArchive];
  if (!ids.length) return;
  if (!confirm(`${ids.length}개를 완전히 지울까요?\n지우면 다시 살릴 수 없어요.`)) return;
  const rows = archiveRowsFor(ids);
  const work = archiveStore.commit(opArchiveRemove(ids), { msg: `purge ${ids.length} from archive` });
  selectedArchive.clear();
  vanishRows(rows, renderArchive);
  try { await work; } catch (e) { renderArchive(); flashArchiveRows(ids); notifyError(e); }
}

function genArchiveId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

// 반환: { work(저장 완료 Promise), entry, pos } — 화면은 호출 즉시 바뀐다(B9)
function archiveActiveTask(item) {
  const lineIndex = resolveLineIndex(item);
  const lines = state.content.split('\n');
  const { start, end } = extractBlock(lines, lineIndex);
  const block = lines.slice(start, end + 1);
  const sec = state.sections.find((s) => s.items.some((i) => i.lineIndex === lineIndex));
  const priority = Object.keys(SECTION_KEYS).find((k) => SECTION_KEYS[k] === sec?.title) || 'medium';
  const entry = {
    id: genArchiveId(),
    deletedAt: new Date().toISOString(),
    source: 'active',
    priority,
    block,
  };
  // 하위 할 일: 들여쓰기를 0으로 맞춰 보관하고, 복구할 자리를 찾도록 부모 글을 함께 남긴다(A6)
  const baseIndent = getLineIndent(lines[start]);
  if (baseIndent > 0) {
    entry.block = adjustBlockIndent(block, -baseIndent);
    for (let i = start - 1; i >= 0 && !lines[i].startsWith('## '); i--) {
      const m = lines[i].match(/^(\s*)- \[[ xX]\] (.*)$/);
      if (m && getLineIndent(lines[i]) < baseIndent) { entry.parent = m[2]; break; }
    }
  }
  // 보관함에 먼저 넣고 Task에서 뺀다. 뺄 때 실패하면 보관함에서 다시 빼서 한 곳에만 남긴다(A4)
  const work = runTransfer({
    adds: [{ store: archiveStore, op: opArchiveAdd([entry]), undo: opArchiveRemove([entry.id]), msg: `archive: ${item.text}` }],
    remove: removeStep('activeDeleteBlock', [{ ...item, lineIndex, raw: block[0] }], `archive (from active): ${item.text}`,
      [{ k: 'archiveHas', ids: [entry.id] }]),
  });
  // 되돌리기용 원래 자리: 블록을 뺀 내용에서 바로 위 기준 줄의 지문과 원래 들여쓰기 블록
  const mid = [...lines.slice(0, start), ...lines.slice(end + 1)];
  return { work, entry, pos: { block, anchor: anchorAt(mid, start) } };
}


async function onRestore(entry) {
  const claim = claimArchive([entry]);
  if (!claim) return;
  const work = runTransfer({
    adds: restoreAdds([entry]),
    remove: removeStep('archiveRemove', [[entry.id]], 'restore done', restoreVerify([entry])),
  });
  vanishRows(archiveRowsFor([entry.id]), renderArchive);
  try { await work; } catch (e) { renderArchive(); flashArchiveRows([entry.id]); notifyTransferError(e, () => onRestore(entry)); }
  finally { claim.release(); }
}

async function onPurge(entry) {
  if (!confirm('완전히 지울까요?\n지우면 다시 살릴 수 없어요.')) return;
  const rows = archiveRowsFor([entry.id]);
  const work = archiveStore.commit(opArchiveRemove([entry.id]), { msg: 'purge: archive' });
  vanishRows(rows, renderArchive);
  try { await work; } catch (e) { renderArchive(); flashArchiveRows([entry.id]); notifyError(e); }
}

// ============ Memos ============
function renderMemos() {
  selectedInbox.clear();
  updateInboxBar();
  const app = $('#app');
  app.innerHTML = `
    ${renderShell('memo')}
    <div class="memo-board" id="memo-board"></div>
  `;
  bindTabEvents();
  drawMemos();
  setComposerMode('memo');
}

function memoCol(m) {
  // Backward-compat: { x, y } → { col, order }
  if (m.col != null) return m.col;
  if (m.x != null) return m.x;
  return 0;
}
function memoOrder(m) {
  if (m.order != null) return m.order;
  if (m.y != null) return m.y;
  return 0;
}

function drawMemos() {
  const board = $('#memo-board');
  if (!board) return;
  const cols = getMemoCols();
  board.style.setProperty('--cols', cols);
  board.innerHTML = '';

  const grouped = Array.from({ length: cols }, () => []);
  state.memos.forEach((m) => {
    const c = Math.min(cols - 1, Math.max(0, memoCol(m)));
    grouped[c].push(m);
  });
  grouped.forEach((arr) => arr.sort((a, b) => memoOrder(a) - memoOrder(b)));

  grouped.forEach((arr, c) => {
    const col = document.createElement('div');
    col.className = 'memo-col';
    col.dataset.col = c;
    arr.forEach((m) => col.appendChild(renderMemoEl(m)));
    board.appendChild(col);
  });
}

function renderMemoEl(m) {
  const div = document.createElement('div');
  div.className = 'memo';
  div.dataset.id = m.id;

  const textEl = document.createElement('div');
  textEl.className = 'memo-text';
  textEl.textContent = m.text || '';
  div.appendChild(textEl);

  const del = document.createElement('button');
  del.className = 'memo-del';
  del.innerHTML = '×';
  del.title = '메모 지우기';
  del.setAttribute('aria-label', '메모 지우기');
  // 편집 중에만 보이므로, 누를 때 글자 편집의 포커스가 빠져(=편집 끝) 버튼이 사라지지 않게 막는다
  del.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
  del.addEventListener('mousedown', (e) => e.preventDefault());
  del.addEventListener('click', (e) => {
    e.stopPropagation();
    div.dataset.deleting = '1'; // 편집 종료(blur)가 지운 메모를 다시 저장하지 않게
    onDeleteMemo(m.id);
  });
  div.appendChild(del);

  div.addEventListener('pointerdown', (e) => onMemoPointerDown(e, m, div));
  return div;
}

// ============ 길게 눌러 드래그 (F6) ============
// 터치: 400ms 가만히 누르면 드래그 시작(진동 10ms), 그 전에 8px 넘게 움직이면 스크롤로 판단해 취소.
// 짧게 떼면 탭. 드래그가 시작된 뒤에만 touchmove를 막아 화면이 따라 스크롤되지 않게 한다.
// 마우스는 이 유틸을 쓰지 않는다(PC는 기존 방식 유지).
const LONG_PRESS_MS = 400;
const LONG_PRESS_SLOP = 8;
// 드래그 중에만 붙이는 비수동 touchmove 리스너(R22) — 평소 스크롤은 수동 리스너만이라 메인 스레드를 막지 않는다
let blockTouchScroll = false;
const touchBlocker = (e) => { if (e.cancelable) e.preventDefault(); };
function beginTouchBlock() {
  if (blockTouchScroll) return;
  blockTouchScroll = true;
  document.addEventListener('touchmove', touchBlocker, { passive: false });
}

function longPress(e, el, { onTap, onStart }) {
  const startX = e.clientX, startY = e.clientY, id = e.pointerId;
  let last = e, done = false;
  el.classList.add('pressing'); // 0.98배로 살짝 눌리는 예고
  const cleanup = () => {
    done = true;
    clearTimeout(timer);
    el.classList.remove('pressing');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
  const onMove = (ev) => {
    if (ev.pointerId !== id) return;
    last = ev;
    if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > LONG_PRESS_SLOP) cleanup(); // 스크롤
  };
  const onUp = (ev) => {
    if (ev.pointerId !== id || done) return;
    cleanup();
    onTap && onTap(ev);
  };
  const onCancel = () => cleanup();
  const timer = setTimeout(() => {
    if (done) return;
    cleanup();
    try { navigator.vibrate && navigator.vibrate(10); } catch (err) {}
    onStart(last);
  }, LONG_PRESS_MS);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
}
function endTouchDrag() {
  if (blockTouchScroll) document.removeEventListener('touchmove', touchBlocker, { passive: false });
  blockTouchScroll = false;
  autoScroll.stop();
}

// 드래그 중 화면 위·아래 끝 60px에 닿으면 자동 스크롤(메모·할 일 공용)
const autoScroll = {
  y: null, raf: 0,
  update(y) {
    this.y = y;
    if (!this.raf) this.raf = requestAnimationFrame(() => this.tick());
  },
  tick() {
    this.raf = 0;
    if (this.y == null) return;
    const edge = 60, h = window.innerHeight;
    let dy = 0;
    if (this.y < edge) dy = -Math.ceil((edge - this.y) / 4);
    else if (this.y > h - edge) dy = Math.ceil((this.y - (h - edge)) / 4);
    if (dy) { window.scrollBy(0, dy); this.raf = requestAnimationFrame(() => this.tick()); }
  },
  stop() { this.y = null; if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
};

function onMemoPointerDown(e, m, div) {
  if (div.classList.contains('editing')) return;
  if (e.target.closest('.memo-del')) return;
  if (e.button != null && e.button !== 0) return;
  // 터치: 길게 눌러야 옮기기(메모 위에서도 스크롤 가능, B13). 짧게 누르면 편집
  if (e.pointerType && e.pointerType !== 'mouse') {
    longPress(e, div, {
      onTap: () => startEditMemo(div, m),
      onStart: (ev) => startMemoDrag(ev, m, div),
    });
    return;
  }

  const startX = e.clientX, startY = e.clientY;
  let started = false;

  const onMove = (e2) => {
    if (started) return;
    if (Math.hypot(e2.clientX - startX, e2.clientY - startY) > 5) {
      started = true;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      startMemoDrag(e2, m, div);
    }
  };
  const onUp = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (!started) startEditMemo(div, m);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

const memoDragCtx = {};

function startMemoDrag(e, m, div) {
  if (e.pointerType && e.pointerType !== 'mouse') beginTouchBlock();
  const divRect = div.getBoundingClientRect();

  const ghost = div.cloneNode(true);
  ghost.classList.add('memo-ghost');
  ghost.classList.remove('pressing');
  ghost.classList.remove('dragging');
  ghost.style.left = divRect.left + 'px';
  ghost.style.top = divRect.top + 'px';
  ghost.style.width = divRect.width + 'px';
  document.body.appendChild(ghost);

  const placeholder = document.createElement('div');
  placeholder.className = 'memo-drop-placeholder';

  Object.assign(memoDragCtx, {
    div, m, ghost, placeholder,
    lift: e.pointerType && e.pointerType !== 'mouse' ? 28 : 0,
    offsetX: e.clientX - divRect.left,
    offsetY: e.clientY - divRect.top,
    targetCol: memoCol(m),
    targetIdx: -1,
  });
  div.classList.add('dragging');
  document.addEventListener('pointermove', onMemoDragMove);
  document.addEventListener('pointerup', onMemoDragEnd);
  document.addEventListener('pointercancel', onMemoDragEnd);
}

function onMemoDragMove(e) {
  const { ghost, placeholder, offsetX, offsetY, div } = memoDragCtx;
  autoScroll.update(e.clientY);
  const w = ghost.offsetWidth || 0;
  ghost.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, e.clientX - offsetX)) + 'px';
  ghost.style.top = (e.clientY - offsetY - (memoDragCtx.lift || 0)) + 'px';

  const board = $('#memo-board');
  if (!board) return;
  const colsEls = [...board.querySelectorAll('.memo-col')];
  if (!colsEls.length) return;

  // Find which column horizontally
  let targetCol = colsEls.find((c) => {
    const r = c.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right;
  });
  if (!targetCol) {
    const first = colsEls[0].getBoundingClientRect();
    const last = colsEls[colsEls.length - 1].getBoundingClientRect();
    targetCol = e.clientX < first.left ? colsEls[0] : colsEls[colsEls.length - 1];
  }

  // Find insertion index within the column (excluding dragged + existing placeholder)
  const siblings = [...targetCol.children].filter((el) => el !== div && el !== placeholder);
  let insertIdx = siblings.length;
  for (let i = 0; i < siblings.length; i++) {
    const r = siblings[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { insertIdx = i; break; }
  }

  // Place placeholder
  if (placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
  if (insertIdx >= siblings.length) targetCol.appendChild(placeholder);
  else targetCol.insertBefore(placeholder, siblings[insertIdx]);

  memoDragCtx.targetCol = +targetCol.dataset.col;
  memoDragCtx.targetIdx = insertIdx;
}

async function onMemoDragEnd(e) {
  const cancelled = !!(e && e.type === 'pointercancel'); // 가로채인 터치는 놓기가 아니다 → 저장 안 함(R7)
  endTouchDrag();
  document.removeEventListener('pointermove', onMemoDragMove);
  document.removeEventListener('pointerup', onMemoDragEnd);
  document.removeEventListener('pointercancel', onMemoDragEnd);

  const { div, m, ghost, placeholder, targetCol, targetIdx } = memoDragCtx;
  ghost?.remove();
  placeholder?.remove();
  div?.classList.remove('dragging');
  memoDragCtx.div = null; // 드래그 끝 — 미뤄 둔 다시 그리기를 막지 않게

  if (cancelled) { drawMemos(); return; }
  if (targetIdx < 0) return;

  const newMemos = memosAfterMove(state.memos, m, targetCol, targetIdx, getMemoCols());

  if (sameMemos(newMemos, state.memos)) return;

  try {
    // 화면은 바로 바뀌고(낙관적), 실패하면 원래 자리로 돌아온다
    // 다른 기기 변경을 다시 적용할 때도 같은 이웃 사이에 놓이도록 바로 아래 메모 id를 기억한다
    const cols = getMemoCols();
    const colList = state.memos
      .filter((x) => x.id !== m.id && Math.min(cols - 1, Math.max(0, memoCol(x))) === targetCol)
      .sort((a, b) => memoOrder(a) - memoOrder(b));
    const belowId = colList[targetIdx]?.id || null;
    const aboveId = colList[targetIdx - 1]?.id || null;
    clearLastUndo();
    const pr = memosStore.commit(opMemoMove(m, targetCol, targetIdx, cols, { aboveId, belowId }), { msg: 'memo: move' });
    drawMemos();
    await pr;
  } catch (e) { notifyError(e); drawMemos(); }
}

// 메모 이동 결과 계산.
// 저장하는 col은 항상 PC 기준(0~MEMO_MAX_COLS-1, 봇 cmd_memo_add와 같은 규칙)이고,
// 화면 열 수(모바일 2열)는 그릴 때만 적용한다(A5).
//  - PC(화면 열 = 저장 열): 기존처럼 모든 열을 0,1,2… 로 다시 번호 매김
//  - 열이 합쳐져 보이는 화면(모바일): 옮긴 메모 한 장만 col·order를 바꾸고 나머지는 그대로 둔다.
//    order는 화면상 위·아래 메모의 중간값(소수 가능 — 봇의 order + 1 과도 호환)
function memosAfterMove(memos, m, targetCol, targetIdx, cols) {
  const strip = (x) => { const u = { ...x }; delete u.x; delete u.y; return u; };
  const grouped = Array.from({ length: cols }, () => []);
  memos.forEach((x) => {
    if (x.id === m.id) return;
    const c = Math.min(cols - 1, Math.max(0, memoCol(x)));
    grouped[c].push(x);
  });
  grouped.forEach((arr) => arr.sort((a, b) => memoOrder(a) - memoOrder(b)));

  if (cols >= MEMO_MAX_COLS) {
    grouped[targetCol].splice(targetIdx, 0, m);
    const out = [];
    grouped.forEach((arr, c) => arr.forEach((x, i) => out.push({ ...strip(x), col: c, order: i })));
    return out;
  }

  const colArr = grouped[targetCol];
  const above = colArr[targetIdx - 1];
  const below = colArr[targetIdx];
  let order;
  if (!above && !below) order = 0;
  else if (!above) order = memoOrder(below) - 1;
  else if (!below) order = memoOrder(above) + 1;
  else order = (memoOrder(above) + memoOrder(below)) / 2;

  // 마지막 화면 열은 저장 열 여러 개가 합쳐진 곳 — 원래 그 범위에 있던 메모는 원래 열을 유지
  const orig = Math.min(MEMO_MAX_COLS - 1, Math.max(0, memoCol(m)));
  const col = (targetCol === cols - 1 && orig >= targetCol) ? orig : targetCol;
  return memos.map((x) => (x.id === m.id ? { ...strip(x), col, order } : x));
}

function sameMemos(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    const x = a[i], y = b.find((q) => q.id === x.id);
    if (!y) return false;
    if ((y.col ?? y.x ?? 0) !== x.col) return false;
    if ((y.order ?? y.y ?? 0) !== x.order) return false;
  }
  return true;
}

function startEditMemo(div, m) {
  // 누르는 도중 보드가 다시 그려져(앞 편집 저장·재적용 등) 눌렀던 카드가 떨어져 나갔으면 같은 id의 지금 카드로(B-8)
  if (!div.isConnected) {
    div = document.querySelector(`.memo[data-id="${m.id}"]`);
    m = state.memos.find((x) => x.id === m.id) || m;
    if (!div) return;
  }
  if (div.classList.contains('editing')) return;
  const textEl = div.querySelector('.memo-text');
  if (!textEl) return;
  div.classList.add('editing');
  textEl.setAttribute('contenteditable', 'plaintext-only');
  textEl.focus();
  const range = document.createRange();
  range.selectNodeContents(textEl);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  let committing = false;
  const finish = async (commit) => {
    if (committing) return;
    committing = true;
    if (div.dataset.deleting) { // 지우는 중 — 저장하지 않고 정리만
      textEl.removeEventListener('blur', onBlur);
      textEl.removeEventListener('keydown', onKey);
      return;
    }
    textEl.removeEventListener('blur', onBlur);
    textEl.removeEventListener('keydown', onKey);
    textEl.removeAttribute('contenteditable');
    div.classList.remove('editing');
    const newText = textEl.textContent.trim();
    const cur = state.memos.find((x) => x.id === m.id) || m;
    if (!commit) { textEl.textContent = cur.text || ''; runDeferredRender(); return; }
    if (newText === (cur.text || '')) { runDeferredRender(); return; }
    // 메모를 비우면 지운다(되돌리기 제공, A10)
    if (!newText) {
      runDeferredRender();
      return deleteMemoWithUndo(cur);
    }
    await saveMemoText(m.id, newText);
    runDeferredRender();
  };
  const onBlur = () => finish(true);
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); finish(false); textEl.blur(); }
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); textEl.blur(); }
  };
  textEl.addEventListener('blur', onBlur);
  textEl.addEventListener('keydown', onKey);
}

// 메모 글 저장. 실패해도 화면의 글을 유지(저장 안 됨 · 다시 시도는 헤더 알약)
async function saveMemoText(id, text) {
  clearLastUndo(); // 마지막 동작이 바뀜 → 그 전 동작은 Cmd/Ctrl+Z로 무르지 않음
  try {
    await memosStore.apply(opMemoEdit(id, text), { msg: 'memo: edit', onFail: 'keep' });
  } catch (e) {
    if (e && e.gone) { notifyError(e); drawMemos(); return; }
    notifyError(e); // 다시 시도는 헤더 알약 하나로(D10①)
  }
}

// 기존 메모를 지우고 되돌리기를 준다(원래 col/order 그대로 복원)
async function deleteMemoWithUndo(memo) {
  try {
    const card = document.querySelector(`.memo[data-id="${memo.id}"]`);
    const pr = memosStore.commit(opMemoDelete(memo.id), { msg: 'memo: delete' });
    vanishRows(card ? [card] : [], drawMemos); // 사라지는 모션 통일(C1과 같은 리듬)
    await pr;
    notify.undo('메모를 지웠어요', async () => {
      try {
        const pr2 = memosStore.commit(opMemoRestore(memo), { msg: 'memo: undo delete' });
        drawMemos();
        await pr2;
      } catch (e) { drawMemos(); notifyError(e); }
    });
  } catch (e) { drawMemos(); notifyError(e); }
}


async function onDeleteMemo(id) {
  const m = state.memos.find((x) => x.id === id);
  if (!m) return;
  return deleteMemoWithUndo(m);
}

function bindBarEvents() {
  $('#bar-select-all')?.addEventListener('click', () => {
    const all = state.inboxItems.length;
    if (selectedInbox.size === all) {
      selectedInbox.clear();
    } else {
      state.inboxItems.forEach((i) => selectedInbox.add(i.key));
    }
    renderInbox();
  });
  $('#bar-high')?.addEventListener('click', () => onBulkMove('high'));
  $('#bar-med')?.addEventListener('click',  () => onBulkMove('medium'));
  $('#bar-low')?.addEventListener('click',  () => onBulkMove('low'));
  $('#bar-delete')?.addEventListener('click', onBulkDelete);
}

async function onMoveToActive(item, priority) {
  const rows = inboxRowsFor([item]);
  const work = moveInboxToActive([item], priority);
  selectedInbox.clear();
  vanishRows(rows, renderInbox);
  offerUndo(`${PRI[priority].icon} ${PRI[priority].to} 보냈어요`, work, () => undoMoveToActive([item], priority, work.rec));
  try {
    await work;
  } catch (e) {
    renderInbox();
    flashInboxRows([item]);
    notifyTransferError(e, () => onMoveToActive(item, priority));
  }
}

async function onBulkMove(priority) {
  const items = state.inboxItems.filter((i) => selectedInbox.has(i.key));
  if (!items.length) return;
  const rows = inboxRowsFor(items);
  const work = moveInboxToActive(items, priority);
  selectedInbox.clear();
  vanishRows(rows, renderInbox);
  offerUndo(`${items.length}개를 ${PRI[priority].icon} ${PRI[priority].to} 보냈어요`, work, () => undoMoveToActive(items, priority, work.rec));
  try {
    await work;
  } catch (e) {
    renderInbox();
    flashInboxRows(items);
    notifyTransferError(e, () => { items.forEach((i) => selectedInbox.add(i.key)); onBulkMove(priority); });
  }
}

// Inbox → Task: Task에 먼저 넣고 Inbox에서 뺀다. 뺄 때 실패하면 Task에서 다시 빼서
// 항목은 Inbox 한 곳에만 남는다(A4)
function moveInboxToActive(items, priority) {
  const texts = items.map((i) => i.text);
  const rec = {};
  const work = runTransfer({
    adds: [{
      store: activeStore,
      op: opAppendMany(priority, texts, rec),
      undo: opActiveRemoveRec(rec),
      msg: items.length === 1 ? `inbox → active: ${texts[0]}` : `inbox → active (${items.length}개)`,
    }],
    remove: removeStep('inboxRemove', [items], `remove ${items.length} from inbox`, [{ k: 'activeHas', key: priority, texts }]),
  });
  work.rec = rec; // 분류 되돌리기가 Task에 넣은 그 줄만 지우게
  return work;
}

// ---- 행이 사라지는 모션 + 그 자리 탭 무시(C1) ----
// 누르는 즉시 행이 빠지면 아래 행이 손가락 밑으로 올라와 연타가 다음 항목에 들어갔다(B-1).
// 사라지는 행: 내용 120ms 페이드 → 빈 자리 300ms 유지 → 200ms 접힘, 그 뒤 다시 그린다.
// 그 행이 있던 자리의 탭만 650ms 무시(전역 잠금 없음 — 다른 행은 바로 누를 수 있음)
const tapGuards = [];
let swallowClickUntil = 0;
function guardTapsAt(el, ms = 650) {
  const r = el.getBoundingClientRect();
  tapGuards.push({ left: r.left, right: r.right, top: r.top + window.scrollY, bottom: r.bottom + window.scrollY, until: Date.now() + ms });
}
document.addEventListener('pointerdown', (e) => {
  const now = Date.now();
  for (let i = tapGuards.length - 1; i >= 0; i--) if (tapGuards[i].until < now) tapGuards.splice(i, 1);
  if (!tapGuards.length) return;
  // 떠 있는 요소(토스트·입력창·선택 바·시트)는 막지 않는다 — 되돌리기 버튼 등
  if (e.target.closest && e.target.closest('#toast, #composer, .inbox-bar, #sheet, #scrim, header, .tabs')) return;
  const y = e.clientY + window.scrollY;
  if (tapGuards.some((g) => e.clientX >= g.left && e.clientX <= g.right && y >= g.top && y <= g.bottom)) {
    e.preventDefault();
    e.stopPropagation();
    swallowClickUntil = now + 800;
  }
}, true);
document.addEventListener('click', (e) => {
  if (Date.now() < swallowClickUntil && !(e.target.closest && e.target.closest('#toast, #composer, .inbox-bar, #sheet'))) {
    swallowClickUntil = 0;
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

function vanishRows(rows, render) {
  rows = rows.filter((r) => r && r.isConnected);
  if (!rows.length || prefersReducedMotion()) {
    rows.forEach((r) => guardTapsAt(r));
    render();
    return;
  }
  rows.forEach((r) => {
    guardTapsAt(r);
    r.style.maxHeight = r.offsetHeight + 'px';
    r.classList.add('vanish');
  });
  setTimeout(() => rows.forEach((r) => r.classList.add('vanish-collapse')), 420); // 120 페이드 + 300 유지
  setTimeout(render, 620);
}
const inboxRowsFor = (items) => {
  const keys = new Set(items.map((i) => i.key));
  return [...document.querySelectorAll('#inbox-list .inbox-item')].filter((r) => keys.has(r.dataset.key));
};
const archiveRowsFor = (ids) => [...document.querySelectorAll('#archive-list .archive-item')].filter((r) => ids.includes(r.dataset.id));
// 항목(지문) 하나의 지금 행 — 글이 아니라 locate로 찾은 줄 번호로(S15: 같은 글의 다른 행까지 사라지던 문제)
function taskRowFor(item) {
  let idx;
  try { idx = resolveLineIndex(item); } catch (e) { return null; }
  return document.querySelector(`#sections .task[data-line="${idx}"]`);
}

// 실패 후 원래 자리로 돌아온 Task 행을 600ms 깜빡여 알려 준다(B9)
// 지문(항목·기록)이면 그 행만, 글이면 같은 글 행 모두(R21: 화면 글자가 아니라 원문 key)
function flashTaskRows(keys) {
  keys.forEach((k) => {
    if (k && typeof k === 'object') { const row = taskRowFor(k); if (row) flashEl(row); return; }
    const t = String(k).trim();
    document.querySelectorAll('#sections .task').forEach((row) => { if (row.dataset.key === t) flashEl(row); });
  });
}
function flashArchiveRows(ids) {
  document.querySelectorAll('#archive-list .archive-item').forEach((row) => {
    if (ids.includes(row.dataset.id)) flashEl(row);
  });
}
function flashEl(el) {
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

// 실패 후 원래 자리로 돌아온 Inbox 행을 600ms 깜빡여 알려 준다
function flashInboxRows(items) {
  const texts = new Set(items.map((i) => i.text));
  document.querySelectorAll('#inbox-list .inbox-item').forEach((row) => {
    if (texts.has(row.querySelector('.inbox-text')?.textContent)) {
      row.classList.remove('flash');
      void row.offsetWidth;
      row.classList.add('flash');
    }
  });
}

function archiveInboxItems(items) {
  const entries = items.map((i) => ({
    id: genArchiveId(),
    deletedAt: new Date().toISOString(),
    source: 'inbox',
    text: i.text,
  }));
  const work = runTransfer({
    adds: [{ store: archiveStore, op: opArchiveAdd(entries), undo: opArchiveRemove(entries.map((e) => e.id)),
      msg: `archive ${items.length} from inbox` }],
    remove: removeStep('inboxRemove', [items], `archive ${items.length} from inbox`, [{ k: 'archiveHas', ids: entries.map((e) => e.id) }]),
  });
  return { work, entries };
}

// ---- 되돌리기 (B1) ----
// 보관·분류·메모 삭제는 확인창 없이 바로 저장하고, 되돌리기는 "반대 연산"을 다시 저장한다
// (지연 저장이 아니라서 그 사이 앱을 닫아도 유실이 없다). 확인창은 영구 삭제·토큰 재입력만.

// Inbox 항목을 원래 줄 위치 근처로 되돌려 넣기(lineIdx 순서대로). rec: 넣은 줄의 지문
const opInboxInsert = (items, rec = null) => (c) => {
  const lines = (c || '').split('\n');
  const ats = [];
  [...items].sort((a, b) => a.lineIdx - b.lineIdx).forEach((it) => {
    const at = Math.max(0, Math.min(it.lineIdx, lines.length));
    lines.splice(at, 0, `- ${it.text}`);
    for (let k = 0; k < ats.length; k++) if (ats[k] >= at) ats[k]++;
    ats.push(at);
  });
  let out = lines.join('\n');
  if (!out.endsWith('\n')) out += '\n';
  if (rec) { const ls = out.split('\n'); rec.fps = ats.map((a) => lineFp(ls, a, INBOX_LOC)); }
  return out;
};

// Inbox → Task 분류 되돌리기: Inbox 원래 자리에 다시 넣고 Task에서 뺀다
function undoMoveToActive(items, priority, moved) {
  const texts = items.map((i) => i.text);
  const rec = {};
  return runTransfer({
    adds: [{ store: inboxStore, op: opInboxInsert(items, rec), undo: opInboxRemoveRec(rec), msg: `undo inbox → active (${items.length})` }],
    // Task에서는 분류할 때 넣은 그 줄(지문)만 지운다 — 같은 글의 원래 항목은 건드리지 않음
    remove: removeStep('activeRemoveAppended', [priority, texts, (moved && moved.fps) || []], `undo inbox → active (${items.length})`, [{ k: 'inboxHas', texts }]),
  });
}

// Inbox 보관 되돌리기: Inbox 원래 자리에 다시 넣고 보관함에서 뺀다
function undoArchiveInbox(items, entries) {
  const rec = {};
  return runTransfer({
    adds: [{ store: inboxStore, op: opInboxInsert(items, rec), undo: opInboxRemoveRec(rec), msg: `undo archive (${items.length})` }],
    remove: removeStep('archiveRemove', [entries.map((e) => e.id)], `undo archive (${items.length})`, [{ k: 'inboxHas', texts: items.map((i) => i.text) }]),
  });
}

// 되돌리기 토스트. 원래 동작(work)이 끝난 뒤에만 반대 연산을 실행한다
// (원래 동작이 실패해 이미 원위치됐으면 아무것도 하지 않음 → 중복 방지)
function offerUndo(msg, work, inverse) {
  notify.undo(msg, async () => {
    try { await work; } catch (e) { return; }
    try {
      await inverse();
      renderCurrent();
    } catch (e) {
      renderCurrent();
      notifyTransferError(e, () => inverse().then(renderCurrent));
    }
  });
}

async function onBulkDelete() {
  const items = state.inboxItems.filter((i) => selectedInbox.has(i.key));
  if (!items.length) return;
  const run = async () => {
    const rows = inboxRowsFor(items);
    const { work, entries } = archiveInboxItems(items);
    selectedInbox.clear();
    vanishRows(rows, renderInbox);
    offerUndo(`${items.length}개를 보관함으로 옮겼어요`, work, () => undoArchiveInbox(items, entries));
    try {
      await work;
    } catch (e) {
      renderInbox();
      flashInboxRows(items);
      notifyTransferError(e, run);
    }
  };
  return run();
}

async function onDeleteFromInbox(item) {
  const run = async () => {
    const rows = inboxRowsFor([item]);
    const { work, entries } = archiveInboxItems([item]);
    selectedInbox.clear();
    vanishRows(rows, renderInbox);
    offerUndo('보관함으로 옮겼어요', work, () => undoArchiveInbox([item], entries));
    try {
      await work;
    } catch (e) {
      renderInbox();
      flashInboxRows([item]);
      notifyTransferError(e, run);
    }
  };
  return run();
}

function bindTabEvents() {
  renderSync(); // 헤더가 새로 그려졌으니 저장 표시를 현재 상태로
  // 탭 본문을 tabpanel로 연결(R17)
  const tabsEl = document.querySelector('.tabs');
  const panel = tabsEl && tabsEl.nextElementSibling;
  if (panel) {
    panel.id = panel.id || 'tabpanel';
    panel.setAttribute('role', 'tabpanel');
    const active = tabsEl.querySelector('.tab.active');
    if (active) { panel.setAttribute('aria-labelledby', active.id); tabsEl.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-controls', panel.id)); }
  }
  // 탭 목록: ←→·Home·End로 이동(roving tabindex, D3·R17)
  tabsEl?.addEventListener('keydown', (e) => {
    if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
    const tabs = [...document.querySelectorAll('.tabs .tab')];
    const i = tabs.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    const next = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs[tabs.length - 1]
      : tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    next.click();
    document.getElementById(next.id)?.focus();
  });
  const clearAll = () => {
    selectedInbox.clear(); updateInboxBar();
    selectedArchive.clear(); updateArchiveBar();
  };
  $('#tab-active')?.addEventListener('click', () => { currentTab = 'active'; clearAll(); renderApp(); });
  $('#tab-inbox')?.addEventListener('click', () => { currentTab = 'inbox'; clearAll(); renderInbox(); });
  $('#tab-memo')?.addEventListener('click', () => { currentTab = 'memo'; clearAll(); renderMemos(); });
  $('#tab-archive')?.addEventListener('click', () => { currentTab = 'archive'; clearAll(); renderArchive(); });
}

// ============ Rendering ============
// 네 탭이 공유하는 헤더·탭 줄. 탭 이름·배지·저장 표시는 여기 한 곳만 고친다.
const TABS = [['active', 'Task'], ['inbox', 'Inbox'], ['memo', 'Memo'], ['archive', 'Archive']];

// 지금 보고 있는 탭을 다시 그린다(탭 배지 등 공용 영역까지 함께 갱신)
function renderCurrent() {

// ============ 저장 상태 관리자 (F2) ============
// 네 파일의 저장 진행·실패를 한 곳에서 관리한다. 저장 표시(pill)는 이 상태만 보고 그린다(A7).
//  - loading: 첫 불러오기 중 → 스켈레톤
//  - pending[file] > 0: 저장 중
//  - errors[file]: 실패. 같은 파일 저장이 성공하거나 "다시 시도"가 성공할 때까지 유지(탭을 옮겨도 남음)
const syncStatus = {
  loading: true,
  loadError: false,
  pending: {},
  errors: {},
  retry: {},           // file → 다시 시도 함수(있으면). F3 스토어가 등록한다.
  savingSince: 0,
  start(file) {
    if (!this.saving) {
      this.savingSince = Date.now();
      // 0.6초 넘게 걸릴 때만 "저장 중"을 보인다
      clearTimeout(this.slowTimer);
      this.slowTimer = setTimeout(renderSync, 620);
    }
    this.pending[file] = (this.pending[file] || 0) + 1;
    renderSync();
  },
  end(file) { this.pending[file] = Math.max(0, (this.pending[file] || 0) - 1); renderSync(); },
  ok(file) { delete this.errors[file]; this.end(file); },
  fail(file) { this.errors[file] = true; this.end(file); },
  get saving() { return Object.values(this.pending).some((n) => n > 0); },
  get hasError() { return this.loadError || Object.keys(this.errors).length > 0; },
};

async function retryFailedSaves() {
  if (syncStatus.loadError) { await initialLoad(); return; }
  const files = Object.keys(syncStatus.errors);
  const fns = files.map((f) => syncStatus.retry[f]).filter(Boolean);
  if (fns.length) {
    await Promise.all(fns.map((fn) => Promise.resolve().then(fn).catch(() => {})));
  } else {
    // 다시 보낼 변경이 따로 남아 있지 않으면 저장소 기준으로 새로 불러와 화면을 맞춘다
    files.forEach((f) => delete syncStatus.errors[f]);
    await refresh();
  }
  renderSync();
}

function syncPillHTML() {
  return `<span class="sync-pill" id="sync-pill"><span class="dot" aria-hidden="true"></span><span></span></span>`;
}
// 저장 상태 알림은 #app 밖 고정 영역 하나로 읽힌다(R17 — 렌더마다 새로 만들어지는 live 영역은 알림이 빠질 수 있었다)
let lastAnnounced = '';
function announce(text) {
  const el = document.getElementById('sr-status');
  if (!el || text === lastAnnounced) return;
  lastAnnounced = text;
  el.textContent = text;
}
const isOffline = () => typeof navigator !== 'undefined' && navigator.onLine === false;

function renderSync() {
  const el = $('#sync-pill');
  if (!el) return;
  el.classList.remove('saving', 'error', 'offline', 'show');
  el.onclick = null;
  el.onkeydown = null;
  el.setAttribute('role', 'status');
  el.removeAttribute('tabindex');
  const label = el.lastElementChild;
  const slow = syncStatus.saving && Date.now() - syncStatus.savingSince >= 600;
  if (isOffline()) {
    el.classList.add('offline', 'show');
    label.textContent = '오프라인';
  } else if (syncStatus.hasError) {
    el.classList.add('error', 'show');
    label.textContent = syncStatus.loadError ? '불러오지 못함 · 다시 시도' : '저장 안 됨 · 다시 시도';
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    el.onclick = retryFailedSaves;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); retryFailedSaves(); } };
  } else if (slow) {
    el.classList.add('saving', 'show');
    label.textContent = '저장 중';
  } else {
    // 평소·저장 완료: 비워 둠(200ms 페이드). 첫 로딩은 스켈레톤이 대신한다
    label.textContent = syncStatus.saving ? '저장 중' : '';
    if (syncStatus.saving) el.classList.add('saving');
  }
  announce(el.classList.contains('show') ? label.textContent : '');
}

// 첫 로딩 스켈레톤 — 섹션마다 회색 줄 3개

// 완료된 최상위 할 일을 블록(하위 포함) 단위로 한 번에 보관함 이동
async function onBulkArchiveDone() {
  const targets = [];
  state.sections.forEach((sec) => {
    const priority = Object.keys(SECTION_KEYS).find((k) => SECTION_KEYS[k] === sec.title) || 'medium';
    sec.items.forEach((i) => {
      if (i.type === 'task' && i.checked && i.indent === 0 && i.text.trim()) {
        targets.push({ ...i, priority }); // 섹션·부모·순번 단서까지 함께(Q1·Q2)
      }
    });
  });
  if (!targets.length) return;
  try {
    const lines = state.content.split('\n');
    const positions = [];
    const entries = targets.map((t) => {
      const { start, end } = extractBlock(lines, t.lineIndex);
      const mid = [...lines.slice(0, start), ...lines.slice(end + 1)];
      positions.push({ start, block: lines.slice(start, end + 1), anchor: anchorAt(mid, start) });
      return {
        id: genArchiveId(),
        deletedAt: new Date().toISOString(),
        source: 'active',
        priority: t.priority,
        block: lines.slice(start, end + 1),
      };
    });
    // 보관함에 먼저 넣고, Task에서는 원문 줄로 다시 찾아 지운다(뒤에서부터). 실패하면 보관함에서 다시 뺌(A4)
    const work = runTransfer({
      adds: [{ store: archiveStore, op: opArchiveAdd(entries), undo: opArchiveRemove(entries.map((e) => e.id)),
        msg: `archive ${entries.length} done tasks` }],
      remove: removeStep('activeDeleteBlocks', [targets], `archive ${entries.length} done tasks (from active)`,
        [{ k: 'archiveHas', ids: entries.map((e) => e.id) }]),
    });
    renderApp();
    // 되돌리면 각 항목을 원래 자리로(위에서부터 차례로 넣어 앞 항목이 다음 항목의 기준 줄이 됨)
    offerUndo(`${entries.length}개를 보관함으로 옮겼어요`, work, () => undoBulkArchive(entries, positions));
    await work;
    return entries;
  } catch (e) { renderApp(); notifyTransferError(e, onBulkArchiveDone); }
}

// Task 보관 되돌리기: 원래 기준 줄(지문) 바로 아래로 다시 넣는다. 기준 줄을 정확히 못 찾으면 일반 복구 규칙(섹션 끝·부모 아래)
// ats(선택): 넣은 블록 첫 줄 번호를 모은다(실패 되돌림 기록용)
const opActiveReinsert = (entry, pos, ats = null) => (c) => {
  const lines = c.split('\n');
  let at = -1;
  try { at = anchorIndex(lines, pos.anchor); } catch (e) { at = -1; }
  if (at >= 0) lines.splice(at, 0, ...pos.block);
  else at = restoreBlockInto(lines, entry);
  if (ats) { for (let k = 0; k < ats.length; k++) if (ats[k] >= at) ats[k] += pos.block.length; ats.push(at); }
  return lines.join('\n');
};
async function undoBulkArchive(entries, positions) {
  const order = entries.map((e, i) => ({ e, p: positions[i] })).sort((a, b) => a.p.start - b.p.start);
  const rec = {};
  try {
    await runTransfer({
      adds: [{
        store: activeStore,
        op: (c) => {
          const ats = [];
          const out = order.reduce((acc, { e, p }) => opActiveReinsert(e, p, ats)(acc), c);
          rec.fps = recFps(out.split('\n'), ats);
          return out;
        },
        undo: opActiveRemoveRec(rec),
        msg: `undo archive: restore ${entries.length}`,
      }],
      remove: removeStep('archiveRemove', [entries.map((e) => e.id)], `undo archive: ${entries.length}`, restoreVerify(entries)),
    });
    renderCurrent();
  } catch (e) { renderCurrent(); notifyTransferError(e, () => undoBulkArchive(entries, positions)); }
}

function undoArchiveTask(entry, pos) {
  const rec = {};
  const op = (c) => { const ats = []; const out = opActiveReinsert(entry, pos, ats)(c); rec.fps = recFps(out.split('\n'), ats); return out; };
  return runTransfer({
    adds: [{ store: activeStore, op, undo: opActiveRemoveRec(rec), msg: 'undo archive' }],
    remove: removeStep('archiveRemove', [[entry.id]], 'undo archive', restoreVerify([entry])),
  });
}

// 보관함 항목을 원래 자리로 되돌리고 보관함에서 뺀다(복구·되돌리기 공용)
function restoreEntries(entries) {
  return runTransfer({
    adds: restoreAdds(entries),
    remove: removeStep('archiveRemove', [entries.map((e) => e.id)], `restore ${entries.length}`, restoreVerify(entries)),
  });
}


function renderApp() {
  if (!state.token) { renderSetup(); return; }
  const app = $('#app');
  // 다시 그려도 키보드 포커스를 같은 줄에 남긴다(D2)
  const ae = document.activeElement;
  const focusRow = ae && ae.closest && ae.closest('#sections .task');
  const focusKey = focusRow ? { key: focusRow.dataset.key, kind: ae.matches('input[type="checkbox"]') ? 'cb' : 'text' } : null;
  const focusSection = ae && ae.closest && (ae.closest('#sections .done-fold') || focusRow) ? ae.closest('.section')?.classList[1] : null;
  // 헤더 진행률(C4): 하위까지 세던 "4/17 완료"는 "완료 항목 보관 n"(상위 기준)과 숫자가 안 맞았다.
  // 상위 할 일 기준 남은 개수 하나만 보여 준다
  const remaining = state.sections.reduce((acc, s) => {
    return acc + s.items.filter((i) => i.type === 'task' && i.indent === 0 && !i.checked && i.text.trim()).length;
  }, 0);

  app.innerHTML = `
    ${renderShell('active', {
      // 저장 실패 알약이 떠도 "남은 할 일 n"은 잘리지 않게 날짜 쪽만 줄어든다(다듬기)
      meta: `<span class="meta-date">${fmtDate(new Date())} ·</span> <span class="meta-count">${remaining ? `남은 할 일 ${remaining}` : '남은 할 일 없음'}</span>`,
    })}
    <div id="sections"></div>
  `;
  bindTabEvents();

  const root = $('#sections');
  if (syncStatus.loading && !state.sections.length) {
    root.innerHTML = skeletonHTML();
    setComposerMode('active');
    return;
  }
  ['high','medium','low'].forEach((key) => {
    const sec = findSectionByKey(key);
    if (!sec) return;
    const cls = key === 'high' ? 'pri-high' : key === 'medium' ? 'pri-med' : 'pri-low';
    const realItems = sec.items.filter((i) => (i.type === 'task' || i.type === 'bullet') && i.text.trim());
    const taskCount = sec.items.filter((i) => i.type === 'task' && i.text.trim()).length;

    const div = document.createElement('div');
    div.className = `section ${cls}`;
    const secIcon = PRI[key].icon;
    div.innerHTML = `
      <div class="section-title">
        <span class="sec-ic" aria-hidden="true">${secIcon}</span>${PRI[key].label}
        ${taskCount ? `<span class="count">${taskCount}</span>` : ''}
      </div>
      <div class="card"></div>
    `;
    const card = div.querySelector('.card');
    if (realItems.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = `${PRI[key].icon} 비어 있어요`;
      card.appendChild(e);
    } else {
      // 완료된 상위 할 일(하위 포함)은 섹션 아래 "완료 n개" 접기 행으로 모은다(B3).
      // 방금 체크한 항목은 800ms 동안 제자리에 머문다(lingering)
      const blocks = splitBlocks(sec.items.filter((i) => (i.type === 'task' || i.type === 'bullet') && i.text.trim()));
      const isDoneBlock = (b) => b.root.type === 'task' && b.root.checked && !doneLinger.has(lingerKey(b.root));
      const open = blocks.filter((b) => !isDoneBlock(b));
      const done = blocks.filter(isDoneBlock);
      appendRows(card, open.flatMap((b) => [b.root, ...b.children]), key);
      if (done.length) {
        // 드래그 "섹션 끝"은 미완료 마지막 블록 바로 뒤로. 그 다음 줄이 (완료) 항목이면 그 앞에 넣는다
        const lastOpen = open[open.length - 1];
        const lastLine = lastOpen ? (lastOpen.children.length ? lastOpen.children[lastOpen.children.length - 1] : lastOpen.root).lineIndex : null;
        const nextItem = lastLine == null ? done[0].root : sec.items.find((i) => i.lineIndex === lastLine + 1);
        if (nextItem) div.dataset.firstDone = nextItem.lineIndex;
        const expanded = isDoneOpen(key);
        const fold = document.createElement('button');
        fold.type = 'button';
        fold.className = 'done-fold';
        fold.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        const prev = lastDoneCount[key];
        fold.innerHTML = `<span>완료 <span class="done-n">${done.length}</span>개</span><span aria-hidden="true">${expanded ? '⌄' : '›'}</span>`;
        if (prev != null && done.length > prev) fold.querySelector('.done-n').classList.add('bump');
        fold.addEventListener('click', () => { setDoneOpen(key, !expanded); renderApp(); });
        card.appendChild(fold);
        if (expanded) appendRows(card, done.flatMap((b) => [b.root, ...b.children]), key);
      }
      lastDoneCount[key] = done.length;
    }
    root.appendChild(div);
  });
  setComposerMode('active');
  restoreTaskFocus(focusKey, focusSection);
}

function restoreTaskFocus(focusKey, sectionCls) {
  if (focusKey) {
    const row = [...document.querySelectorAll('#sections .task')].find((r) => r.dataset.key === focusKey.key);
    if (row) {
      const el = focusKey.kind === 'cb' ? row.querySelector('input[type="checkbox"]') : row.querySelector('.task-text');
      el?.focus({ preventScroll: true });
      return;
    }
  }
  // 완료되어 접기 행 속으로 들어갔거나 접기 행을 눌렀으면 그 섹션의 접기 행으로
  if (sectionCls) document.querySelector(`#sections .section.${sectionCls} .done-fold`)?.focus({ preventScroll: true });
}


// 상위 항목 + 그 하위들을 한 블록으로 묶는다(섹션이 들여쓴 줄로 시작해도 버리지 않음)
function splitBlocks(items) {
  const blocks = [];
  let cur = null;
  for (const item of items) {
    if (item.indent === 0 || !cur) { cur = { root: item, children: [] }; blocks.push(cur); }
    else cur.children.push(item);
  }
  return blocks;
}

// 행 그리기(접힌 부모 아래는 생략)
function appendRows(card, rows, key) {
  let collapseAtIndent = null; // 접힌 조상의 indent (그보다 깊은 항목은 숨김)
  rows.forEach((item, idx) => {
    if (collapseAtIndent !== null && item.indent <= collapseAtIndent) collapseAtIndent = null;
    if (collapseAtIndent !== null) return;
    const next = rows[idx + 1];
    const hasChildren = !!next && next.indent > item.indent;
    const collapsedNow = hasChildren && isCollapsed(item);
    if (item.type === 'task') {
      let hiddenCount = 0;
      if (collapsedNow) {
        for (let j = idx + 1; j < rows.length && rows[j].indent > item.indent; j++) hiddenCount++;
      }
      card.appendChild(renderTask(item, key, { hasChildren, collapsed: collapsedNow, hiddenCount }));
    } else {
      const b = document.createElement('div');
      b.className = `bullet indent-${Math.min(item.indent, 3)}`;
      b.textContent = '• ' + item.text;
      card.appendChild(b);
    }
    if (collapsedNow) collapseAtIndent = item.indent;
  });
}

// ---- 완료 접기(B3) ----
const DONE_OPEN_KEY = lsKey('tako_done_open');
let doneOpen = {};
try { doneOpen = JSON.parse(localStorage.getItem(DONE_OPEN_KEY) || '{}') || {}; } catch (e) { doneOpen = {}; }
function isDoneOpen(key) { return !!doneOpen[key]; } // 기본 접힘
function setDoneOpen(key, v) {
  doneOpen[key] = v;
  try { localStorage.setItem(DONE_OPEN_KEY, JSON.stringify(doneOpen)); } catch (e) {}
}
const lastDoneCount = {};
// 체크 후 800ms 머무름: 그동안 다시 누르면 아무 일도 없던 것처럼(취소)
const DONE_LINGER_MS = 800;
// 머무는 항목들(key 집합). 접기 타이머는 하나뿐 — 체크가 들어올 때마다 "마지막 체크 + 800ms"로 미뤄
// 한꺼번에 접는다(R9: 따로 접히면 연속 체크 중에 아래 행이 올라와 엉뚱한 행이 체크됐다)
const doneLinger = new Set();
let lingerTimer = null;
const lingerKey = (item) => item.text.trim();
function scheduleFold() {
  clearTimeout(lingerTimer);
  if (!doneLinger.size) return;
  lingerTimer = setTimeout(() => {
    const keys = [...doneLinger];
    const rows = [...document.querySelectorAll('#sections .task')].filter((r) => keys.includes(r.dataset.key));
    const finish = () => { keys.forEach((k) => doneLinger.delete(k)); if (currentTab === 'active' && !dragCtx.active) renderApp(); };
    if (rows.length && !prefersReducedMotion()) {
      // 200ms에 접히며 들어감 → 다시 그림
      rows.forEach((row) => { row.style.maxHeight = row.offsetHeight + 'px'; });
      void document.body.offsetHeight;
      rows.forEach((row) => row.classList.add('leaving'));
      setTimeout(finish, 200);
    } else finish();
  }, DONE_LINGER_MS);
}
function startLinger(item) {
  doneLinger.add(lingerKey(item));
  scheduleFold();
}
function cancelLinger(item) {
  doneLinger.delete(lingerKey(item));
  scheduleFold();
}
// 다른 체크(하위·해제 포함)가 들어와도 접기를 미룬다
function postponeFold() { if (doneLinger.size) scheduleFold(); }
function prefersReducedMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

// 드래그한 행만 놓은 뒤 잠깐 클릭을 무시(R13 — 전역으로 막으면 다른 할 일을 바로 눌러도 무반응이었다)
// 놓는 순간 목록이 다시 그려져 행 요소가 바뀌므로 행 key(글)로 기억한다
const suppressedRows = new Map();
const suppressRowClick = (row, ms) => { if (row && row.dataset.key) suppressedRows.set(row.dataset.key, Date.now() + ms); };
const rowClickSuppressed = (row) => !!row && (suppressedRows.get(row.dataset.key) || 0) > Date.now();

function renderTask(item, key, opts = {}) {
  const { hasChildren = false, collapsed = false, hiddenCount = 0 } = opts;
  const t = document.createElement('div');
  t.className = `task indent-${Math.min(item.indent, 3)}` + (item.checked ? ' done' : '');
  t.dataset.line = item.lineIndex;
  t.dataset.indent = item.indent;
  t.dataset.key = lingerKey(item);
  t.dataset.raw = item.raw; // 원문 줄(R21) — 새 행 찾기·깜빡임에 사용

  // 접기/펼치기 토글 — 자식 있는 항목만 화살표, 나머지는 정렬용 빈 자리
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'task-toggle' + (hasChildren ? '' : ' leaf');
  if (hasChildren) {
    toggle.textContent = collapsed ? '▸' : '▾';
    toggle.title = collapsed ? '펼치기' : '접기';
    toggle.setAttribute('aria-label', toggle.title);
    toggle.addEventListener('click', (e) => { e.stopPropagation(); toggleCollapse(item); });
  } else {
    toggle.tabIndex = -1;
  }

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = item.checked;
  cb.setAttribute('aria-label', `완료: ${item.text}`);
  cb.addEventListener('change', (e) => {
    if (e.target.checked) {
      cb.classList.remove('pop');
      void cb.offsetWidth; // reflow로 애니메이션 재시작
      cb.classList.add('pop');
    }
    onToggle(item, e.target.checked, t, cb);
  });

  const span = document.createElement('div');
  span.className = 'task-text';
  span.innerHTML = highlightMeta(item.text);
  if (collapsed && hiddenCount) {
    const badge = document.createElement('span');
    badge.className = 'child-count';
    badge.textContent = hiddenCount;
    badge.title = `숨겨진 하위 항목 ${hiddenCount}개`;
    span.appendChild(badge);
  }
  span.title = '눌러서 고치기';
  // 키보드: Tab으로 글에 가서 Enter(또는 Space)로 편집 시트(D1)
  span.tabIndex = 0;
  span.setAttribute('role', 'button');
  span.setAttribute('aria-label', `고치기: ${item.text}`);
  span.addEventListener('keydown', (e) => {
    if (e.target !== span) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEditSheet(item); }
  });
  // 터치: 행을 길게 눌러 옮기기(B2). 체크박스·펼침 화살표는 제외
  t.addEventListener('pointerdown', (e) => {
    if (!e.pointerType || e.pointerType === 'mouse') return;
    if (e.target.closest('input, .cb-hit, .task-toggle, a, .task-actions')) return;
    longPress(e, t, {
      onStart: (ev) => {
        suppressRowClick(t, 600); // 놓은 뒤 따라오는 클릭이 편집 시트를 열지 않게(이 행만)
        onDragStart(ev, item, key, t);
      },
    });
  });
  span.addEventListener('click', (e) => {
    if (e.target.closest('a')) { e.stopPropagation(); return; } // 링크는 열기만, 편집 안 함
    if (rowClickSuppressed(t)) return;
    if (e.target.tagName === 'INPUT') return;
    openEditSheet(item);
  });

  const actions = document.createElement('div');
  actions.className = 'task-actions';

  const handle = document.createElement('button');
  handle.className = 'row-btn drag-handle';
  handle.title = '끌어서 옮기기';
  handle.setAttribute('aria-label', '끌어서 옮기기');
  handle.innerHTML = '⋮⋮';
  handle.addEventListener('pointerdown', (e) => onDragStart(e, item, key, t));
  handle.addEventListener('click', (e) => e.stopPropagation());
  actions.appendChild(handle);

  const del = document.createElement('button');
  // PC hover의 빨간 채움은 영구 삭제(보관함 🗑)에만 — 보관은 회색 📥(다듬기, C7과 같은 기호)
  del.className = 'row-btn';
  del.title = '보관함으로 옮기기';
  del.setAttribute('aria-label', `보관함으로 옮기기: ${item.text}`);
  del.innerHTML = '📥';
  del.addEventListener('click', (e) => { e.stopPropagation(); onDelete(item, t); });
  actions.appendChild(del);

  const hit = document.createElement('label');
  hit.className = 'cb-hit';
  hit.appendChild(cb);
  t.appendChild(toggle);
  t.appendChild(hit);
  t.appendChild(span);
  t.appendChild(actions);
  return t;
}

async function onSetupSave() {
